# A request pointing at a recording, which is the kind this answers fully.
#
# A recording is measured rather than looked up, so it needs no catalog entry
# and no citation: it is evidence of itself. What comes back is the nearest of
# the device's 224 amplifiers to what that file actually measures.
#
#     toneharness tone build --ask examples/tonespec/like-a-record.yaml \
#       --setup examples/tonespec/my-setup.yaml --out rig.yaml
#     toneharness presets compile --rig rig.yaml --out a.hlx

schema: ToneSpec

# Required even here, where the target is one recording rather than a
# population. The recording is what the answer is measured against; the genre
# says where it sits.
genre: [rock]

# How it should sound, in the words a person would use. A word carries its own
# evidence, where anybody has any; these two have none, which is the ordinary
# case for a request somebody typed. Turning a word into a knob position is
# the tool's job and not this document's.
#
# This example said `punchy` until 2026-09-26. The vocabulary does not carry it,
# because "punchy" answers two of the ten axes at once: the bottom stopping when
# the note does, and the front of the note being audible.
#
# That is a gap rather than a rule. Nothing stops a word answering two axes, and
# the contradiction check would be better for it: today `punchy` beside
# `loose-low-end` is a plain contradiction that nothing can see, because
# `punchy` is not a term at all. What is missing is how to split a word's step
# between two axes, and the honest answer is that nobody has measured it. See
# #155, which is blocked on the measurements rather than on the design.
#
# Meanwhile `toneharness tone build` reports a word it does not carry rather than
# refusing the file, so writing `punchy` is legal and moves nothing, which is
# the worse of the two outcomes.
words:
  - term: tight-low-end
  - term: dark

like:
  recording: resources/dry/bass-di.wav

# Gear the request names, where somebody wants a particular thing rather than
# a particular sound. Everything not named here is chosen by measuring.
gear:
  - gear: LA Studio Comp
    role: comp
