# The device half of a preset an HX Stomp wrote, committed as it came out.
#
# The gear is in examples/rigspec/dir-angl-meteor.yaml. Everything here is one
# manufacturer's vocabulary: the model each piece of gear resolved to, where it
# sat, and the routing, footswitches and snapshots a device wraps a chain in.
#
# `params` holds the device's own parameter names and `attrs` the @-prefixed
# attributes a chain has no opinion about, both verbatim, so writing this back
# produces the preset that was read.
#
# `rest`, under a footswitch, is everything the device stored there that this
# format does not model. Kept rather than dropped, which is what lets a preset
# survive a round trip through a format that does not claim to understand all
# of it.
#
# Keys are alphabetical, as a rig's are, so `name` and `rig` sit in the middle
# rather than at the top.

