---
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      # Only what can change the result. A docs-only pull request does not need
      # the suite, and markdown-lint, just-lint and commit-lint still run on it.
      # No status check here is required by branch protection, so a skipped run
      # does not block a merge.
      #
      # push to main stays unfiltered on purpose: main is verified after every
      # merge whatever it touched, and Codecov takes its baseline from that run.
      - "**.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".coverignore"
      - "justfile"
      - ".just/**"
      - ".mise.toml"
      - ".github/workflows/go.yml"
      # The tests read these: the reference recordings they measure through, the
      # catalog and corpus they assert against, the sweeps and corpora the
      # measuring tests load, and the marketplace's core tier, which
      # TestTheEmbeddedRigsAreTheMarketplacesCore holds the embedded copy
      # against.
      - "resources/**"
      - "pkg/sdk/**/data/**"
      - "marketplace/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs, because resources/dry/ holds the reference recordings the tests
      # measure through. Without it the checkout writes 130-byte pointer files
      # and the wav reader answers "the header names no channels".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: just deps
      - name: Test
        run: just test
      - name: Upload coverage reports to Codecov
        if: hashFiles('.github/codecov.yml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
