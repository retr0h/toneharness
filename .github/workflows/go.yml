---
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs, because resources/dry/ holds the reference recordings the tests
      # measure through. Without it the checkout writes 130-byte pointer files
      # and the wav reader answers "the header names no channels".
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Fetch justfiles
        run: just fetch
      - name: Deps
        run: just deps
      - name: Test
        run: just test
      - name: Upload coverage reports to Codecov
        if: hashFiles('.github/codecov.yml') != ''
        uses: codecov/codecov-action@v7
        with:
          files: .coverage/cover.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
