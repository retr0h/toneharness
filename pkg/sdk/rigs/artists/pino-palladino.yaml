# Pino Palladino — D'Angelo, Voodoo
#
# A P-Bass tuned down, flatwounds, tone rolled off, into a mic'd B-15. The
# rig is almost beside the point and the strings are not.
#
# The ask this rig answers is in pino-palladino.tone.yaml beside it.

schema: RigSpec
version: 2
id: pino-palladino

instrument: bass

chain:
  - role: amp
    gear: Ampeg B-15
    capture: miked
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: >-
          the Voodoo configuration, "recorded from the amp without using a
          DI"
      - kind: cited
        url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
        note: >-
          Pino, asked what he used to record: "I plugged into a miked Ampeg
          B-15, and I'm pretty sure that was the only signal we took."
        caveat: >-
          the one rig here whose records went through a microphone and a
          cabinet rather than to the desk. Claypool, Dirnt, Geddy and
          McCartney all went direct in whole or in part, so this chain
          describes what was recorded more literally than any other.
      - kind: user
        url: https://www.talkbass.com/threads/dangelo-voodoo.146620/
        note: >-
          Russell Elevado, who engineered the album, in a Q&A quoted by the
          poster rochishin: "for amps we used an Ampeg B15, B18 and an old
          solid state amp in a big cabinet that's at electric lady ... mics
          were fet47 ... and usually a pre or focusrite isa115 ... everything
          went to tape and no di's whatsoever on the album."
        caveat: >-
          first-hand from the engineer and second-hand to us: the gearslutz
          link in the post is dead, so what was read is the transcription.
          Three amplifiers were in use and this chain names one. "No di's
          whatsoever" is the line that makes this the only rig here whose
          cabinet is genuinely in the signal.
    confidence: high

  - role: cab
    gear: Ampeg B-15
    capture: miked
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        note: the B-15 is a combo, so the cabinet is the amplifier
    confidence: high
