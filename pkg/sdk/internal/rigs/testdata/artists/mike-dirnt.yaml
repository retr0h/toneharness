# Mike Dirnt — Green Day
#
# A rig names real-world gear, never Line 6 model IDs. "Ampeg SVT" resolves to
# HD2_AmpSVBeastNrm through the gear map, so this file stays readable, stays
# correct when Line 6 rename something, and works for any Helix device.
#
# The other half of this pair is mike-dirnt.tone.yaml beside it: who it is
# for, how it should sound and how it was played. This file is the gear alone.

schema: RigSpec
version: 2
id: mike-dirnt

instrument: bass

chain:
  - role: amp
    gear: Ampeg SVT
    evidence:
      - { kind: llm }
    confidence: medium
  - role: cab
    gear: Ampeg 8x10
    evidence:
      - { kind: llm }
    confidence: medium
