openapi: 3.0.3
info:
  title: ToneSpec
  version: "2.0.0"
  description: >
    What somebody wants to sound like, and the gear that answers it.


    One document. `rig` is the gear and is required; `ask` is why, in the words
    somebody used, and is optional. A sound you cannot describe the gear for is
    a sound nothing can model, which is what the solver has always said: an ask
    naming no gear and nothing measurable is refused. The schema used to say
    otherwise.


    A Setup is the other document and the only other one: what somebody owns,
    which changes when they buy something rather than when they want a different
    sound. It lives at $XDG_CONFIG_HOME/toneharness/setup.yaml and is read
    without being named.


    Version 2 merged this with RigSpec. The pair was one-to-one in every case
    that existed and an ask with no rig beside it was already impossible, so the
    second file was an annotation kept in step by hand. It also merged the ten
    schemas both contracts had defined separately, which were generating two Go
    types of the same shape and different identities.


    See docs/superpowers/specs/2026-10-01-one-document-rig-required-design.md.


    This document is the source for the Go types in pkg/sdk/tone/internal/gen.
    Do not hand-edit those; change this and run `just generate`.

paths: {}

components:
  schemas:
    ToneSpec:
      type: object
      additionalProperties: false
      description: >
        One sound: the gear that makes it, and what somebody asked for.
      required: [schema, id, rig]
      properties:
        schema:
          type: string
          enum: [ToneSpec]
          description: >
            What this document is, so a file says so rather than being guessed
            at by its extension.
        id:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: >
            The identifier, and the filename stem.


            Lower case and hyphenated, because it is both a name a person types
            and a file on disk. It was the rig's field and the ask had none: the
            filename was the identifier, which is still true and now said once.
        ask:
          $ref: "#/components/schemas/Ask"
        rig:
          $ref: "#/components/schemas/Rig"
    Ask:
      type: object
      additionalProperties: false
      description: >
        A request for a sound, in whatever terms the person has.


        Every field is optional and any combination is legal. "Punk, but on my
        Jazz" is a genre and a Setup; "like Dirnt but chunkier" is a player and
        a nudge. This is a request rather than a form, and a request nobody
        filled in completely is the ordinary case.


        It records what was said rather than instructing anything. `gear` and
        `like` are how a chain gets resolved while it is being resolved; once
        `rig` holds the answer they are provenance, and nothing re-reads them to
        overwrite a chain somebody edited by hand.
      required: [genre]
      properties:
        like:
          $ref: "#/components/schemas/Like"
        genre:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            pattern: "\\S"
          description: >
            The genres this sound belongs to, as words rather than a fixed
            list.


            A list, because a record belongs to more than one and the corpus
            already says so: the same three players are tagged both `punk` and
            `pop-punk`, and a single word would drop one of them. What it names
            is which distribution the sound sits in, not how it sounds; the
            words it earns are measured, and `measure genres` is what earns
            them.


            Required, because a request nobody can place in any company is a
            request nothing can be compared against. Every other field here is
            optional and this one is not, which is the contract saying that a
            sound without a population is not a sound this can aim at.


            Not an enum, because enumerating genres in a contract means a
            release to add one and the thing that decides whether a genre
            works is not the schema. It is whether enough records carry the
            tag to have a distribution: eight from at least three artists to
            be usable. A genre below that is reported rather than computed
            from, because three records by one band is that band's sound
            wearing a genre's name.
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
          description: >
            How it should sound, in the words a person would use.


            Checked against the shipped vocabulary, because a word that
            reaches no control cannot be aimed at and saying so is better than
            accepting it and quietly doing nothing. words.json lists
            every word and what each one moves.
        gear:
          type: array
          items: { $ref: "#/components/schemas/Wanted" }
          description: >
            Gear the request names, when somebody wants a particular thing
            rather than a particular sound.
        nudges:
          type: array
          items: { $ref: "#/components/schemas/Nudge" }
          description: >
            Moves from wherever the last answer landed.


            Different in kind from everything above, which names a target.
            Conversation is made almost entirely of these, and a request that
            can only state targets cannot take the instruction "darker".
        note:
          type: string
          description: >
            Anything the fields above cannot hold. Read by a person, not by
            the compiler.
        extends:
          type: string
          description: >
            Another ask this one departs from, by identifier. Only for one that
            genuinely is a small change: asks that differ at the amplifier are
            siblings rather than deltas.


            An ask carries no identifier of its own. A stored one is named by
            its file, because a filename already is an identifier and carrying
            both is carrying something that can disagree with itself.
        aliases:
          type: array
          items: { type: string, minLength: 1 }
          description: >
            Other names this request answers to.


            People ask for a band as readily as a player, and for a nickname
            as readily as either. An alias costs nothing and saves somebody
            guessing which of them was written down.
        subject:
          $ref: "#/components/schemas/Subject"
        instrument:
          type: string
          enum: [bass, guitar]
          x-enum-varnames: [InstrumentBass, InstrumentGuitar]
          description: >
            What this is for, where the request asserts it rather than
            leaving it to the Setup.


            A request about a bass player is about a bass whoever is holding
            it. A Setup naming an instrument still wins, because that is what
            the person actually has.
        default:
          type: boolean
          description: >
            The one to assume when somebody names the subject and not the
            request. A player whose sound changed has several, and one of
            them is what "sounds like them" means.
        technique:
          $ref: "#/components/schemas/Technique"
        played:
          type: array
          items: { $ref: "#/components/schemas/Played" }
          description: >
            The instrument the subject played, where it is known.


            Different from a Setup's instruments, which is what the person
            asking has in their hands. Both matter and they are not the same:
            the difference between them is a correction the answer can make.
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why the request as a whole is believed, for claims that belong to
            no single field.
        corrections:
          type: array
          items: { $ref: "#/components/schemas/Correction" }
          description: >
            What was asked for after hearing the last answer, and what the
            person made of the result.


            On the ask rather than on the plan, because a correction is a
            round of asking. The plan it changed holds the current settings
            and says nothing about why they are what they are.
    Rig:
      type: object
      additionalProperties: false
      description: >
        The gear that answers an ask, in signal order, with a source for every
        claim.


        Real-world names rather than model identifiers, which is what lets one
        rig compile for any Helix. The identifier and the schema moved up to the
        document; everything else is as it was.
      required: [instrument, chain]
      properties:
        instrument:
          $ref: "#/components/schemas/Instrument"
        chain:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChainEntry" }
          description: The signal path, in order.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why the gear as a whole is believed, for a citation that covers the
            chain rather than one entry of it.


            On the rig rather than on the ask, by the same argument that kept
            the per-entry evidence here: a published rig that cannot say why
            this gear is a rig nobody can check. A rig rundown covers every
            piece of gear in it, and requiring the citation to be repeated on
            each entry would only encourage repeating it.


            A ToneSpec has an `evidence` of its own and it is a different claim.
            Why the request was made is the ask's; why this gear answered it is
            this one's.
        sections:
          type: array
          items: { $ref: "#/components/schemas/Section" }
          description: >
            The parts of a song this rig plays, each one a snapshot.


            The way to write snapshots by hand, and the one part of the
            arrangement that stays here: a section is what somebody plays
            rather than anything the device holds.


            Sections or snapshots, never both: a plan's snapshots are what a
            device stored, sections are what somebody wants, and a build given
            both would have to pick one without saying so. A device has a fixed
            number of snapshots, three on an HX Stomp, and more sections than
            that will not build.
        moves:
          type: array
          items: { $ref: "#/components/schemas/Move" }
          description: >
            What an expression pedal or a footswitch sweeps, by role and setting
            word.


            Beside `sections` and portable for the same reason: both say what
            somebody does rather than what a device holds. A plan's
            `controllers` is what these become once a device has been chosen,
            and a rig read off a device carries those rather than these.


            A rig may say both, because they answer different questions: a
            section is which blocks play, a move is which knob a foot reaches.
    Capture:
      type: string
      description: >
        How this reached the tape: down a cable, through a microphone, or
        both blended.


        A cabinet models the air in front of a speaker, and on most bass
        records there was none. Five of the nine rigs here measure a signal
        that went to the desk: Geddy Lee set the rule on Caress of Steel in
        1975 and kept it, "Use the direct bass from the low-end pickup, and
        mike the amp for the high-end pickup"; Les Claypool put a microphone
        up and never used it; Mike Dirnt ran an Evil Twin direct box from
        Dookie on. Pino Palladino is the one who was only ever miked, and the
        engineer says so: "no di's whatsoever on the album". Jaco Pastorius
        took both at once, "a little bit of both, the highs and lows".


        This changes no preset. Every chain still ends in a cabinet, because
        a preset with none into a PA is not the sound either. It is here so
        that a figure measured off a record is legible against what the
        record was made of, and so nobody reads a cabinet as a claim that one
        was in the signal.
      enum: [direct, miked, both]
      x-enum-varnames: [CaptureDirect, CaptureMiked, CaptureBoth]
    Confidence:
      type: string
      description: >
        How far a claim should be trusted. Set by a person, not derived. A
        claim asserting high confidence with no evidence behind it is worth
        showing as unverified whatever it says about itself.
      enum: [low, medium, high]
      x-enum-varnames: [ConfidenceLow, ConfidenceMedium, ConfidenceHigh]
    Evidence:
      type: object
      additionalProperties: false
      description: >
        Why one claim is believed. Attached per claim rather than per
        document, because the amp may come from an interview and the drive
        figure from measuring a corpus.


        A URL does not make a claim true. It makes it checkable, which is what
        lets somebody correct one line instead of re-deriving a rig.
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/EvidenceKind"
        url:
          type: string
          pattern: "^https?://\\S+$"
          x-go-name: URL
        at:
          type: string
          pattern: "^\\d{1,2}:\\d{2}(:\\d{2})?(-\\d{1,2}:\\d{2}(:\\d{2})?)?$"
          description: >
            Where in the source — a timestamp such as "1:42", or a range.
        note:
          type: string
        caveat:
          type: string
          description: >
            What the source does not show. Live footage carries the room and
            the PA; a studio track carries the mix.
        measured:
          type: object
          additionalProperties: { type: number, format: double }
          description: >
            Figures taken from audio, keyed by feature. Measuring a record
            measures the record: the bass, the player, the amp, the mic, the
            desk and the master. So these compare against another measurement
            rather than name a knob position.
        against:
          type: object
          additionalProperties: { type: number, format: double }
          description: >
            The same figures for the players this one was compared against,
            keyed the same way. Written by `toneharness measure --corpus`,
            which is where a word is earned.


            This is what turns a word into a distance. A term whose evidence
            carries both sides moves its control by the gap between them
            rather than by a fixed step, so a player who reads a little
            cleaner than everybody else gets a little less drive, and one who
            reads twice as clean gets the whole step.


            A figure on its own says nothing about how far to move anything:
            12% of the energy above the fundamental is high or low only
            against what other players read.
        spread:
          type: object
          additionalProperties: { type: number, format: double }
          description: >
            How wide the middle half of those players is, keyed the same way,
            and the scale that makes `against` readable.


            A distance is large or small only against a spread. One hertz clear
            of players spanning two hundred is noise that rounded the right way;
            one hertz clear of players spanning three is the axis telling them
            apart. Both read as "clear by 1 Hz" and nothing said which was which.


            It is also what dates a word. A word is earned against whoever else
            was measured, so adding players rewrites verdicts nobody touched:
            one genre here held `scooped` until eighteen records from another
            joined the corpus and closed the gap. A word carrying the spread it
            beat says what it was true of, so a stale one can be seen instead of
            inferred.


            Not a threshold. Nothing refuses a word for sitting close, because
            the floor that exists is the measure's own precision rather than a
            number somebody chose. This is what lets a reader discount a word
            and a build move a control less far for one that barely earned it.
    EvidenceKind:
      type: string
      description: >
        How something came to be believed. Open by design: a new way of
        learning is a new value here, not a new document.


        Strongest first, ranked by how far somebody has to go to disagree:


        `heard` is a person who played the rig and judged it. Nothing in this
        system can hear, so a verdict outranks everything else. A mutation's
        verdict records a round of correction; this kind attaches that
        judgement to the claim it settled.


        `cited` is a published rig rundown or interview. Somebody with access
        wrote down what the player used.


        `audio` is a measurement taken from a record, carried in `measured`.
        Anybody holding the record can take it again, which puts it above a
        forum post. It sits below a citation because the record holds the
        studio as well as the player.


        `user` is a forum thread, TalkBass or Reddit: argued and corrected in
        public, and uneven.


        `video` is footage. Good for how it sounds and how it is played, weak
        for which box was on stage.


        `corpus` is a statistic over the preset corpus, what other people's
        presets do. It is not the music under resources/music/, which is
        evidence of kind `audio`.


        `llm` means a model asserted it and nobody checked — reliable for
        well-known players, unreliable for obscure ones, and the model cannot
        always tell which it is doing.


        `store` is where content that did not ship with the device comes from,
        bought or free. It is the one kind that answers "where do I get this"
        rather than "why is this believed", and a substitute naming something
        nobody can obtain is worth nothing without it.
      enum: [heard, cited, audio, user, video, corpus, llm, store]
      x-enum-varnames:
        [
          EvidenceHeard,
          EvidenceCited,
          EvidenceAudio,
          EvidenceUser,
          EvidenceVideo,
          EvidenceCorpus,
          EvidenceLLM,
          EvidenceStore,
        ]
    Kind:
      type: string
      description: >
        What a rig is attributed to. Artist is the common case, but a rig can
        belong to a song, a genre, or to nothing at all.
      enum: [artist, band, song, genre, sound]
      x-enum-varnames: [KindArtist, KindBand, KindSong, KindGenre, KindSound]
    Played:
      type: object
      additionalProperties: false
      description: >
        The instrument itself, which no device models and every figure
        carries.


        A rig names an amplifier, a cabinet and pedals, and the thing making
        the sound is upstream of all of them. Jaco Pastorius reads a 259Hz
        centroid against 170Hz for the other players, and the reason is a
        fretless played near the bridge; Geddy Lee earns mid-forward on a
        Rickenbacker. Without this those belong to nothing, and a measured
        word moves an amplifier control that was never responsible for the
        figure.


        It resolves to no block and changes no preset. It is here so that two
        rigs on the same amplifier are legible as different sounds, and so
        that somebody reading a figure knows how much of it left the
        instrument that way.
      required: [gear]
      properties:
        gear:
          type: string
          minLength: 1
          pattern: "\\S"
          description: >
            The instrument, as a person would say it: "Rickenbacker 4001",
            "Fender Jazz Bass, fretless", "Hofner 500/1".
        strings:
          $ref: "#/components/schemas/Strings"
        records:
          type: array
          items: { type: string, minLength: 1 }
          description: >
            Which measured records this instrument made, by their track names
            in the corpus manifest.


            Not called `on`. YAML reads a bare `on` as the boolean true, so
            the field parsed as a property named "true" and the rig was
            refused. The same trap takes `off`, `yes` and `no`.


            The same join the corpus already uses: a directory is named for a
            rig, and a track is named for itself. Naming them here is what
            lets a figure be read against the thing that made it rather than
            against the player's whole catalogue.


            Leave it out where nobody knows. Flea says he recorded on two 1961
            Jazz Basses and never says which took which track, so neither
            entry carries one. Les Claypool's six is on two of his four, and
            saying so is what stops the other two being explained by it.


            Getting this wrong is not free. A rig here once explained a 162Hz
            spread across one session as a four-string and a six-string, and
            the source it already cited said both records were the six.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why this is believed. A player owns several instruments and uses
            one of them on a record, so this needs a source the way the
            amplifier does.
    Role:
      type: string
      description: >
        What a piece of gear does in a chain. The same vocabulary the catalog
        groups blocks by, so a role resolves without translation.


        `utility` is plumbing — volume, gain, a send, a looper. Nobody chooses
        one for how it sounds, and a chain still contains them, so a rig that
        could not name one could not describe a real preset.
      enum:
        [
          amp,
          cab,
          drive,
          comp,
          gate,
          eq,
          mod,
          delay,
          reverb,
          wah,
          pitch,
          filter,
          utility,
          other,
        ]
      x-enum-varnames:
        [
          RoleAmp,
          RoleCab,
          RoleDrive,
          RoleComp,
          RoleGate,
          RoleEQ,
          RoleMod,
          RoleDelay,
          RoleReverb,
          RoleWah,
          RolePitch,
          RoleFilter,
          RoleUtility,
          RoleOther,
        ]
    Subject:
      type: object
      additionalProperties: false
      description: >
        Who or what this rig belongs to.


        A field rather than the document's shape, because people ask for a
        player, a song, a genre and a bare description in the same breath, and
        making one of them primary makes the rest second-class.
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
        name:
          type: string
          minLength: 1
          # Something other than spaces: a name of blanks is not a name.
          pattern: "\\S"
        band:
          type: string
          description: The group, where the subject is a person.
        era:
          type: string
          description: >
            When this rig applies, as a person would say it: "1994",
            "American Idiot". A player's rig changes; a rig that does not say
            when it applies claims to be timeless and usually is not.
        years:
          $ref: "#/components/schemas/Years"
    Years:
      type: object
      additionalProperties: false
      description: >
        The same era as years, so a machine can hold records to it.


        `era` is prose and prose cannot be checked. A rig's audio evidence is
        measured from records, and a record made on other gear measures other
        gear: Paul McCartney's rig describes an Acoustic 360, which did not
        exist when one of his measured records was cut. `toneharness rigs
        records` reads these and says which records fall outside the rig they
        are attached to.


        One year is a rig that applied for one year: from and to the same.
      required: [from, to]
      properties:
        from:
          type: integer
          minimum: 1900
          maximum: 2100
          description: The first year this rig describes.
        to:
          type: integer
          minimum: 1900
          maximum: 2100
          description: The last year, which may be the first.
    Change:
      type: object
      additionalProperties: false
      description: One field a correction moved.
      required: [path]
      properties:
        path:
          type: string
          pattern: "^[a-z]+(\\[\\d+\\])?(\\.[a-zA-Z_][a-zA-Z0-9_]*(\\[\\d+\\])?)*$"
          description: >
            What moved, as a path into the plan this correction changed —
            "chain[1].settings.drive".
        from: {}
        to: {}
    Correction:
      type: object
      additionalProperties: false
      description: >
        One round of correction, and what a person made of the result.


        This is the only place a human ear's judgement is written down.
        Nothing in this system can hear; every other input is a measurement or
        an assertion. A verdict is the one piece of information that cannot be
        recovered later if it is not captured when it happens.


        Append-only, and never replayed: the plan always holds the current
        state. Reconstructing a rig from its history would be more elegant and
        much worse to read, and a person reads this file.
      required: [ask]
      properties:
        ask:
          type: string
          minLength: 1
          # Something other than spaces: a name of blanks is not a name.
          pattern: "\\S"
          description: >
            What was asked for, in the words used. "Clunky" is not a
            parameter, and normalising it away loses the question.
        changed:
          type: array
          items: { $ref: "#/components/schemas/Change" }
        reason:
          type: string
          description: >
            Why the ask was read that way, cited where possible. This is what
            lets a later reader see that the interpretation was wrong, rather
            than only that the value was.
        verdict:
          type: string
          description: >
            What it sounded like. Absent means not yet evaluated, which is
            useful state rather than a gap.
        at:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: When, so a run of corrections can be read in order.
    Device:
      type: object
      additionalProperties: false
      description: >
        The hardware, which decides what a chain may cost and what it may
        hold.
      required: [model]
      properties:
        model:
          type: string
          minLength: 1
          description: >
            As Line 6 name it: "HX Stomp", "Helix Floor".
    Like:
      type: object
      additionalProperties: false
      description: >
        Something to sound like: a player, a band, a song, or a recording
        handed over.


        A player becomes the middle of their records with the spread across
        them as a tolerance, so an axis their records disagree about is one the
        answer need not be precise on. A recording becomes its own figures, and
        is the only fully specified target of the three.
      properties:
        artist:
          type: string
          minLength: 1
        band:
          type: string
          minLength: 1
        song:
          type: string
          minLength: 1
        recording:
          type: string
          minLength: 1
          description: >
            A path to audio to aim at. Measured rather than searched for, so
            it needs no catalog entry and no citation: it is evidence of
            itself.
        years:
          $ref: "#/components/schemas/Years"
    Nudge:
      type: object
      additionalProperties: false
      description: >
        A move along one axis from where the chain currently is.


        Not a target: "darker" names no point. It is a direction and a size,
        and the size is in steps rather than in a figure's own units because
        the person saying it does not know what a centroid is. One step is a
        change somebody would call noticeable.
      required: [word]
      properties:
        word:
          type: string
          minLength: 1
          description: >
            The word said, which names the axis and the direction together:
            `darker` is the highs axis, downward.
        steps:
          type: number
          default: 1
          minimum: 0.1
          maximum: 5
          description: >
            How far. One is the default and means a noticeable move; "much
            darker" is larger and "a touch darker" is smaller.
    Owned:
      type: object
      additionalProperties: false
      description: >
        One thing on the device that did not ship with it.
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [ir, model]
          x-enum-varnames: [OwnedIR, OwnedModel]
        name:
          type: string
          minLength: 1
        slot:
          type: integer
          minimum: 0
          description: >
            Where it is loaded, for an impulse response, which a preset
            references by position rather than by name. A preset written
            against somebody else's numbering points at whatever they happen
            to have there.
    PlaysInto:
      type: string
      enum: [pa, headphones, amp-front, amp-return]
      description: >
        What the pedal is plugged into, when somebody says.


        Optional, and it changes nothing on its own. It is recorded because
        the last thing in the path is not always the cabinet block, and a
        chain built without knowing which is a chain built for a guess.


        `pa` is a PA, a full-range speaker or an interface: nothing after the
        pedal colours the sound, so whatever speaker is wanted has to be in
        the chain. `headphones` is the same path with the room left out.


        The two amp entries are not one answer. `amp-front` goes into the
        instrument input, so the amplifier's own preamp is in front of its
        speaker and the chain is stacked on top of a whole amplifier.
        `amp-return` goes into the effects return, which bypasses that preamp
        and leaves the power section and the speaker.


        **This does not say whether to use a cabinet block.** That is the
        question it exists to let somebody ask rather than the answer: a
        cabinet block is how a chain is made to sound like a recorded rig, so
        somebody chasing a record may want one whatever they are plugged into,
        and somebody who wants their own amplifier to be the sound may not.
        Both are reasonable and the difference is taste rather than fact.


        What it is not is a tone correction. Nothing here has measured an
        amplifier in anybody's room, and an equalisation applied for one would
        be a number nobody took. Every figure this project ships was measured
        through a cabinet block into a computer, which is one of these four,
        and a reading is worth less to somebody on another.
    Setup:
      type: object
      additionalProperties: false
      description: >
        What somebody has.


        Separate from the ask because it changes on a different clock. Folding
        an instrument into a request would mean restating the bass, the
        strings and the pedal every time, and the twelfth request
        contradicting the first.


        It is also what makes an answer fit the person rather than the record.
        Every figure in the corpus was measured off somebody else's
        instrument, and the difference between that and the one being held is
        a knob position nothing could hold before this existed.
      required: [schema]
      properties:
        schema:
          type: string
          enum: [Setup]
        device:
          $ref: "#/components/schemas/Device"
        instruments:
          type: array
          items: { $ref: "#/components/schemas/Held" }
          description: >
            What they play. More than one, because most people have more than
            one and they do not sound the same.
        owns:
          type: array
          items: { $ref: "#/components/schemas/Owned" }
          description: >
            Content the device does not ship with: impulse responses somebody
            loaded, models somebody bought.


            A preset naming one of these on a device that does not have it is
            silent in that block, and nothing could tell before this: the
            catalog knows what ships and only the owner knows what else is
            there.
        plays_into:
          $ref: "#/components/schemas/PlaysInto"
        technique:
          $ref: "#/components/schemas/Technique"
          description: >
            How this person plays, which is the other side of the comparison
            the Technique schema describes.


            Here rather than on a request for the reason everything else here
            is: a right hand changes on the same clock as a bass, which is to
            say hardly ever, and restating it per request is how the twelfth
            one comes to contradict the first.


            What it buys is the one compensation nothing could make before.
            A rig tuned from a picked recording is duller played with fingers,
            because a pick puts high-frequency attack into every note that
            fingers do not. With both sides stated, the difference is a knob
            position rather than a surprise at the first rehearsal.
    Strings:
      type: string
      description: >
        What is on it.


        Flatwounds and roundwounds are a larger difference than most pedals,
        and the difference between what a record was made on and what is being
        held is a correction the answer can make. Unknown is honest and
        useful: it says nobody checked rather than implying either.
      enum: [round, flat, tape, unknown]
      x-enum-varnames: [StringsRound, StringsFlat, StringsTape, StringsUnknown]
    Technique:
      type: object
      additionalProperties: false
      description: >
        How the instrument is played, where it changes the sound. Not modelled
        by any device, and it still decides what the rig has to do.


        Three things rather than a sentence, because three things are being
        said and a sentence has to be parsed to get at them.


        Two places, and they are different claims. On a subject this is how
        the player being emulated played. On a Setup it is how the person
        holding the instrument plays.


        The distinction is not pedantry. A pick puts high-frequency attack
        into every note that fingers do not, so a rig tuned from a picked
        recording sounds duller played fingered, and the fix is in the amp and
        the compressor rather than in the player. Stating both sides lets the
        difference be compensated rather than discovered, and that comparison
        needs both to be the same kind of value: two `attack` values can be
        held against each other, and two sentences cannot.
      required: [attack]
      properties:
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why this is believed. Nothing measures how somebody plays out of a
            preset, so a claim here is asserted or it is watched, and which of
            those it was belongs beside it.
        attack:
          type: string
          description: >
            What sets the string moving. Required, because there is no playing
            without one.
          enum: [pick, fingers, slap, thumb, hybrid]
          x-enum-varnames:
            [AttackPick, AttackFingers, AttackSlap, AttackThumb, AttackHybrid]
        position:
          type: string
          description: >
            Where along the string, which decides how much fundamental there
            is against harmonics. Omit it where it does not matter.
          enum: [bridge, middle, neck]
          x-enum-varnames: [PositionBridge, PositionMiddle, PositionNeck]
        muting:
          type: string
          description: >
            What damps the string. Omit it where it does not matter, and say
            `none` where the notes ringing on is part of the sound rather than
            the absence of a decision.
          enum: [none, palm]
          x-enum-varnames: [MutingNone, MutingPalm]
    Wanted:
      type: object
      additionalProperties: false
      description: >
        A piece of gear the request asks for by name.


        Named as a person would: "Ampeg SVT", never a model identifier. What
        the device has to offer for it is the tool's problem.
      required: [gear]
      properties:
        gear:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/Role"
        capture:
          $ref: "#/components/schemas/Capture"
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why this piece of gear is believed to be the right one.


            Per claim rather than per document, because the amplifier may come
            from an interview and the compressor from measuring a corpus.
        insist:
          type: boolean
          default: false
          description: >
            Refuse rather than substitute.


            False, the default, takes the nearest thing the device models and
            says what it did. True fails the request instead, which is what
            somebody means when the gear is the point rather than the sound.
        after:
          $ref: "#/components/schemas/Role"
          description: >
            Put this behind that role instead of where it usually goes.


            Gear a request lists is sorted into the ordinary signal path,
            because listing gear is not stating a signal path: a compressor
            goes in front of the amplifier whichever order somebody typed
            them. That is right for the common case and wrong for somebody
            who means it.


            A drive behind the amplifier is the case worth naming. It is a
            known way to use one rather than a mistake, and there was no way
            to ask for it: the only route was to build the rig and edit a
            line of it afterwards, which is an edit nobody records the reason
            for.


            Naming a role rather than a number, because a request does not
            know how many blocks the chain will end up with. "After the amp"
            survives the compiler adding a cabinet; "position 4" does not.
    Word:
      type: object
      additionalProperties: false
      description: >
        One thing it should sound like, and why that is believed.


        Describe the result rather than the control: "mid-forward, not scooped",
        never "raise the mids". Where the treble knob sits is a fact about
        somebody's amplifier; how the record came out is a fact about the sound,
        and only the second survives being read on other gear.


        A word moves controls when a preset is built: six axes act, each word
        worth one step from wherever the corpus left that control and never more
        than a quarter of its range. How far it moves is sized from the evidence
        here, so the evidence is not decoration. It is the difference between a
        knob moved because somebody listened and a knob moved because a model
        guessed.


        An object rather than a bare string, and it was a bare string until
        2026-09-26. Flattening it lost the weighting: every word moved a control
        by the same amount whether somebody had measured it or a model had
        asserted it, which is the guessing this project exists to remove.


        A word outside the shipped vocabulary is reported and kept, not refused:
        it moves nothing, and refusing an ask over a word would make the format
        hostile to the person it exists for.
      required: [term]
      properties:
        term:
          type: string
          minLength: 1
          pattern: "\\S"
          description: How it should sound, in the words a person would use.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: Why this is believed.
    ChainEntry:
      type: object
      additionalProperties: false
      description: >
        One piece of gear, in signal order.


        Order is the signal path. It is not decoration: drive ahead of an amp
        overdrives its input, drive after it does something else entirely.
      required: [role, gear]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        gear:
          type: string
          x-lookup: the gear the catalog maps a model to
          minLength: 1
          # Something other than spaces: a name of blanks is not a name.
          pattern: "\\S"
          description: >
            Real-world gear, as a person would say it — "Ampeg SVT", "Klon
            Centaur". Never a device model identifier: those are one
            manufacturer's internal names, they change, and they do not
            survive being read on other hardware.
        capture:
          $ref: "#/components/schemas/Capture"
        stage:
          type: boolean
          description: >
            Whether this entry documents a stage rather than a record.


            A rig rundown photographs a backline. The corpus measures
            records. Both are true and they are not the same rig, and the
            second kind of wrong-era mistake is evidence from the right years
            describing the wrong room. Four of the nine rigs here name gear
            that is only ever documented on tour.


            Set it where the only evidence is a tour, so a reader knows the
            figures and the gear were never in the same room.
        substitute:
          $ref: "#/components/schemas/Substitute"
        settings:
          $ref: "#/components/schemas/Settings"
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        confidence:
          $ref: "#/components/schemas/Confidence"
    Controller:
      type: object
      description: >
        One parameter something moves: an expression pedal, or a footswitch
        set to sweep a knob rather than switch a block.


        A plan records these because they are decisions somebody made about
        how they play, not device state. Nothing else says that the pedal
        under your foot is on the amp's drive rather than its volume.
      properties:
        controller:
          type: integer
          minimum: 0
          description: >
            Which controller, as the device numbers them. The expression
            pedal reads 2 on an HX Stomp.
        block:
          type: integer
          description: >
            Which block it works on, counted along the signal path the way
            the chain counts its entries.
        path:
          type: integer
          description: >
            Which processor the block is on. Omitted means the first, which is
            the only one an HX Stomp has.


            A block number alone does not say which block on a device with two
            of them: both paths count from zero, so a chain laid across them
            has two blocks numbered 0 and an assignment naming one of them
            could move either.
        parameter:
          type: string
          x-lookup: the parameters the model at that block has
          description: >
            The parameter it moves, by the name the catalog gives it —
            "Pedal", "Drive", "Mix".


            A device names nothing: it stores the parameter's place in the
            model's own order, and only the catalog turns that into a word.
            A rig carrying the number would be unreadable and would break the
            moment a firmware release reordered anything.
        min:
          type: number
          description: What the parameter reads with the controller at rest.
        max:
          type: number
          description: What it reads with the controller all the way over.
        no_snapshot:
          type: boolean
          description: >
            Whether snapshots leave this assignment alone. Omitted means they
            do not.
      required: [controller, block, parameter]
      additionalProperties: false
    DeviceState:
      type: object
      additionalProperties: false
      description: >
        Everything a preset carries that this format does not model as musical
        intent, kept exactly as the device wrote it.


        A plan says which model each piece of gear resolved to and what every
        knob is set to. A preset also carries the blocks a device puts either
        side of a chain and metadata nobody documented. None of that is
        intent, and all of it is somebody's work.


        Without this a plan read out of a preset could not rebuild it: the
        routing would be gone and the metadata would be whatever the template
        happened to hold.


        Written by lifting a preset, and only then. A rig somebody typed has
        none of it, and compiling one falls back to an untouched preset the
        device itself wrote.
      properties:
        id:
          type: integer
          description: >
            Which device wrote it. Line 6 identify a model by a number here,
            and a preset carrying the wrong one is refused.
        version:
          x-go-type: json.RawMessage
          description: >
            The device firmware's own version field, kept in whatever form it
            arrived. Presets in the wild spell it as a number and as a string,
            and rewriting one as the other changes a file nobody asked to
            change.
        format:
          type: integer
          description: The preset schema version the file declares.
        name:
          type: string
          description: >
            The preset's name exactly as the device stored it.


            Distinct from the rig's subject, which is a name for a sound a
            person chose. This one is a label, padding and all, and presets in
            the wild carry leading spaces that a rig would otherwise tidy away
            — rewriting a file nobody asked to change.
        file:
          type: object
          x-go-type: json.RawMessage
          description: >
            What the file records about itself, outside the preset payload.
            Uncommon, and carried because some presets have it.
        meta:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
          description: >
            Everything a preset records about itself except its name, which is
            the rig's subject. Presets carry song, band, author, tnid and an
            application version spelled two different ways.
        tone:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
          description: >
            Entries beside the processors — controller assignments, snapshot
            names and state, global and Variax settings.


            Footswitch and snapshot decisions are musical, and losing them
            silently is the worst outcome here: the preset still loads and the
            player finds out on stage.
        routing:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
          description: >
            The entries inside each processor that are not blocks: inputs,
            outputs, and the split and join of a parallel path.


            98.6% of real presets carry these and one assembled from nothing
            carries none, so a rig that dropped them would rebuild into a
            preset that routes differently from the one it came from.
    Footswitch:
      type: object
      additionalProperties: false
      description: >
        One thing a switch on the pedal does.


        A switch can carry more than one assignment — two blocks toggled
        together are two entries naming the same switch — so this is a list
        rather than a map.
      properties:
        switch:
          type: integer
          minimum: 1
          description: >
            Which footswitch, counted the way the pedal prints them: FS1 is 1.


            Without this a label says nothing about where to look.
        block:
          type: integer
          description: >
            Which block the switch works on, by the number the preset stores
            it under rather than its place in the chain. The two differ.
        path:
          type: integer
          description: >
            Which processor the block is on. Omitted means the first, which is
            the only one an HX Stomp has.
        label:
          type: string
          description: >
            What the pedal prints under the switch.


            Somebody's own words when they set them, and the block's name when
            they did not. "60s / 70s" is what a player reads on stage; the
            block behind it is an Ampeg B-15NF.
        gear:
          type: string
          description: >
            The block the switch works on, by name, whatever the label says.
        led:
          type: string
          x-lookup: the colours the catalog reads off the device
          description: >
            The colour somebody chose for the switch, by name — `green`,
            `violet`, `off`.


            `auto` is the default and the interesting one: the light follows
            the block rather than a choice, which is why an untouched preset
            lights its switches red for an amp, amber for drive and blue for
            modulation without anybody setting anything.


            Written as the number the device files the colour under, which
            is its place in the catalog's own list: 0 is automatic, 2 is red,
            11 is off. A preset stores that number under `@fs_customcolor`,
            and 1,162 assignments in the corpus carry one.


            `colour` beside it is a different thing: the light the switch
            shows when nobody chose, which the device works out from the
            block.
        colour:
          type: integer
          description: >
            The colour it lights, as the packed number a preset file stores.


            This is the automatic colour rather than the choice, which is
            `led`: measured over 17,665 assignments in the corpus it tracks
            the block's own kind —
            red for an amp or cabinet, amber for drive, green for delay, blue
            for modulation, purple for a filter, pitch block or wah, orange
            for reverb — at two brightnesses, bright while the block is
            engaged and dim while it is bypassed.
        enabled:
          type: boolean
          description: Whether the switch acts on the block at all.
        momentary:
          type: boolean
          description: >
            Whether the switch holds while pressed rather than latching.
        primary:
          type: boolean
          description: >
            Whether this is the assignment the switch shows when more than one
            block is on it.
        rest:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
          description: >
            Anything else the device stored here, kept as it arrived, so a
            field this does not model is not a field it drops.
    Instrument:
      type: string
      description: >
        Selects which half of a device's catalog is eligible. Line 6 tags
        every amp and cabinet Guitar or Bass; everything else serves either.
      enum: [guitar, bass]
      x-enum-varnames: [InstrumentGuitar, InstrumentBass]
    Knob:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: >
        One control, from 0 to 1, whatever the device's own range is.


        Scaled onto the control when the preset is written, so 0.5 is halfway
        up whether the device counts 0 to 1, -12 to 12 or 20 to 20000.
    Move:
      type: object
      description: >
        One control something sweeps, said portably: what moves it, which piece
        of gear, and which of the rig's own setting words.


        The counterpart of `sections`, and portable for the same reason. A
        plan's `controllers` names a block by its position and a parameter by
        the name one manufacturer gives it, and neither exists until a device
        has been chosen. A rig names a role and a setting word, which mean the
        same thing on any hardware, and the build turns the pair into the
        numbers the device wants.


        So a rig can finally say "the pedal under my foot is on the amp's
        drive", which is a fact about how somebody plays rather than about a
        Helix, and two people compiling the same rig get the same assignment.
      properties:
        by:
          type: string
          enum: [expression, footswitch]
          description: >
            What moves it. `expression` is a pedal, `footswitch` is a switch set
            to sweep a knob rather than turn a block on and off.


            Named rather than numbered, because the number is one device's:
            an expression pedal reads 2 on an HX Stomp and a rig saying 2 would
            be saying something about that pedal instead of about the music.
        role:
          $ref: "#/components/schemas/Role"
          description: >
            Which piece of gear it moves, by what that gear does. The first
            block in the chain with this role, the same way a word on the ask
            reaches the first amplifier.


            A role the chain has no block for is refused, because a rig
            assigning a pedal to a drive it does not have describes a pedal
            that does nothing.
        setting:
          type: string
          enum: [drive, bass, mid, treble, presence, level, mix]
          description: >
            Which control, in the same vocabulary `settings` uses, so it lands
            on whichever parameter the model has for the word: `drive` reaches
            a Drive or a Gain, `level` reaches a Level, a Ch Vol, a Master, a
            Volume or an Output.


            A word the model has no control for is refused with the words it
            does take, exactly as a setting is.
        min:
          type: number
          minimum: 0
          maximum: 1
          description: >
            What the control reads with the pedal at rest, from 0 to 1 over the
            control's own range. Omitted means the bottom of it.
        max:
          type: number
          minimum: 0
          maximum: 1
          description: >
            What it reads with the pedal all the way over. Omitted means the top
            of the control's range, which is the full sweep.
        no_snapshot:
          type: boolean
          description: >
            Whether snapshots leave the assignment alone, which keeps a section
            change from moving the pedal out from under your foot. Omitted means
            they move it.
      required: [by, role, setting]
      additionalProperties: false
    Section:
      type: object
      additionalProperties: false
      description: >
        One part of a song, as the blocks that play in it: a verse with the
        drive off, a chorus with it on.


        Written as roles rather than block numbers, because a person thinks
        "drive on for the chorus" and a hand-written rig has no block numbers
        to name. Each section becomes a snapshot, in the order listed.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          pattern: "\\S"
          description: What the device shows for this section, such as "Verse" or "Chorus".
        play:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
          description: >
            Roles whose blocks play in this section. Every block in the chain
            with that role is turned on.


            Not called `on`: the YAML a rig is read with takes `on` and `off`
            for true and false, and the list would vanish without an error.
        bypass:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Role" }
          description: >
            Roles whose blocks are bypassed in this section. A block named in
            neither list keeps the state the chain gives it, and a role named
            in both is refused.
    Settings:
      type: object
      additionalProperties: false
      description: >
        How the gear is set, in musical terms, from 0 to 1.


        Deliberately small and deliberately lossy. These words mean roughly
        the same thing on any amplifier, and each one is put on whichever
        control the model has for it: `drive` reaches a Drive or a Gain,
        `level` reaches a Level, a Ch Vol or a Master. A word the model has no
        control for is refused, with the words it does take.


        `Sag`, `Bias X` and `Ripple` are one manufacturer's controls and
        belong to the compiler, which sets them from catalog defaults, corpus
        medians and the manual's own directional guidance. A rig that carried
        device parameters would not survive being read on different hardware,
        which is the whole point of the format.
      properties:
        drive:
          $ref: "#/components/schemas/Knob"
          description: How hard the gear is pushed.
        bass:
          $ref: "#/components/schemas/Knob"
          description: The low end.
        mid:
          $ref: "#/components/schemas/Knob"
          description: The middle.
        treble:
          $ref: "#/components/schemas/Knob"
          description: The top end.
        presence:
          $ref: "#/components/schemas/Knob"
          description: The bite above the treble control.
        level:
          $ref: "#/components/schemas/Knob"
          description: How loud it comes out.
        mix:
          $ref: "#/components/schemas/Knob"
          description: How much of the effect is heard against the dry signal.
    Snapshot:
      type: object
      additionalProperties: false
      description: >
        One snapshot: a set of block states a footswitch recalls.
      properties:
        name:
          type: string
          description: What the device shows on its screen.
        tempo:
          type: number
          format: double
          description: Beats per minute this snapshot recalls.
        led:
          type: integer
          description: >
            The colour the footswitch lights, as the device numbers colours.
        pedal:
          type: integer
          description: Which expression pedal state this snapshot recalls.
        named:
          type: boolean
          description: >
            Whether somebody named it. A device ships them called SNAPSHOT 1
            through 3, and the difference between that and a name is whether
            anybody has been here before.
        valid:
          type: boolean
          description: Whether the device considers the snapshot set up.
        blocks:
          type: object
          x-go-type: json.RawMessage
          description: >
            Which blocks are on, keyed the way the preset keys them. Kept as
            the device wrote it: it addresses blocks by their own numbering,
            which is not the order of the chain.
        controllers:
          type: object
          x-go-type: json.RawMessage
          description: What this snapshot recalls for assigned parameters.
        rest:
          type: object
          additionalProperties:
            x-go-type: json.RawMessage
          description: >
            Anything else the device stored here, kept as it arrived.


            Line 6 add fields — a few presets carry recorded commands — and a
            format that modelled only what was known when it was written would
            quietly drop them. Nothing reads this; it exists so nothing is
            lost.
    Substitute:
      type: object
      additionalProperties: false
      description: >
        What to use when the device cannot do what the rig names.


        The rig goes on naming the real gear, because a rig outlives any one
        device: the day Line 6 model the amplifier, this block is deleted and
        nothing else moves. Naming the stand-in in `gear` instead would make
        the rig assert something false about the player, and would make `gear`
        mean two different things depending on whether anybody substituted.


        A substitution is a claim like any other and carries why it is
        believed. Somebody on a forum saying two amplifiers share a power
        section is `user`; an A/B somebody recorded is `video`; a model
        asserting it is `llm`. Where the stand-in is content that did not ship
        with the device, `store` says where to get it, and without that the
        rig names something the reader cannot obtain.
      required: [gear]
      properties:
        gear:
          type: string
          x-lookup: the gear the catalog maps a model to
          minLength: 1
          pattern: "\\S"
          description: >
            Real-world gear, as a person would say it, the same as any other
            entry names.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: Why this is a fair stand-in, and where it comes from.
        confidence:
          $ref: "#/components/schemas/Confidence"
    Target:
      type: object
      additionalProperties: false
      description: >
        Where the numbers in a plan were arrived at.


        A plan's, not a rig's, and it stays in this contract because the plan
        package reads the type from here.


        Advisory, never a restriction. A plan pinned to one device could not be
        read on another, which would cost the portability the rig above it
        exists for. This says "these numbers were tuned here", so somebody on
        other hardware knows to re-tune rather than trust.
      properties:
        device:
          type: string
          x-lookup: the device the catalog was generated for
          description: Human-readable device name, such as "HX Stomp".
        catalog:
          type: string
          description: >
            The release the catalog came from, such as "HX Edit 3.82".
    Held:
      type: object
      additionalProperties: false
      description: >
        One instrument somebody owns, described in what changes the sound.


        Called Held rather than Instrument since version 2. Both contracts
        had a schema by that name and they were different things: this is a
        bass on a stand, and Instrument is which half of a catalog a build
        may draw from.
      required: [gear]
      properties:
        gear:
          type: string
          minLength: 1
          description: >
            As a person would say it: "Fender Jazz Bass", "Rickenbacker 4003".
        strings:
          $ref: "#/components/schemas/Strings"
        default:
          type: boolean
          default: false
          description: >
            The one to assume when a request does not say. The first
            instrument is assumed when none is marked.
        evidence:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
          description: >
            Why it is described this way, where somebody checked rather than
            assumed.
