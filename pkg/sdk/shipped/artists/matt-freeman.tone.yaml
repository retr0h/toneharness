# Matt Freeman — Rancid
#
# The ask: who he is and when. The gear this resolves to is in
# matt-freeman.yaml beside it.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
aliases: [rancid, freeman]

subject:
  kind: artist
  name: Matt Freeman
  band: Rancid
  era: ...And Out Come the Wolves
  years: { from: 1995, to: 1995 }

instrument: bass

# The genre the corpus tags these records with. One word where the field takes
# one, and `corpus music genres` is what earns it words by measurement: this
# says which distribution the records belong to, not how they sound.
genre: [punk]

# No `words` yet. Nothing anybody has read describes how this record sounds in
# terms this vocabulary carries, and the corpus measurement that could earn one
# has not been run against these three tracks since they were added. A word on
# a model's say-so is what got taken off three other asks here.
#
# No `played` either. The instrument is genuinely unsettled rather than
# unresearched: the interview behind the rig has him buying two Fender Jazz
# Basses after "a brief period of experimentation", and the poster transcribing
# it infers a Precision for this record and says so as an inference. Two other
# posters in the same thread argue from the recording that it is a Jazz. That
# is a disagreement among listeners, not evidence, so nothing is claimed.

confidence: medium
