          note: 'Not chosen by measurement. None of the 8 bass equalisers this device models is measurably nearer geddy-lee than the others, so MXR 10-Band Graphic EQ is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 4 records from 1 players, geddy-lee earns mid-forward and bright, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because geddy-lee earns "mid-forward" against the players who measure otherwise, by 0.0958 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
