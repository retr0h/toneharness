      capture: direct
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            the touring rig, and the quote is about amplifiers failing rather than about a record. The article is a 2010 retrospective on a 1977 album, so it is a writer assembling a period rig thirty years later and not somebody who was in the room.
            Nothing found says what was in Mediasound for these sessions. A band that owned three SVTs very likely recorded through one, and "very likely" is not evidence.
          note: 'Wallace Marx Jr., "Maximum Energy: The Gear of the Original Punks", Premier Guitar, 18 May 2010. It puts him on three Ampeg SVT 300-watt heads with three matching 8x10 cabinets, bought once there was money for them, and quotes him from a 1976 documentary on why: "We play so loud that the amps couldn''t take it… But now we got these amps that they… work."'
          url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
