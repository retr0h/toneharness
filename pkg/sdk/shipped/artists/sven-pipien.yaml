            harmonics: 0.08
            high: 0
            lean: 0.87
            low: 0.99
            mid: 0.01
            transient: 0.6
          note: Chosen by measurement rather than by anybody's say-so. Simple Tilt is the closest of the 8 bass equalisers this device models to sven-pipien, sitting at 124 Hz against 137. Across 3 records from 1 players, sven-pipien earns scooped, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because sven-pipien earns "scooped" against the players who measure otherwise, by 0.0127 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
