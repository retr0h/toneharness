      Ripple: "0.5"
      Sag: "0.5"
      Treble: "0.643986013986014"
    evidence:
    - kind: cited
      note: the Voodoo configuration, "recorded from the amp without using a DI"
      url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
    - caveat: the one rig here whose records went through a microphone and a cabinet
        rather than to the desk. Claypool, Dirnt, Geddy and McCartney all went direct
        in whole or in part, so this chain describes what was recorded more literally
        than any other.
      kind: cited
      note: 'Pino, asked what he used to record: "I plugged into a miked Ampeg B-15,
        and I''m pretty sure that was the only signal we took."'
      url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
    - caveat: 'first-hand from the engineer and second-hand to us: the gearslutz link
        in the post is dead, so what was read is the transcription. Three amplifiers
        were in use and this chain names one. "No di''s whatsoever" is the line that
        makes this the only rig here whose cabinet is genuinely in the signal.'
      kind: user
      note: 'Russell Elevado, who engineered the album, in a Q&A quoted by the poster
        rochishin: "for amps we used an Ampeg B15, B18 and an old solid state amp
        in a big cabinet that''s at electric lady ... mics were fet47 ... and usually
        a pre or focusrite isa115 ... everything went to tape and no di''s whatsoever
        on the album."'
      url: https://www.talkbass.com/threads/dangelo-voodoo.146620/
