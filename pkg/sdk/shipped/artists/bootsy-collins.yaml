# Bootsy Collins — Parliament-Funkadelic
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in bootsy-collins.yaml beside it.
ask:
  aliases:
  - bootsy
  - william-collins
  confidence: low
  genre:
  - funk
  instrument: bass
  played:
  - evidence:
    - caveat: eighteen months after the second of these two records, and a statement
        about what he uses rather than about a session. A scan rather than a transcription,
        which is the one thing here that is better than usual.
      kind: cited
      note: 'International Musician, August 1978, page 79, "Bootsy''s Spaced-Out Bass",
        a gear interview built around the instrument: "On his basses he used Rotosound
        Swingbass strings." Swing Bass is a roundwound, and the same issue calls it
        "probably the biggest selling string for bass guitar in the world". The piece
        also gives the order of instruments: "He had been using both Fender Precision
        and Jazz basses, but wanted something different."'
      url: https://worldradiohistory.com/Archive-All-Music/International-Musician/70s/International-Musician-1978-08.pdf
    - caveat: a sleeve transcription rather than a scan, though it is consistent across
        independent pressings.
      kind: cited
      note: the Stretchin' Out sleeve credits "Bootsy Collins — Bass [Space Bass]"
        and names who built it, "Sir Larry Pless" and "Gus Zuppi Music". The 1977
        album's sleeve credits the Space Bass the same way.
      url: https://www.discogs.com/release/570769
    - caveat: the instrument on that sleeve photograph was an unplayable body, so
        the cover is not evidence for the sessions. The album was cut across 1975
        and 1976 and the credit above is.
      kind: cited
      note: 'the builder''s own account of the Stretchin'' Out cover shoot: "I had
        the bass about half built ... The bass had a coat of white paint on it and
        the pick-guard and thats about all."'
      url: https://web.archive.org/web/20200726000028/http://www.angelfire.com/music2/pfunk/feat-spacebass.html
    gear: Space Bass
    strings: round
  subject:
    band: Parliament-Funkadelic
    era: Stretchin' Out through Ahh... The Name Is Bootsy
    kind: artist
    name: Bootsy Collins
    years:
      from: 1976
      to: 1977
  technique:
    attack: slap
    evidence:
    - caveat: which is the effect being described rather than his hands. Not a statement
        about attack from anybody who watched him.
      kind: cited
      note: the filter described as used "when playing leads or slap"
      url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
  words:
  - evidence:
    - kind: cited
      note: '"a squelchy, synth-like tone when playing leads or slap"'
      url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
    term: envelope-swept
  - evidence:
    - against:
        mid: 0.04
      caveat: 'measures the record rather than the player, and the envelope filter
        this rig is mostly about is a mid-band effect: the figure describes the Mu-Tron
        as much as the bass.'
      kind: audio
      measured:
        mid: 0.23
      note: 23% of his energy sits in the mid band across the four records, against
        a middle of 5% across the sixteen players measured, clear by 8%. Earned against
        every corpus this has been measured against.
      spread:
        mid: 0.09
    term: mid-forward
id: bootsy-collins
