            lean: 0.94
            low: 1
            mid: 0
            transient: 0.67
          note: Chosen by measurement rather than by anybody's say-so. Simple Tilt is the closest of the 8 bass equalisers this device models to rex-brown, sitting at 124 Hz against 133. Across 3 records from 1 players, rex-brown earns scooped and dark, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because rex-brown earns "scooped" against the players who measure otherwise, by 0.0227 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
