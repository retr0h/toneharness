    role: cab
    substitute:
      confidence: low
      evidence:
      - kind: llm
        note: the device carries no Energy cabinet of any size, and no 4x10 or 1x15
          of that make. Its nearest Mesa/Boogie bass cabinet is the 2x15, which is
          a bigger box than either of the ones named.
      gear: Mesa/Boogie 2x15
