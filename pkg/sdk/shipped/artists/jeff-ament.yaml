    evidence:
    - caveat: |-
        not first-hand. This is somebody who studied photographs and saw the gear in the Home and Away exhibition, which is documentary rather than testimony, and it describes what was on stage rather than what was in the room for the sessions. Nobody in any thread read here says what was recorded through.
        A second thread asks this question directly and answers it with guesses: "I believe Jeff Ament used to play an original SWR Redhead", "I'm not sure what he used in the beginning", "no idea about recording". Those name SWR rather than Mesa, and none of them is evidence. The disagreement is recorded here rather than resolved, because the dated half of it puts SWR after this record.
      kind: user
      note: |-
        the poster orangepeelneil, opening a thread to identify a rack unit in photographs of the band's first rehearsals, states the rest of the rig as settled: "I know at the time Jeff was using a Mesa Boogie Bass 400+ (often in a rack case) and Energy 4x10\"s (as seen in the Home and Away exhibition) and an Energy 1x15\", sometimes doubled up live for larger gigs."
        The window is the thread's own subject and it brackets this record: "from when PJ began (as Mookie Blaylock late 1990) until late 1991 when Jeff seems to have changed his rig to mostly SWR gear". Ten was recorded in the spring of 1991, inside it.
      url: https://www.talkbass.com/threads/jeff-aments-rig-late-1990-through-1991.1636698/
    gear: MESA/Boogie Bass 400+
    role: amp
  - capture: direct
    confidence: low
    controls:
      Angle: "45.0"
      Distance: "4.25"
      HighCut: "11500.0"
      Level: "0.0"
      LowCut: "25.0"
      Mic: "6"
      Position: "0.09"
    evidence:
    - caveat: the same source and the same limits, and the make is one the device
        does not model at all, so what this rig actually asks for is a substitute
        rather than the box he used. Two tens and a fifteen carry a different low
        end from one two-by-fifteen, and nothing here measured either.
      kind: user
      note: 'the same sentence as the head names the cabinets: Energy 4x10"s and an
        Energy 1x15", "sometimes doubled up live for larger gigs".'
      url: https://www.talkbass.com/threads/jeff-aments-rig-late-1990-through-1991.1636698/
