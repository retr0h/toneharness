rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: drive
      gear: Tech 21 SansAmp GT2
      confidence: medium
      substitute:
        gear: Tech 21 SansAmp Bass Driver DI
        confidence: low
        evidence:
          - kind: user
            caveat: Nobody has A/B'd these and no source relates them. It is the only Tech 21 the device carries, not a claim that the two pedals sound alike.
            note: 'A stand-in on the one thread this device holds: the catalog models the SansAmp Bass Driver DI and no GT2. They are different pedals rather than two versions of one — the GT2 is a guitar amplifier emulator with three voicings and three microphone positions, the Bass Driver DI is a bass preamp with a blend — and what they share is the maker and the circuit family. That is the part of this substitution to disbelieve first.'
      evidence:
        - kind: cited
          caveat: |-
            The source names the pedal and no setting for it, so every control here is the corpus median for a drive block rather than anything documented. "For extra balls" is the whole of what it says about how it was used, and a blend pedal set differently is a different sound: treat the gear as cited and the values as a starting point to move by ear.

            It also covers his whole tenure rather than one record, so which albums had it in the chain is not established.
          note: 'Premier Guitar''s remembrance of him, which states the rig in one sentence: "Cheng held the fort down with 4-string Fender P basses played with his fingers—occasionally using fretless models on White Pony—through Ampeg SVT-2 Pro heads and really only used a Tech 21 SansAmp GT2 for extra balls."'
          url: https://www.premierguitar.com/articles/In_Remembrance_Chi_Chengs_Low_End_Legacy
    - role: amp
      gear: Ampeg SVT
      confidence: medium
      evidence:
        - kind: cited
          caveat: It covers his whole tenure rather than one record, and it names no cabinet, so no cabinet is claimed below. The SVT-2 Pro is the valve SVT reissue generation, so the model here is the same amplifier a generation earlier. The SansAmp the same source names is in the chain below, as a drive.
          note: 'Premier Guitar''s remembrance of him, which states the rig in one sentence: "Cheng held the fort down with 4-string Fender P basses played with his fingers—occasionally using fretless models on White Pony—through Ampeg SVT-2 Pro heads and really only used a Tech 21 SansAmp GT2 for extra balls."'
          url: https://www.premierguitar.com/articles/In_Remembrance_Chi_Chengs_Low_End_Legacy
