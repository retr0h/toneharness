        - kind: cited
          caveat: 'It covers his whole tenure rather than one record, and it names no cabinet, so no cabinet is claimed below. The SVT-2 Pro is the valve SVT reissue generation, so the model here is the same amplifier a generation earlier. The SansAmp is omitted: it is a preamp pedal used for gain and nothing establishes a setting for it.'
