    evidence:
    - caveat: 'the same post as the head, so the two share a source and stand or fall
        together. Lower case "acoustic" in his list is ambiguous: the brand Acoustic
        made a 6x12 guitar cabinet, and post 2 independently recalls him with "an
        Acoustic 6-10\" guitar cab (which would of had to have other speakers than
        stock, IMO)". Whether he meant the brand or the word is not settled here,
        and the size is what this claims.'
      kind: user
      note: 'the second half of the same sentence in post 7: "On Damaged I played
        the GMT 150B into an acoustic 6x12 cab."'
      url: https://www.talkbass.com/threads/chuck-dukowski.670228/
    gear: Acoustic 6x12
    role: cab
    substitute:
      confidence: low
      evidence:
      - caveat: asserted by a model and confirmed by nobody. Six twelve-inch speakers
          and four tens do not move the same air, and the choice is a judgement about
          size rather than a measurement. If you know a nearer match in this catalog,
          please open a pull request.
        kind: llm
        note: the device models no 6x12 of any make, and the Acoustic cabinet it does
          carry is a 1x18 folded horn, which is a different box doing a different
          job. A sealed multi-ten is the nearest thing here to six twelves in one
          cabinet.
      gear: Ampeg SVT 410HLF
