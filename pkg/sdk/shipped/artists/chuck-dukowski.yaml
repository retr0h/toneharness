    evidence:
    - caveat: |-
        first-hand from him and second-hand to us, and the interview behind it was never published. Post 11 asks "is the interview going to be online somewhere? I'd love to read it" and goes unanswered, so this forum post is the only copy of a primary source nobody else can check.
        It also does not say whether the record was miked, taken direct, or both. "Played into" describes the rig he stood in front of.
      kind: user
      note: |-
        Dukowski's own words, album by album, pasted into post 7 by the poster DoomandHeavy, who says "I actually just interviewed Chuck the other day, and he gave me a list of all the gear he's used". The list is in Dukowski's first person throughout and names this record outright: "On Damaged I played the GMT 150B into an acoustic 6x12 cab. This is the setup I was happiest with in BF."
        The same list dates the changes either side of it, which is what makes it credible as a record rather than a recollection: a GMT 250 into a 4x15 on Nervous Breakdown, an SVT into an Ampeg 2x15 folded horn on Jealous Again, a GMT 150B into the folded horn and an AE 2x15 on Six Pack.
      url: https://www.talkbass.com/threads/chuck-dukowski.670228/
    gear: GMT 150B
    role: amp
    substitute:
      confidence: low
      evidence:
      - caveat: a successor, not the same amplifier. The GK 800RB is a 1980s biamped
          head and the GMT 150B is a 1970s one of a third the power, so the lineage
          says who built it and not what it sounds like. Nobody has measured either
          against the other.
        kind: user
        note: |-
          lineage rather than resemblance. The poster Effectsiation establishes the company in post 13: "GMT, as far as I've been able to research, stood for Gallien Martin Taylor… Later, Robert Gallien teamed up with a former co-worker at Hewlett-Packard, Rich Krueger, and the GMT amps started saying 'Gallien-Krueger' under GMT on the amps. Eventually they dropped the GMT and the company became just Gallien-Krueger."
          So the GK 800RB this device models is the same company's later work, and it is the only amplifier here with any connection to the one he named.
        url: https://www.talkbass.com/threads/chuck-dukowski.670228/
      gear: Gallien-Krueger GK 800RB
