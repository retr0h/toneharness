    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: low
      evidence:
        - kind: user
          caveat: |-
            an audience account, and the weakest kind of gear evidence this project takes. Nobody in it had access to the rig, nothing dates it to 1987, and a stage seen from the floor says little about what was in the room for a record made that year.
            What was searched: the four TalkBass threads about him, which are enthusiasts discussing his playing and carry no gear evidence at all; notreble.com, which has a transcription and no rig; and the 2026 Punk Rock and UFOs interview by Mike Damante, read in full, in which he says nothing about equipment or technique. The SVT-CL and SVT-810E figures repeated online come from gear-aggregator pages of the kind that scrape and do not cite.
            If you know what he recorded this through, please open a pull request.
          note: 'the poster Dave Siff, who says elsewhere in these threads that he has flown to Los Angeles to see the band, on what he has watched across several shows: "I''ve seen him play several different Fender basses as well as a Music Man, always through an SVT, and it always sounds like Karl."'
