    era: ALL
    kind: artist
    name: Karl Alvarez
    years:
      from: 1987
      to: 1987
  technique:
    attack: fingers
    evidence:
    - caveat: listeners agreeing about what they hear, not a statement from him. It
        is the kind of claim a recording settles and nothing here has measured these
        tracks yet.
      kind: user
      note: the thread's opening post calls him "one of the few finger style punk
        bassists out there", and it is what every poster there returns to.
      url: https://www.talkbass.com/threads/karl-alvarez-descendents-all.1314244/
