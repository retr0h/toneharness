# Karl Alvarez — Descendents
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# The amplifier here rests on people who watched him play rather than on anybody
# who was in the room. See the caveat on the chain entry.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
