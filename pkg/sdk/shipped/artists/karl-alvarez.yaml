      evidence:
        - kind: audio
          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 205
            decay: 0.23
            dynamics: 4.9
            harmonics: 0.17
            high: 0
            lean: 0.93
            low: 0.74
            mid: 0.26
            transient: 0.8
          note: 'Not chosen by measurement. None of the 8 bass equalisers this device models is measurably nearer karl-alvarez than the others, so MXR 10-Band Graphic EQ is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 3 records from 1 players, karl-alvarez earns mid-forward, bright and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because karl-alvarez earns "mid-forward" against the players who measure otherwise, by 0.202 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
