        What was searched: the four TalkBass threads about him, which are enthusiasts discussing his playing and carry no gear evidence at all; notreble.com, which has a transcription and no rig; and the 2026 Punk Rock and UFOs interview by Mike Damante, read in full, in which he says nothing about equipment or technique. The SVT-CL and SVT-810E figures repeated online come from gear-aggregator pages of the kind that scrape and do not cite.
        If you know what he recorded this through, please open a pull request.
