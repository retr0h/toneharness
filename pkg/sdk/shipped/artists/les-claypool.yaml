# Les Claypool — Primus
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in les-claypool.yaml beside it.

schema: ToneSpec
version: 4.0.0
id: les-claypool
ask:
  confidence: medium
  aliases:
    - claypool
    - primus
  genre:
    - funk metal
    - experimental rock
  instrument: bass
  played:
    - gear: Carl Thompson 4-string
      evidence:
        - kind: cited
          caveat: he plays a four and a six across these records and this field names one of them. See the note under this block for which is where.
          note: 'the luthier''s own pages, with build dates: the 4-string he has played since he was a teenager, and a 6-string fretted "sold to Les just before Pork Soda was recorded in 1993"'
          url: https://ctbasses.com/players/les-claypool
        - kind: cited
          caveat: a fan transcription of a print article rather than a scan, with the typos to prove it. Nothing here names the Tune's model; two dealer listings call it a Zi-III and a dealer selling one is not a source.
          note: 'Guitar Player, August 1991, three months after the album: while Carl Thompson was building the Rainbow Bass, "I used a Japanese Tune fretless ... When I first ripped the frets out, it freaked me out".'
          url: http://www.ram.org/music/primus/articles/funky.html
        - kind: cited
          caveat: an excerpt hosted by the luthier rather than the magazine's own page.
          note: 'Bass Player, February 1993: "If I''d had this fretted bass for ''Jerry Was a Racecar Drive'' ... I''d probably have used it instead. It makes your fingers super-strong to do tapping on a fretless."'
          url: https://ctbasses.com/les-claypool-primus
        - kind: cited
          caveat: 'the four-string only, which is what this field names. The six takes "a standard light-gauge set" and the winding is not given. Dated from inside the article rather than a masthead: Seas of Cheese is "their latest full-length album" and he has just won the 1992 readers'' poll.'
          note: 'Bass Player, c. February 1993: "On his 4-string electrics, Les uses Dean Markley nickel roundwounds -- but here''s the secret: his set consists of two A strings (.080) and two G strings (.040)."'
          url: http://www.ram.org/music/primus/articles/bp1.html
      strings: round
    - gear: Tune 6-string, de-fretted
      evidence:
        - kind: cited
          note: 'Guitar Player, August 1991, three months after the album, on what he used while Carl Thompson built the Rainbow Bass: "I used a Japanese Tune fretless ... When I first ripped the frets out, it freaked me out". The same piece names the track: "his 6-string fretless work behing Tom Waits'' cameo vocal on ''Tommy The Cat''".'
          url: http://www.ram.org/music/primus/articles/funky.html
        - kind: cited
          caveat: the dates are what make this the Tune rather than the Rainbow. The album was tracked in January 1991 and credits a six-string fretless; Carl Thompson finished the Rainbow on 5 February 1991, and Les "received the bass just in time to tour following recording".
          note: 'Bass Player, February 1993, putting the other measured track on a fretless too: "If I''d had this fretted bass for ''Jerry Was a Racecar Drive'' ... It makes your fingers super-strong to do tapping on a fretless."'
          url: https://ctbasses.com/les-claypool-primus
      records:
        - jerry-was-a-race-car-driver
        - tommy-the-cat
  subject:
    kind: artist
    name: Les Claypool
    band: Primus
    era: Sailing the Seas of Cheese through Tales from the Punchbowl
    years:
      from: 1991
      to: 1995
  technique:
    evidence:
      - kind: cited
        caveat: tapping is half of it and this format has no word for that.
        note: a rapid slapped and tapped style
        url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
    attack: slap
  words:
    - evidence:
        - kind: cited
          note: described there as a heavy, thumping tone
          url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
      term: loose-low-end
    - evidence:
        - kind: cited
          caveat: a fan transcription rather than a scan, from the same archive this file cites twice already, and read narrowly the second quote is about what he plays rather than how it sounds.
          note: 'Guitar School, August 1995, on Tales from the Punchbowl, the album that closes this rig''s years: "Claypool''s dizzying, violently percussive textures are still on display". Claypool in the same piece: "even when I''ve soloed, I''ve never really played melodies as much as percussive rhythmic pieces."'
          url: http://www.ram.org/music/primus/articles/cyberfunk.html
      term: percussive
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Mesa/Boogie Bass 400+
      capture: direct
      confidence: high
      evidence:
        - kind: cited
          caveat: the same rundown has him on Subway D-800 heads and 1x12s now, so this rig is the earlier era.
          note: the Bass 400+ head through the nineties, into two Mesa 2x15 Diesel cabinets
          url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
    - role: cab
      gear: Mesa/Boogie 2x15
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: two 2x15 Mesa/Boogie Diesel cabinets
          url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
        - kind: cited
          caveat: which says this cabinet is not on the records this rig is measured against. It stays because a preset with no cab into a PA is not the sound either, and swapping it for a DI is a decision nobody has made. The figures here are a direct signal and the cab is not.
          note: 'asked how he records: "I go out of the back of my MESA/Boogie amp direct into the board. They pad the signal somehow. We''ve always put up a mike in front of the bass amp, but we''ve never used it."'
          url: http://www.ram.org/music/primus/articles/bp1.html
