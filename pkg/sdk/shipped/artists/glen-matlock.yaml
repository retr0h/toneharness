      note: 'the same clause as the head: "used Fender Bassmans with 4x12 Fender cabinets."'
      url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
    gear: Fender Bassman 4x12
    role: cab
    substitute:
      confidence: low
      evidence:
      - caveat: asserted by a model and confirmed by nobody. Four twelves and four
          tens are different cabinets, and the choice is a judgement about which Fender
          box is nearer rather than a measurement. If you know which 4x12 he used,
          please open a pull request.
        kind: llm
        note: the device models no Fender 4x12. The Bassman cabinets it carries are
