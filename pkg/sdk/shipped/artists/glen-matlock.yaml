  genre:
    - punk
  instrument: bass
  subject:
    kind: artist
    name: Glen Matlock
    band: Sex Pistols
    era: Never Mind the Bollocks
    years:
      from: 1977
      to: 1977
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Fender Bassman
      capture: direct
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            the stage, and a 2010 article about a 1977 album. It is also the thinnest of the three players this one piece covers: one clause, no model year, and no session named.
            Who played what on this record is itself contested — Matlock had left before release and Sid Vicious is the credited bassist — so a rig attributing the amplifier to Matlock is resting on the same histories that attribute the playing to him.
          note: 'Wallace Marx Jr., "Maximum Energy: The Gear of the Original Punks", Premier Guitar, 18 May 2010: "Matlock played both a Rickenbacker 4001 and a sunburst Fender Precision… used Fender Bassmans with 4x12 Fender cabinets."'
          url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
    - role: cab
      gear: Fender Bassman 4x12
      capture: direct
      confidence: low
      substitute:
        gear: Fender Bassman P10R 4x10
        confidence: low
        evidence:
          - kind: llm
            caveat: asserted by a model and confirmed by nobody. Four twelves and four tens are different cabinets, and the choice is a judgement about which Fender box is nearer rather than a measurement. If you know which 4x12 he used, please open a pull request.
            note: the device models no Fender 4x12. The Bassman cabinets it carries are a 4x10 of P10R speakers and a 2x15 with JBL D130s, and the 4x10 is the one Fender built the Bassman around.
      evidence:
        - kind: cited
          caveat: the same source as the head, so the two share it and stand or fall together.
          note: 'the same clause as the head: "used Fender Bassmans with 4x12 Fender cabinets."'
          url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
