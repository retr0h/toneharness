  subject:
    band: Sex Pistols
    era: Never Mind the Bollocks
    kind: artist
    name: Glen Matlock
    years:
      from: 1977
      to: 1977
id: glen-matlock
rig:
  chain:
  - controls:
      Attack: "0.035"
      Knee: "6.0"
      Level: "5.2"
      Mix: "1.0"
      Ratio: "3"
      Release: "0.2"
      Threshold: "-37.1"
    evidence:
    - kind: corpus
      note: 'added by the compiler rather than named in the rig: a chain of this kind
        almost always holds one, and the corpus statistics are what put it here.'
    gear: Deluxe Comp
    role: comp
  - capture: direct
    confidence: low
    controls:
      Bass: "0.51"
      Bias: "0.73"
      BiasX: "0.5"
      ChVol: "0.62"
      Drive: "0.59"
      Hum: "0.5"
      Master: "1.0"
      Mid: "0.7"
      Presence: "0.34"
      Ripple: "0.5"
      Sag: "0.5"
      Treble: "0.5799999999999998"
    evidence:
    - caveat: |-
        the stage, and a 2010 article about a 1977 album. It is also the thinnest of the three players this one piece covers: one clause, no model year, and no session named.
        Who played what on this record is itself contested — Matlock had left before release and Sid Vicious is the credited bassist — so a rig attributing the amplifier to Matlock is resting on the same histories that attribute the playing to him.
      kind: cited
      note: 'Wallace Marx Jr., "Maximum Energy: The Gear of the Original Punks", Premier
        Guitar, 18 May 2010: "Matlock played both a Rickenbacker 4001 and a sunburst
        Fender Precision… used Fender Bassmans with 4x12 Fender cabinets."'
      url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
    gear: Fender Bassman
    role: amp
  - capture: direct
    confidence: low
    controls:
      Angle: "0.0"
      Distance: "1.0"
      HighCut: "20100.0"
      Level: "0.0"
      LowCut: "19.9"
      Mic: "2"
      Position: "0.2"
    evidence:
    - caveat: the same source as the head, so the two share it and stand or fall together.
      kind: cited
      note: 'the same clause as the head: "used Fender Bassmans with 4x12 Fender cabinets."'
      url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
    gear: Fender Bassman 4x12
    role: cab
    substitute:
      confidence: low
      evidence:
      - caveat: asserted by a model and confirmed by nobody. Four twelves and four
          tens are different cabinets, and the choice is a judgement about which Fender
          box is nearer rather than a measurement. If you know which 4x12 he used,
          please open a pull request.
        kind: llm
        note: the device models no Fender 4x12. The Bassman cabinets it carries are
          a 4x10 of P10R speakers and a 2x15 with JBL D130s, and the 4x10 is the one
          Fender built the Bassman around.
      gear: Fender Bassman P10R 4x10
