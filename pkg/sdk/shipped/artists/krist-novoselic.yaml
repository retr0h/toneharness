  subject:
    kind: artist
    name: Krist Novoselic
    band: Nirvana
    era: Nevermind, with one In Utero record the corpus also holds
    years:
      from: 1991
      to: 1993
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: low
      evidence:
        - kind: user
          caveat: |-
            the hedge is his and it is quoted rather than smoothed away. "Pretty sure" is what the page says, no interview date is given, and the page is a fan archive rather than a first-party source, so this is the best available claim and not a settled one.
            The head named is an SVT 400T, which the device does not carry. This rig asks for the Ampeg SVT it does carry, an older and all-tube head of the same name rather than the same amplifier.
          note: |-
            the band's own equipment chronology, built from an interview with Nirvana's guitar technician Earnest Bailey, puts an Ampeg SVT 400T in his hands from early 1991 and says of the sessions: "I'm pretty sure he used this for recording Nevermind."
            Bailey is the reason this counts at all. He worked on the band's gear, so he is describing instruments he handled rather than photographs he studied.
          url: https://www.livenirvana.com/equipment/krist.php
        - kind: llm
          caveat: not sourced to anything anybody opened beyond the page above, and recorded here only so the next person does not fold two eras into one amplifier. The corpus reads two Nevermind tracks and one In Utero track for him, so this rig is right for two of the three.
          note: worth knowing what this rig is not. The same page puts him on Hiwatt DR103s and a converted Marshall plexi for In Utero, so a rig covering 1993 is a different rig from this one, and the device models the Hiwatt as well.
    - role: cab
      gear: Mesa/Boogie 2x15
      capture: direct
      confidence: low
      evidence:
        - kind: user
          caveat: a touring wall rather than a session cabinet, and eight boxes are not one. Nothing read here says what the record was miked through, and the page does not separate stage from studio for the speakers the way it hedges about the head.
          note: the same chronology gives the Nevermind-era speakers as "4 Marshall 4x12s, 2 Mesa/Boogie Road Ready 4x10s and 2 Mesa/Boogie Road Ready 2x15s". The device carries a Mesa/Boogie 2x15, which is the one box in that list it models.
          url: https://www.livenirvana.com/equipment/krist.php
