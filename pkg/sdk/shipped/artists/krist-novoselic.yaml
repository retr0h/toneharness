        one. Nothing read here says what the record was miked through, and the page
        does not separate stage from studio for the speakers the way it hedges about
        the head.
      kind: user
      note: the same chronology gives the Nevermind-era speakers as "4 Marshall 4x12s,
        2 Mesa/Boogie Road Ready 4x10s and 2 Mesa/Boogie Road Ready 2x15s". The device
        carries a Mesa/Boogie 2x15, which is the one box in that list it models.
      url: https://www.livenirvana.com/equipment/krist.php
    gear: Mesa/Boogie 2x15
    role: cab
