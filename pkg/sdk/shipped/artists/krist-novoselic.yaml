    evidence:
    - caveat: |-
        the hedge is his and it is quoted rather than smoothed away. "Pretty sure" is what the page says, no interview date is given, and the page is a fan archive rather than a first-party source, so this is the best available claim and not a settled one.
        The head named is an SVT 400T, which the device does not carry. This rig asks for the Ampeg SVT it does carry, an older and all-tube head of the same name rather than the same amplifier.
      kind: user
      note: |-
        the band's own equipment chronology, built from an interview with Nirvana's guitar technician Earnest Bailey, puts an Ampeg SVT 400T in his hands from early 1991 and says of the sessions: "I'm pretty sure he used this for recording Nevermind."
        Bailey is the reason this counts at all. He worked on the band's gear, so he is describing instruments he handled rather than photographs he studied.
      url: https://www.livenirvana.com/equipment/krist.php
    - caveat: not sourced to anything anybody opened beyond the page above, and recorded
        here only so the next person does not fold two eras into one amplifier. The
        corpus reads two Nevermind tracks and one In Utero track for him, so this
        rig is right for two of the three.
      kind: llm
      note: worth knowing what this rig is not. The same page puts him on Hiwatt DR103s
        and a converted Marshall plexi for In Utero, so a rig covering 1993 is a different
        rig from this one, and the device models the Hiwatt as well.
    gear: Ampeg SVT
    role: amp
  - capture: direct
    confidence: low
    controls:
      Angle: "45.0"
      Distance: "4.25"
      HighCut: "11500.0"
      Level: "0.0"
      LowCut: "25.0"
      Mic: "6"
      Position: "0.09"
    evidence:
