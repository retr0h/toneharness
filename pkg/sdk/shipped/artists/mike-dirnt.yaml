# Mike Dirnt — Green Day, American Idiot
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# Resolved. The `controls` under each chain entry are every control the block has,
# at the value it is set to, so this document is the specification of the preset
# rather than a sketch of it. Editing one control here is what reaches the pedal.
# Written by `rigs resolve`.
#
# The compressor is not cited and does not claim to be. Nothing says which one he
# used; 86% of bass chains in the preset corpus hold one, so a chain without any
# is the unusual thing, and which one is a judgement. This one was chosen by ear
# against the compressor the corpus picked, and the evidence on it says so.
#
# `resolved:` records which pedal and catalog produced the numbers. Advisory: the
# gear names resolve on any Helix, and somebody on other hardware reads it to know
# whose rig these came from.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
version: 4.0.0
id: mike-dirnt
ask:
  confidence: medium
  aliases:
    - green-day
    - dirnt
  default: true
  genre:
    - pop-punk
    - punk
  instrument: bass
  played:
    - gear: Fender Mike Dirnt Signature Precision Bass
      evidence:
        - kind: cited
          caveat: the set, not the winding. `round` is read off Fender's Super Bass line rather than off this page, which never says the word. The sidebar also opens "bringing a big quiver of Fender basses on the upcoming Green Day tour", so it describes the rig in the month of release rather than what was strung up in the sessions. The flatwounds in the same interview are his first bass, aged twelve.
          note: 'Bass Player, September 2004, the month American Idiot was released: "Dirnt uses nickel-plated medium-gauge Fender Super Bass strings, saying, ''They''ve got great snap.''"'
          url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        - kind: cited
          caveat: 'this page says toured, not recorded, and describes the signature basses as what he is "bringing ... on the upcoming Green Day tour". What puts the same bass in the sessions is the source behind the amplifier, Cavallo in Guitar World''s Bass Guitar: "Sometimes we used his new signature bass". The bass and the amp rest on one sentence from one person, so they stand or fall together.'
          note: '"two American Idiot-era Fender Mike Dirnt Signature Precisions used on tour", from coverage of him selling his own instruments'
          url: https://www.notreble.com/buzz/2026/08/22/mike-dirnt-is-selling-american-idiot-tour-basses-and-a-fender-used-to-record-nimrod/
      strings: round
    - gear: Fender Precision Bass
      evidence:
        - kind: cited
          caveat: '"sometimes" for both, and no track is named for either, so nothing here says which bass played which song. That is why this entry carries no `records`.'
          note: 'the same Cavallo answer names a second instrument: "Sometimes we used his new signature bass and sometimes we use this fabulous Precision Bass that he''s had for so long."'
          url: https://web.archive.org/web/20060217083255im_/http://www.greendayauthority.com/TheBand/articles/bassmag/4.jpg
        - kind: cited
          caveat: corroborates that there were two and no more. It does not name this one, which only Cavallo does.
          note: 'Dirnt''s own count, in Total Guitar Bass Special 4, Autumn 2004, given mid-sessions: "I''m using two basses on the record and that''s one of ''em", the one being the signature Precision.'
          url: https://web.archive.org/web/20051206060450im_/http://greendayauthority.com/TheBand/articles/totalbass_pg3.jpg
  subject:
    kind: artist
    name: Mike Dirnt
    band: Green Day
    era: American Idiot
    years:
      from: 2004
      to: 2004
  technique:
    evidence:
      - kind: cited
        caveat: '`position` is gone. He describes what his right hand is for, "I try to be percussive with my right hand, finding something that has its own motor, with a bounce to it", and never says where along the string it sits.'
        note: 'Bass Player, September 2004, asked "Do you always play with a pick?": "Yeah. It''s a product of starting on guitar. It just seemed more natural, since my rotation with my fingers isn''t that good. You might catch me playing slap and fingerstyle before practice, but not onstage."'
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
    attack: pick
  words:
    - evidence:
        - kind: cited
          caveat: what he wants rather than what the record does, and on this rig those differ. He says in the same answer "I try to cut through with midrange" while American Idiot measures 1% in the mid band against a middle of 5% across the corpus, the most scooped record in the corpus. The click he is describing is upper-midrange, which a scooped mix keeps and a scooped amplifier would not.
          note: 'Bass Player, September 2004. He names the frequency: "Dirnt can even pinpoint the frequency that captures the pickstyle click he craves on records: ''2kHz,'' he says." And describes it: "I also like a tic-tac click, like the sound of the baritone guitar parts on old country records, where it would double the bass line. I like the ice-pick-in-the-ear upper-midrange sound, and I like my bass to have punch."'
          url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
      term: audible-pick-attack
rig:
  chain:
    - role: drive
      gear: Fulltone® OCD
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: Neither is modelled; this is the OCD, the transparent overdrive the device carries. The Teletronix compressor already in this rig stays.
          note: Dirnt runs a Zinky Master Blaster boost and a True Grit overdrive.
          url: https://www.uberproaudio.com/who-plays-what/131-green-day-mike-dirnts-bass-gear-rig-and-equipment
      enabled: false
    - role: comp
      gear: Teletronix LA-2A
      evidence:
        - kind: user
          caveat: |-
            part of that difference is simply level: 0.62 of makeup gain against none makes this louder, and louder is hard to hear past in a comparison. The rest is the compressor being optical and slow, so a pick attack passes before it bites.

            Named for the gear rather than for Line 6's model of it. Two models claim a Teletronix LA-2A and the other is a legacy Tube Comp carrying nothing but a level, so the catalog sorts the legacy one last and this name reaches the six-control model it was heard on.

            Nobody has confirmed which compressor Dirnt used, and this does not claim to be it.
          note: chosen by ear against the compressor the corpus picked. An LA-2A with most of its peak reduction in and 0.62 of makeup gain is audibly richer and louder than a Deluxe Comp with no makeup at all.
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: |-
            the producer's answer, not the player's. Dirnt names no amp for these sessions anywhere in the article, and the only rig he gives in his own voice is the one he is touring. That is a distinction worth keeping rather than smoothing over: Cavallo is the one who decided what went to tape, so this is first-hand about the recording and second-hand about the player.
            The scan is a page photograph hosted by a fan site and recovered through the Wayback Machine, the magazine having no archive of its own. The live urls under greendayauthority.com/TheBand/articles/ now 404, so the capture is the only way in.
          note: 'Bradman, E.E. and Buddingh, Terry, "Ready Set Go! Studio Secrets of Mike Dirnt and Green Day Producer Rob Cavallo", Guitar World''s Bass Guitar, pages 26-30, whose cover sells it as "IN THE STUDIO WITH MIKE DIRNT". Asked "And what did you use for American Idiot?", Cavallo answers: "Mike and I talked about Boogie, Fender and Ampeg amps, and at the end we went with an Ampeg SVT - it''s hard to beat that. Sometimes we used his new signature bass and sometimes we use this fabulous Precision Bass that he''s had for so long." The same page gives the microphones: a Neumann U 47 FET close, "six to eight inches away", and a Sennheiser 421 or an SM57 "five or six feet away". Page 28 puts the Evil Twin direct box in the chain "since Dookie".'
          url: https://web.archive.org/web/20060217083255im_/http://www.greendayauthority.com/TheBand/articles/bassmag/4.jpg
        - kind: cited
          caveat: 'this is not the contradiction it looks like. The passage opens "Live, Dirnt goes from a Shure ULX wireless", so it is the touring rig, and the claim above is explicitly about the sessions. Fender on stage and an SVT in the studio in the same year are both true. Worth knowing that in this interview he prefers Fender: "I like the Ampeg cabs'' low-end response, but the Fenders give me the attack I''m looking for."'
          note: 'Bass Player, September 2004, the month of the album, and the only contemporaneous interview anybody here has read. It puts him on Fender: "a Bassman 1200 Pro head with the EQ essentially flat ... Each amp is connected to a Bassman 810 Pro 8x10 cabinet with the tweeter turned off", and "I just switched back to 8x10s".'
          url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
    - role: cab
      gear: Acoustic 6x10
      capture: direct
      confidence: low
      substitute:
        gear: Ampeg 8x10
        confidence: low
        evidence:
          - kind: llm
            note: the device carries no 6x10 at all. Its nearest is a big sealed multi-ten, which is the 8x10 this rig used to name outright.
      evidence:
        - kind: user
          caveat: 'first-hand from him and second-hand to us: the Guitar Center link in the post is dead and no archived copy was found, so the interview cannot be dated. "Every record we''ve ever done" covers this one whenever it was said. Ampeg appears once and hedged, attached to a guitar combo. He also blends two amplifiers per song and a rig is one path, so this names the one he says is always there.'
          note: 'Dirnt''s own words, asked whether he uses his big rig in the studio, in a Guitar Center interview the poster EastCoastThump transcribes: "I''ve used a 6x10 combo on every record we''ve ever done, this old Acoustic 6x10 cabinet that I have ... I''d use a little 4x10 guitar combo for the super highs, maybe an Ampeg, and a Mesa/Boogie 6x10, along with some other stuff. Basically, I''ll just do a blend of two amps."'
          url: https://www.talkbass.com/threads/i-wanna-get-a-mike-dirnt-like-tone-when-i-play-my-p-bass-how-to.1111702/
        - kind: cited
          caveat: 'which places his own Ampeg eight by ten on a different record, and agrees with him about the split: the big cabinets are what he carries, and a six by ten is what he records through.'
          note: 'his own Ampeg 8x10 belongs to a different record. Coverage of him selling his gear ties it to 1994: "one of the first Ampeg SVT-810 cabinets he bought with his first Green Day paycheck, which subsequently went out on the Dookie tour". The American Idiot items in the same sale are basses.'
          url: https://www.notreble.com/buzz/2026/08/24/mike-dirnt-is-opening-his-reverb-shop-and-we-got-to-check-out-the-gear/
        - kind: cited
          caveat: his live rig, so it says the size he was carrying rather than what the sessions were miked through. The tweeter being off is the one thing here that describes a sound rather than a box.
          note: 'Bass Player, September 2004: "Each amp is connected to a Bassman 810 Pro 8x10 cabinet with the tweeter turned off. Says Dirnt, ''For my tone, I don''t need that spitty sound up top.''"'
          url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
