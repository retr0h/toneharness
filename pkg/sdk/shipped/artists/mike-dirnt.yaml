# Mike Dirnt — Green Day
#
# A rig names real-world gear, never Line 6 model identifiers. "Ampeg SVT"
# resolves through the gear map, so this file stays readable, stays correct
# when Line 6 rename something, and works for any Helix device.
#
# See the write-a-spec skill, and examples/rigspec/mike-dirnt.yaml for one with
# every field filled in.
#
# The ask this rig answers is in mike-dirnt.tone.yaml beside it.

schema: RigSpec
version: 2
id: mike-dirnt

instrument: bass

# The signal path, in order. Order is what the signal does: a compressor ahead
# of the amp squeezes what the amp is fed, one after it levels what comes out.
chain:
  - role: amp
    gear: Ampeg SVT
    capture: direct
    evidence:
      - kind: cited
        url: https://web.archive.org/web/20060217083255im_/http://www.greendayauthority.com/TheBand/articles/bassmag/4.jpg
        note: >-
          Bradman, E.E. and Buddingh, Terry, "Ready Set Go! Studio Secrets of
          Mike Dirnt and Green Day Producer Rob Cavallo", Guitar World's Bass
          Guitar, pages 26-30, whose cover sells it as "IN THE STUDIO WITH
          MIKE DIRNT". Asked "And what did you use for American Idiot?",
          Cavallo answers: "Mike and I talked about Boogie, Fender and Ampeg
          amps, and at the end we went with an Ampeg SVT - it's hard to beat
          that. Sometimes we used his new signature bass and sometimes we use
          this fabulous Precision Bass that he's had for so long." The same
          page gives the microphones: a Neumann U 47 FET close, "six to eight
          inches away", and a Sennheiser 421 or an SM57 "five or six feet
          away". Page 28 puts the Evil Twin direct box in the chain "since
          Dookie".
        caveat: >-
          the producer's answer, not the player's. Dirnt names no amp for
          these sessions anywhere in the article, and the only rig he gives
          in his own voice is the one he is touring. That is a distinction
          worth keeping rather than smoothing over: Cavallo is the one who
          decided what went to tape, so this is first-hand about the
          recording and second-hand about the player.

          The scan is a page photograph hosted by a fan site and recovered
          through the Wayback Machine, the magazine having no archive of its
          own. The live urls under greendayauthority.com/TheBand/articles/
          now 404, so the capture is the only way in.
      - kind: cited
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        note: >-
          Bass Player, September 2004, the month of the album, and the only
          contemporaneous interview anybody here has read. It puts him on
          Fender: "a Bassman 1200 Pro head with the EQ essentially flat ...
          Each amp is connected to a Bassman 810 Pro 8x10 cabinet with the
          tweeter turned off", and "I just switched back to 8x10s".
        caveat: >-
          this is not the contradiction it looks like. The passage opens
          "Live, Dirnt goes from a Shure ULX wireless", so it is the touring
          rig, and the claim above is explicitly about the sessions. Fender
          on stage and an SVT in the studio in the same year are both true.
          Worth knowing that in this interview he prefers Fender: "I like the
          Ampeg cabs' low-end response, but the Fenders give me the attack
          I'm looking for."
    confidence: medium

  - role: cab
    gear: Acoustic 6x10
    capture: direct
    substitute:
      gear: Ampeg 8x10
      evidence:
        - kind: llm
          note: >-
            the device carries no 6x10 at all. Its nearest is a big sealed
            multi-ten, which is the 8x10 this rig used to name outright.
      confidence: low
    evidence:
      - kind: user
        url: https://www.talkbass.com/threads/i-wanna-get-a-mike-dirnt-like-tone-when-i-play-my-p-bass-how-to.1111702/
        note: >-
          Dirnt's own words, asked whether he uses his big rig in the studio,
          in a Guitar Center interview the poster EastCoastThump transcribes:
          "I've used a 6x10 combo on every record we've ever done, this old
          Acoustic 6x10 cabinet that I have ... I'd use a little 4x10 guitar
          combo for the super highs, maybe an Ampeg, and a Mesa/Boogie 6x10,
          along with some other stuff. Basically, I'll just do a blend of two
          amps."
        caveat: >-
          first-hand from him and second-hand to us: the Guitar Center link
          in the post is dead and no archived copy was found, so the
          interview cannot be dated. "Every record we've ever done" covers
          this one whenever it was said. Ampeg appears once and hedged,
          attached to a guitar combo. He also blends two amplifiers per song
          and a rig is one path, so this names the one he says is always
          there.
      - kind: cited
        url: https://www.notreble.com/buzz/2026/08/24/mike-dirnt-is-opening-his-reverb-shop-and-we-got-to-check-out-the-gear/
        note: >-
          his own Ampeg 8x10 belongs to a different record. Coverage of him
          selling his gear ties it to 1994: "one of the first Ampeg SVT-810
          cabinets he bought with his first Green Day paycheck, which
          subsequently went out on the Dookie tour". The American Idiot items
          in the same sale are basses.
        caveat: >-
          which places his own Ampeg eight by ten on a different record, and
          agrees with him about the split: the big cabinets are what he
          carries, and a six by ten is what he records through.
      - kind: cited
        url: https://web.archive.org/web/20040908171044/http://www.bassplayer.com/archive/0904/0904_Features1.htm
        note: >-
          Bass Player, September 2004: "Each amp is connected to a Bassman
          810 Pro 8x10 cabinet with the tweeter turned off. Says Dirnt, 'For
          my tone, I don't need that spitty sound up top.'"
        caveat: >-
          his live rig, so it says the size he was carrying rather than what
          the sessions were miked through. The tweeter being off is the one
          thing here that describes a sound rather than a box.
    confidence: low
