      evidence:
        - kind: audio
          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 108
            decay: 0.5
            dynamics: 4.7
            harmonics: 0.17
            high: 0
            lean: 0.95
            low: 1
            mid: 0
            transient: 0.82
          note: 'Not chosen by measurement. None of the 8 bass equalisers this device models is measurably nearer cliff-williams than the others, so MXR 10-Band Graphic EQ is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 3 records from 1 players, cliff-williams earns scooped and dark, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because cliff-williams earns "scooped" against the players who measure otherwise, by 0.0128 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
