rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      confidence: medium
      evidence:
        - kind: cited
          caveat: First-party and undated. An artist page says what somebody uses now and brackets no era, which is why the records measured here are the later albums rather than the famous late-1970s ones. The SVT-4PRO is a hybrid with a valve preamp and a solid-state output section; the model on this device is the original all-valve SVT, so this is the same family and not the same amplifier.
          note: 'Ampeg''s own artist page, which is the maker stating its own endorsement. It lists him with two products and no prose: an SVT-4PRO head and an SVT-810E cabinet.'
          url: https://ampeg.com/artists/437/Cliff%20Williams/
        - kind: user
          caveat: 'The B-15 claim is the interesting one and it is unsourced hearsay, so no record from that era is measured here. If somebody can confirm it from period press, this rig should be split in two: an Ampeg B-15NF for 1978-1980 and this one for the 1990s on.'
          note: 'Opened. One post is first-hand observation rather than opinion, from descendent22: "Cliff uses a couple 810 SVT cabs and I''ve seen him use SVT heads, SVT pro 4 heads and possibly SVT pro 3 at times." A second post, from Briton, puts him elsewhere for the 1970s: "On the Highway to Hell and Powerage LP''s he also used a Jazz Bass and a B-15 Flip Top".'
          url: https://www.talkbass.com/threads/cliff-williams-ac-dc-bass-tone.1444592/
    - role: cab
      gear: Ampeg 8x10
      confidence: medium
      evidence:
        - kind: cited
          caveat: Which 8x10 the device models is a legacy Ampeg SVT-E rather than the 810E specifically.
          note: 'Named by the maker on the same page as the head: an SVT-810E.'
          url: https://ampeg.com/artists/437/Cliff%20Williams/
