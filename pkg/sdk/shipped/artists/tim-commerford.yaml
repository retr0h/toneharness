    attack: fingers
    evidence:
    - caveat: a 2016 interview, and it dates itself to the Rage period rather than
        to 1992 in particular. Two fingers rather than the three he came from is the
        part this format cannot hold. Several readers put slapped playing on "Take
        the Power Back"; none of them was there, and his own "everything with two
        fingers" outranks them.
      kind: cited
      note: 'Premier Guitar, Freddy Villano, asked to describe his right hand: "I
        grew up using three fingers ... Then when I got playing with Rage, I was more
        diehard, I felt like it was more solid to play with two fingers. So with Rage
        I did everything with two fingers."'
      url: https://premierguitar.com/articles/24644-tim-commerford-wakrat-and-the-power-of-now?page=2
