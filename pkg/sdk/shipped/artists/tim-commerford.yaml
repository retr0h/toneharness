          note: Chosen by measurement rather than by anybody's say-so. Paul Cochrane Timmy Overdrive is the closest of the 19 bass drives this device models to tim-commerford, sitting at 154 Hz against 90. Across 3 records from 1 players, tim-commerford earns saturated, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because tim-commerford earns "saturated" against the players who measure otherwise, by 0.0548 of harmonics, and that is the figure a pedalboard answers with a drive. It arrives switched off.
