      kind: cited
      note: 'Garth Richardson, who produced the record, on how it was cut: "we had
        brought in a big concert P.A. system and we had Brad Wilk sitting behind the
        actual P.A. with his drums and we had Tom''s guitar, Tim''s bass and Zack''s
        vocals coming though the P.A."'
      url: https://tapeop.com/interviews/28/gggarth-richardson
    - caveat: Evil Empire is 1996 and this rig is 1992, so this is the shape of his
        recording rather than this record's. It does put the same two heads and two
