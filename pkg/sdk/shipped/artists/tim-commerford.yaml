  instrument: bass
  played:
    - gear: Ernie Ball Music Man StingRay
      evidence:
        - kind: cited
          caveat: the finish details people repeat with this, a blonde body and a removed pickguard, are on no page anybody has opened. The model is sourced and the rest is not.
          note: 'his own words: "This is a bass that I fell in love with at a pawnshop and used to play the first Rage record"'
          url: https://www.musicradar.com/guitars/bass-guitars/ernie-ball-music-man-tim-commerford-ltd-edition-signature-stingray
      strings: unknown
  subject:
    kind: artist
    name: Tim Commerford
    band: Rage Against the Machine
    era: Rage Against the Machine
    years:
      from: 1992
      to: 1992
  technique:
    evidence:
      - kind: cited
        caveat: a 2016 interview, and it dates itself to the Rage period rather than to 1992 in particular. Two fingers rather than the three he came from is the part this format cannot hold. Several readers put slapped playing on "Take the Power Back"; none of them was there, and his own "everything with two fingers" outranks them.
        note: 'Premier Guitar, Freddy Villano, asked to describe his right hand: "I grew up using three fingers ... Then when I got playing with Rage, I was more diehard, I felt like it was more solid to play with two fingers. So with Rage I did everything with two fingers."'
        url: https://premierguitar.com/articles/24644-tim-commerford-wakrat-and-the-power-of-now?page=2
    attack: fingers
rig:
  chain:
    - role: wah
      gear: Modified Dunlop 105Q
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: He also runs a Marshall Guv'nor he modified himself and an EHX POG2, neither of which this device carries.
          note: Commerford uses a Dunlop Cry Baby 105Q bass wah, which the device models directly.
          url: https://equipboard.com/pros/tim-commerford
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      confidence: high
      evidence:
        - kind: cited
          caveat: |-
            **the distortion it names cannot be built here.** A Marshall Guv''nor is a Marshall preamp in a box and this device models none of it: all 61 of its drives were read and not one is voiced after a Guv''nor, so naming one of them would be choosing a pedal for him rather than recording his. The chain carries no drive for that reason and not for want of a source.
            The amplifier sentence is about the wrong record. Two SVT heads and two Classic 8x10 cabinets are what he is said to have liked best, on Evil Empire in 1996, where this rig is the 1992 debut. It corroborates the kind of rig and not this one.
            The Guv''nor claim is the writer''s framing rather than a quote from him, and the same article has him refusing to say what is on his board: he calls himself "like the Pablo Escobar of bass" about it. So this is the best available account of a sound he will not describe.
          note: 'Nick Wells for Guitar World. On the distortion: "Since Commerford first set about establishing a bass sound for Rage by using a Marshall Guv''nor stompbox for riff-rock distortion". On the amplifiers: "Commerford''s favorite recorded sound with Rage Against The Machine was on the group''s second album, Evil Empire, on which he used two SVT heads and two Classic 8x10 cabinets".'
          url: https://www.yahoo.com/entertainment/rage-against-machine-tim-commerford-081800583.html
        - kind: cited
          caveat: the 2PRO rather than the vintage SVT this device models, and he says in the same piece that he is "a multiple amp kind of guy", one on all the time and one for when he wants the sound different. A preset is one path, so this is the one that is always on.
          note: '"In Rage, I used two Ampeg SVT-2PRO heads and two Ampeg 8x10 cabinets"'
          url: https://www.mixonline.com/the-wire/why-tim-commerford-will-never-give-his-ampeg-svts-430713
        - kind: cited
          caveat: which describes the room rather than the bass rig, and says the amplifier was not the only thing making the sound in it. Nothing here names the amplifier for the sessions; the quote above is him describing his Rage rig years later.
          note: 'Garth Richardson, who produced the record, on how it was cut: "we had brought in a big concert P.A. system and we had Brad Wilk sitting behind the actual P.A. with his drums and we had Tom''s guitar, Tim''s bass and Zack''s vocals coming though the P.A."'
          url: https://tapeop.com/interviews/28/gggarth-richardson
        - kind: cited
          caveat: Evil Empire is 1996 and this rig is 1992, so this is the shape of his recording rather than this record's. It does put the same two heads and two 8x10s in a studio, with a microphone and a DI on them at once.
          note: 'the nearest thing to how he records, and it is the wrong album: "Commerford''s favorite recorded sound with Rage Against The Machine was on the group''s second album, Evil Empire, on which he used two SVT heads and two Classic 8x10 cabinets, both mic''d and direct." On direct generally: "I let producers use as much DI as they want until I start noticing it."'
          url: https://www.guitarworld.com/artists/bassists/tim-commerford-rage-against-the-machine-bass-tone
      stage: true
    - role: cab
      gear: Ampeg 8x10
      confidence: high
      evidence:
        - kind: cited
          note: two Ampeg 8x10 cabinets, in the same sentence
          url: https://www.mixonline.com/the-wire/why-tim-commerford-will-never-give-his-ampeg-svts-430713
