      Sag: "0.5"
      Treble: "0.73"
    evidence:
    - caveat: |-
        what was searched, and where it ran out. Premier Guitar's ZZ Top gear gallery and their obituary for him were both opened and neither carries this; the gallery has his tech on his tone and no models for this period. No page was found that states it, so this is the claim as it is repeated rather than as anybody printed it.
        It is worth keeping rather than dropping because it is unusually specific and it is checkable: a Danelectro through a Marshall guitar stack is a strange enough rig that somebody with the period press can confirm or kill it in one reading. If you have that, please open a pull request.
        Line 6 tag this model a guitar amplifier, which is what it is. A rig naming it on purpose is the case the instrument filter was taught not to refuse.
      kind: llm
      note: asserted by a model and confirmed by nobody. The account that circulates
        is that these sessions caught him without his '51 Telecaster bass, so he played
        a Danelectro Longhorn through a 100-watt Marshall, the same model of amplifier
        the guitars were running, and that the band recorded the record largely live
        in the studio on a newly bought touring rig.
    gear: Marshall Super Lead 100
    role: amp
  - capture: direct
    confidence: low
    controls:
      Angle: "45.0"
      Distance: "1.0"
      HighCut: "12000.0"
      Level: "0.0"
