      Mic: "2"
      Position: "0.15"
    evidence:
    - caveat: the same unsourced account as the head, so the two stand or fall together,
        and which 4x12 is not established at all.
      kind: llm
      note: the cabinet that goes with the head above, on the same account of two
        identical stacks shared between guitar and bass.
