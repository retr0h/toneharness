        - kind: cited
          caveat: the bass on the cover is not necessarily the bass on the tape. The article ties the Precision to the stage in the month the sessions were being mixed; nothing found says which instrument was used in Wessex.
          note: Wallace Marx Jr., Premier Guitar, 18 May 2010, names the white Fender Precision he played and the Palladium show in September 1979 where he smashed it, which is the photograph on the cover of this record.
