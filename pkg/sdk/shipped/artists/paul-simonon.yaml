      capture: direct
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            the stage, and a 2010 article about a 1979 album. The sentence is about the Palladium show rather than about Wessex Studios, and the producer's choices for a record this heavily overdubbed are not in it.
