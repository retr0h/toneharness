# Jaco Pastorius — Weather Report
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in jaco-pastorius.yaml beside it.
ask:
  aliases:
  - jaco
  - pastorius
  confidence: medium
  genre:
  - jazz fusion
  instrument: bass
  played:
  - evidence:
    - caveat: 'he names the brand and not the type, and in 1978 Rotosound also sold
        the Jazz Bass 77 flatwound and the Tru Bass 88 nylon tapewound, which their
        own history confirms. `round` is therefore inferred twice over: the argument
        he makes is about brightness and harmonic content, which is a roundwound argument,
        and the fingerboard is epoxied, which is what roundwounds on a bare fretless
        board make necessary. No gauge: the set everybody names comes from present-day
        aggregators.'
      kind: cited
      note: '"Portrait of Jaco", Steve Rosen, 1978, on his estate''s own site, in
        the middle of this rig''s years. Asked what strings he uses: "Rotosounds."
        And why: "To me Rotosound has what no other string has and that''s pure harmonics
        and the closest to playing harmonics in tune."'
      url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
    gear: Fender Jazz Bass, fretless
    strings: round
  subject:
    band: Weather Report
    era: Weather Report through Word of Mouth
    kind: artist
    name: Jaco Pastorius
    years:
      from: 1976
      to: 1981
  technique:
    attack: fingers
    evidence:
    - caveat: '`muting` says palm because this format has no word for muting with
        the fingers that are not picking, which is what he describes. The effect on
        the sound is the same and the hand is not.'
      kind: cited
      note: '1978, his own account of his right hand: "I never practiced with my right
        hand at all. It just naturally goes. I use my first two fingers to pick and
        I use the other two fingers to mute as well as my thumb if I''m jumping around.
        The hardest thing to do is just to get the strings I''m not playing to shut
        up."'
      url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
    - caveat: from the comments rather than the article, and the position is all it
        supports.
      kind: user
      note: playing over the bridge pickup
      url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
    muting: palm
    position: bridge
  words:
  - evidence:
    - caveat: from the comments on that page rather than the article
      kind: user
      note: fingers over the bridge pickup
      url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
    term: bridge-forward
  - evidence:
    - caveat: an argument for harmonic content rather than the word itself. What earns
        the word is the measurement below.
      kind: cited
      note: '1978, on why he uses the strings he does: "To me Rotosound has what no
        other string has and that''s pure harmonics and the closest to playing harmonics
        in tune."'
      url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
    - against:
        centroid: 138
      caveat: measures the record rather than the player, and a fretless played near
        the bridge is bright before any amplifier touches it.
      kind: audio
      measured:
        centroid: 259
      note: 'his centroid across Continuum, Barbary Coast, Teen Town and Three Views
        of a Secret, against a middle of 138Hz across the twenty-seven other players
        measured, clear by 36Hz. That is 79% of the width of their middle half, which
        is what makes it a word rather than a rounding: it is the widest centroid
        margin in the corpus and the only one here that has survived every correction
        to it.'
      spread:
        centroid: 45
    term: bright
  - evidence:
    - against:
        mid: 0.05
      caveat: 'measures the record rather than the player: a fretless singing near
        the top of its range puts energy where a rock bass does not.'
      kind: audio
      measured:
        mid: 0.39
      note: 39% of his energy sits in the mid band against a middle of 5% across the
        sixteen players measured, clear by 8% and the widest gap any player has on
        any axis here. Nobody wrote this word down before the records were measured.
    term: mid-forward
id: jaco-pastorius
