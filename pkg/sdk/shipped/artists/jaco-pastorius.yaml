    evidence:
    - kind: cited
      note: the 360-361PP, described there as an 18 inch inverted speaker cabinet
        he converted to after a borrowed one on a gig
      url: https://mixdownmag.com.au/features/rig-rundown-jaco-pastorius/
    - caveat: 'the cabinet is half of what the records carry rather than none of it,
        which is the opposite of what this file used to say. It stood on a comments
        section claiming he went to the board with no preamp, against an article on
        the same page saying otherwise. Expect that claim back: a TalkBass thread
        on his tone has it stated flatly, "That ''Jaco tone'' was his bass straight
        into the mixing board ... Acoustic 360 amps have NOTHING to do with it", by
        somebody with no access to the sessions. He is on record above saying both.'
      kind: cited
      note: 'Tony Bacon interviewing him in London in 1976, the first year this rig
        covers, asked about amps: "I use an Acoustic 360. I''ve been using that about
        eight years, since they first had them. When I record, I have a line going
        direct and I have a microphone to the amp, so we get a little bit of both,
        the highs and lows. It''s just like having two mics on a piano." Asked about
        the stage sound: "it''s the same exact sound as I get in the studio."'
      url: https://reverb.com/news/jaco-pastorius-on-how-he-learned-bass-and-composition-bacons-archive
    gear: Acoustic 360
    role: amp
