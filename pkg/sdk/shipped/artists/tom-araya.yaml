id: tom-araya
ask:
  confidence: medium
  genre:
    - metal
  instrument: bass
  subject:
    kind: artist
    name: Tom Araya
    band: Slayer
    era: Reign in Blood
    years:
      from: 1986
      to: 1986
  words: []
rig:
  chain:
    - role: drive
      gear: Tech 21® SansAmp Bass Driver DI V1
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: The M80 is not modelled; this is the SansAmp Bass Driver, the DI-with-drive the device carries.
          note: Araya runs an MXR M80 Bass D.I.+, a DI with a distortion side.
          url: https://equipboard.com/pros/tom-araya
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      confidence: medium
      evidence:
        - kind: cited
          caveat: Written long after the sessions and it names no model variant or serial. It is the only source found that ties an amplifier to this record, which is why all three records measured are from this one album.
          note: 'A gear rundown of the record itself: "Araya recorded most of his bass parts on Reign In Blood through a massive Ampeg SVT head, paired with a classic 8x10 fridge cabinet." The same piece has him on a B.C. Rich Wave fitted with two P-Bass style single coils for most of the 1980s.'
          url: https://mixdownmag.com.au/features/gear-rundown-slayers-reign-in-blood/
        - kind: user
          caveat: Recorded so the next reader does not re-open it expecting evidence. The Marshall rig is real and belongs to a different era than these records.
          note: 'Opened, and it establishes nothing. Every post about the amplifier is hedged opinion — "I''m almost certain that it is the Ampegs", "I''d be willing to bet that''s what it came from" — and post 113 has him on a later rig entirely: "now Tom Araya uses a custom marshall head and custom marshall 8x10''s".'
          url: https://www.talkbass.com/threads/tom-arayas-gear-setup.164746/
    - role: cab
      gear: Ampeg 8x10
      confidence: medium
      evidence:
        - kind: cited
          caveat: '"Fridge" is a nickname rather than a model number.'
          note: 'The same sentence that names the head: "paired with a classic 8x10 fridge cabinet", which is the Ampeg SVT-810.'
          url: https://mixdownmag.com.au/features/gear-rundown-slayers-reign-in-blood/
  instrument: bass
