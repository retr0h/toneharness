    evidence:
    - caveat: |-
        what was searched, and where it ran out. The sentence everybody quotes — "according to the man himself, Klaus used an acoustic amplifier with stock speakers on Fresh Fruit for Rotting Vegetables" — is not an interview. It appears in the TalkBass thread at https://www.talkbass.com/threads/dead-kennedys-tone.287737/ in post 8, where the poster pjmuck is quoting Wikipedia and says so, then immediately doubts his own reading of it: "Now I assume they mean the Acoustic (caps) brand name of bass amps… But maybe he did play through an acoustic guitar amp???" Wikipedia cites nothing beneath it.
        Nobody in that thread was there. One poster who saw them five or six times says "Not sure what amps- likely something borrowed/stole"; another offers "i read something years ago that said it was a traynor monoblock II", which is a different amplifier entirely.
        Two long published interviews were read in full and neither mentions an amplifier: Mark Prindle's at http://www.markprindle.com/flouride-i.htm, and Jay Stone's for Dying Scene cited above. The Vinyl Guide podcast episode 23 is specifically about the making of this record and is audio nobody has transcribed here.
        If you know what he actually played through, please open a pull request.
      kind: llm
      note: asserted by a model and confirmed by nobody. The figure repeated everywhere
        is an "Acoustic 150B head and Acoustic 402 cabinet, stock speakers", said
        to run at least through In God We Trust, Inc.
    gear: Acoustic 150B
