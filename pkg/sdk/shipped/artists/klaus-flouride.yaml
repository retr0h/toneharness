  - evidence:
    - caveat: he is talking in 2015 about the instrument he had played since the early
        days, and does not date it to these sessions. It establishes the Jazz Bass
        as his instrument, not that it was the one on this record.
      kind: cited
      note: 'Flouride''s own words to Jay Stone, Dying Scene, 2015, about the Jazz
        Bass he played for decades and lost in transit: "Yeah, it''s somewhere in
        Brazil still, I''m guessing. And very probably in this Quonset hut storage
        space with TAM Airlines." He describes the replica built from photographs:
        "he''s got the chips on it, he''s done it mostly from photos. He wound the
        pickups himself. The thing actually sounds and plays better than the original
        one did."'
      url: https://dyingscene.com/archive/ds-exclusive-klaus-flouride-on-2015-era-dead-kennedys-losing-his-iconic-j-bass-and-taylor-swift/
