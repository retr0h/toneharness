# Dan Andriano — Alkaline Trio
#
# The ask. The gear this resolves to is in dan-andriano.yaml beside it.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec

subject:
  kind: artist
  name: Dan Andriano
  band: Alkaline Trio
  # One album, which is as narrow as an era here gets. All three records the
  # corpus measures are from This Addiction, and the interview behind the rig
  # was published two months after it.
  era: This Addiction
  years: { from: 2010, to: 2010 }

instrument: bass

# The genres the corpus tags these records with, which is what `measure genres`
# measures a target from.
genre: [pop-punk, punk]

played:
  - gear: Fender '62 Reissue Precision Bass
    evidence:
      - kind: cited
        url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
        note: >-
          he says how he came to them, and that they are what he plays now:
          "When we worked with producer Jerry Finn on Crimson [Vagrant, 2005],
          I played his '62 Fender P-Bass, which was the nicest bass I've ever
          played... As soon as we finished making that record, I bought two
          Fender '62 Reissue Precision Basses and sanded the finish off the
          necks to give them a wornin feel. Now I do that to all my basses."
        caveat: >-
          the same gear box names four other instruments, a GPC signature bass
          and Fender Jazz reissues among them, and he does not say which is on
          which song. This takes the one he accounts for in his own words and
          dates to five years before these records.

          Strings are left out rather than guessed. The box says "Ernie Ball"
          and that brand makes both, so nothing read here says round or flat.

# No words. Nothing read describes how these records sound in the terms this
# vocabulary carries, and the interview is about production rather than tone.

confidence: medium
