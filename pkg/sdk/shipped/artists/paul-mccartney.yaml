ask:
  confidence: low
  aliases:
    - macca
    - mccartney
  genre:
    - rock
  instrument: bass
  played:
    - gear: Rickenbacker 4001S
      evidence:
        - kind: user
          caveat: the post is signed "Mark". The interview below is what makes him Arnquist, on the zero fret and the nameplate holes he describes in both.
          note: 'Mark Arnquist, 11 August 2000: "When I worked on his bass in the mid 1970''s he did NOT have rotosound strings of any kind on it. They were flats but not rickenbacker or roto''s. I have no idea what they were." First-hand, on this instrument, immediately before the tour that produced the live album measured for this rig. The brand is nobody''s to name: the man who restrung it does not know it.'
          url: https://www.rickresource.com/forum/viewtopic.php?t=13
        - kind: cited
          caveat: the resistance figures people quote with this, a 7k neck and a 9k bridge, are not on this page. They come from a forum post relaying a phone call. The page gives no numbers and makes no claim about tone. This is also the touring instrument rather than the studio one.
          note: 'Mark Arnquist, Rickenbacker''s lead man in finishing and repair "from July 1972 to October 1976", to John F. Crowley: "The P.M. bass came back to the factory prior to the ''Wings over America tour.''" The horseshoe magnets were dead, so "we opted for a custom coil/pickup for ''The Man.'' The idea was to overwind a stock coil for a 4001." It went back out "restrung with the strings that it came in with", which is what makes his account of them first-hand.'
          url: http://www.thecanteen.com/arnquist.html
      strings: flat
  subject:
    kind: artist
    name: Paul McCartney
    band: Wings
    era: mid to late seventies touring
    years:
      from: 1975
      to: 1979
  technique:
    evidence:
      - kind: cited
        caveat: 'Juber joined in 1978, so he is first-hand for Goodnight Tonight and not for the two earlier records here; Jisi extrapolates back to Silly Love Songs. `position` is gone rather than guessed: the same Wings-era discussion has him heard as bridge pickup soloed and seen with the selector in the middle, which is about pickups and says nothing about where his right hand sat.'
        note: 'Chris Jisi, Guitar World, quoting Laurence Juber, who played guitar in Wings from 1978: "Juber confirmed that Paul played his flatwound-strung Rickenbacker 4001S with a heavy-gauge pick". Juber on the difference the rig has to cover: "Paul plays with a very hard touch onstage, but he has a real sensitivity to dynamics and note duration in the studio."'
        url: https://www.guitarworld.com/artists/bassists/paul-mccartney-wings-silly-love-songs
    attack: pick
  words:
    - evidence:
        - kind: user
          caveat: an enthusiast in 2014 describing a record by ear, which is the weakest thing this word rests on. It agrees with the measurement below and that is the whole of its value.
          note: '"I''ve also been obsessed with that middley mid, cut through the mix flatwound tone of the live Wings Rockshow/Wings Over America album", and "that cut through the mix, but in a not bright way".'
          url: https://www.rickresource.com/forum/viewtopic.php?t=411797
        - kind: audio
          against:
            mid: 0.05
          caveat: the three records measured before these were Beatles takes from 1966 and 1969, a decade before the rig this describes, and they read 0%. Measuring the era the rig claims is what moved this figure.
          measured:
            mid: 0.15
          note: 15% of his energy sits in the mid band across Silly Love Songs, With a Little Luck and Goodnight Tonight, against a middle of 5% across the sixteen players measured. Above the middle, not clear of it, so the word is not earned and the records point the way the citations do.
      term: mid-forward
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Acoustic 360
      capture: direct
      confidence: low
      substitute:
        gear: Acoustic 360
        confidence: low
        evidence:
          - kind: llm
            note: the tour rig was a power amplifier and a preamp into JBLs, and this device models none of those parts. The Acoustic 360 is the only Wings-era bass amplifier it carries, so it stands in for a rig it is not.
      evidence:
        - kind: cited
          caveat: so the Acoustic 360 here is the wrong tour's amplifier, kept only because nothing models a Crown, an Audio Master or a JBL. What the preset sounds like is a 360, and what he played through was not.
          note: '"But the ''75/''76 world tour was another matter. He had a pretty sizeable rig there, with two Crown 300A amps and an Audio Master preamp, and these drove a set of JBL speakers, a Roy Clare 2x12 midrange bin and JBL horns." John Hammel, McCartney''s assistant since the Beatles split, to Mark Cunningham, published September 1993 and put online in 2019. The same passage puts the Acoustic 360 on the 1972 and 1973 tours rather than this one, and ends the era this rig covers on something else again: "for the last UK tour in 1979, Paul switched to using 120-watt Fender Bassmans and three 4x12 cabinets with angled speakers."'
          url: https://guitar.com/features/interviews/paul-mccartney-beatles-wings/
      stage: true
    - role: cab
      gear: Acoustic 361
      capture: direct
      confidence: low
      substitute:
        gear: Acoustic 360
        confidence: medium
        evidence:
          - kind: llm
            note: the device carries a 1x18 named for the 360 rather than the 361.
      evidence:
        - kind: cited
          caveat: nothing here models a JBL or a Roy Clare, so the cabinet is the wrong tour's for the same reason the amplifier is.
          note: the same passage gives the 1975 and 1976 tour "a set of JBL speakers, a Roy Clare 2x12 midrange bin and JBL horns", so the 361 belongs to the earlier tours along with the 360 head it was part of.
          url: https://guitar.com/features/interviews/paul-mccartney-beatles-wings/
      stage: true
    - role: eq
      gear: Simple EQ
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
