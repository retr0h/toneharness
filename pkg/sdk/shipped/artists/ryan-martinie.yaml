      confidence: medium
      evidence:
        - kind: user
          caveat: A transcription, so the magazine is the source and nobody has checked the copying against it. The same post gives the recording rig as the full Ampeg plus an SWR Workingman's 10 head driving a Mesa/Boogie 4x12 guitar cabinet for added midrange and top end, which means the records measured here carry a second amplifier this chain does not have.
