      capture: direct
      confidence: low
      substitute:
        gear: SVT-4 Pro
        confidence: high
        evidence:
          - kind: store
            caveat: |-
              not a substitution in the usual sense: the gear is right and only the name is awkward. It sits here because a rig names real-world gear and this model has no real-world name recorded, so the cited name stays above and the one that resolves sits beneath it.

              Worth removing if the gear map ever learns this model, which would be the better fix and is not one this file can make.
            note: the same amplifier, reached by the name the device gives it rather than by the name a person would write. Line 6 publish no gear this model is based on, so there is nothing for "Ampeg SVT-4 Pro" to match against.
      evidence:
        - kind: user
          caveat: |-
            an audience's account of a stage, which is the weakest kind of first-hand there is: a rack seen from the crowd says which boxes were on it and nothing about what was recorded. No magazine, interview or technician is behind this.
            The thread also carries the competing claim, and it is worth keeping because it is the one most repeated elsewhere: "Mark also uses a Mesa/Boogie 400+, so that might be what he used in the studio." The poster's own "might be" is the whole of its evidence, so it is recorded here and not acted on. Both cannot be the head on these records and nothing read here settles which.
          note: 'a thread opened while the rig was current, about the bass sound on "The Rock Show", by somebody who had been to that year''s tour: "i remember back to when i was the concert this year and it sounded pretty much the same". He lists what he saw: "3 Ampeg SVT810e cabs -SVT4 pro", and answers a competing suggestion later in the thread with "he actually uses ampeg heads and ampeg cabs he uses the SVT-4pro".'
          url: https://www.talkbass.com/threads/mark-hoppus-tones.19318/
