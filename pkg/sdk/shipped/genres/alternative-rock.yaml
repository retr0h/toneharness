  words: []
rig:
  chain:
    - role: drive
      gear: Earthquaker Devices Life - Boost circuit
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 123
            decay: 0.45
            dynamics: 6.7
            harmonics: 0.16
            high: 0
            lean: 0.86
            low: 0.97
            mid: 0.03
            transient: 0.71
          note: 'Chosen by measurement rather than by anybody''s say-so. Earthquaker Devices Life - Boost circuit is the closest of the 52 bass drives this device models to alternative-rock, sitting at 124 Hz against 146. Across 9 records from 3 players, alternative-rock earns long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. Its controls were not moved: none of them reaches what that asks for, so they are the catalog''s defaults.'
      enabled: false
    - role: amp
      gear: Ampeg B-15NF Portaflex
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: |-
            Read from the automatic captions, which mangle model numbers in the usual way: the SVT-2 Pro he names for his live rig arrives as "the SPT" and the B-15s as "be fifteens".

            The interview is 2010 and the records above end in 1999, so the sentence is him looking back. He says "every record" and names no album, so which flip top and which 8x10 on which session is not established, and neither is anything about the desk or the microphone those records went through.
          note: |-
            In his own words, in a gearwire interview filmed on 24 June 2010, about what is on the records rather than what was on stage that year: "the reason why I ended up with the set up I've got now is because on every record I've always used one flip top and an old 8 by 10 and generally that's everything and the only thing overused in the studio". A flip top is the Ampeg B-15 Portaflex, which is what the name describes.

            He opens the same interview naming himself, "hi there my name's Chris I'll play bass in silver chair", and the only other voice in it is the interviewer asking him questions.
          url: https://www.youtube.com/watch?v=b1egYvnHl9c
    - role: eq
      gear: MXR 10-Band Graphic EQ
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 123
            decay: 0.45
            dynamics: 6.7
            harmonics: 0.16
            high: 0
            lean: 0.86
            low: 0.97
            mid: 0.03
            transient: 0.71
          note: Chosen by measurement rather than by anybody's say-so. MXR 10-Band Graphic EQ is the closest of the 8 bass equalisers this device models to alternative-rock, sitting at 124 Hz against 146. Across 9 records from 3 players, alternative-rock earns long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
      controls:
        125Hz: "0.0"
        1kHz: "0.0"
        250Hz: "-3.75"
        2kHz: "-3.75"
        31p25Hz: "0.0"
        500Hz: "0.0"
        62p5Hz: "0.0"
      enabled: false
  instrument: bass
