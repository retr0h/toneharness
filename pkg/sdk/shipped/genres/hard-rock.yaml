            decay: 0.45
            dynamics: 7.5
            harmonics: 0.16
            high: 0
            lean: 0.9
            low: 0.98
            mid: 0.03
            transient: 0.68
          note: Chosen by measurement rather than by anybody's say-so. Plateaux is the closest of the 4 bass reverbs this device models to hard-rock, sitting at 122 Hz against 155. Across 16 records from 5 players, hard-rock earns long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because hard-rock earns "long-decay" against the players who measure otherwise, by 0.15 of decay, and that is the figure a pedalboard answers with a reverb. It arrives switched off.
