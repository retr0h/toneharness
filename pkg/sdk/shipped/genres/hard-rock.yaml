    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: John Paul Jones used an Acoustic 360 rather than an Ampeg, so this is the centre of the group rather than a claim about any record.
          note: Cliff Williams plays an Ampeg SVT-4PRO into an SVT-810E and uses no effects pedals at all, which is why this names no drive. Of the five players hard rock is measured from his rig is the plainest documented.
          url: https://equipboard.com/pros/cliff-williams
    - role: cab
      gear: 8x10" Ampeg SVT-810AV
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: The SVT-810E. The device models the 810AV, a later revision of the same cabinet.
          url: https://whatgear.com/pro/cliff-williams
  instrument: bass
