            mid: 0.01
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. Xotic EP Booster is the closest of the 19 bass drives this device models to metal, sitting at 123 Hz against 125. Across 10 records from 3 players, metal earns scooped, dark and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
