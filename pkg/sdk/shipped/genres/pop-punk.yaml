      Bias: "0.5"
      BiasX: "0.6"
      ChVol: "0.6"
      Drive: "0.55"
      HighMid: "0.62"
      Hum: "0.5"
      Master: "0.55"
      Mid: "0.52"
      Ripple: "0.5"
      Sag: "0.72"
      Treble: "0.87"
    evidence:
    - caveat: 'A genre measured off finished records, so the figures carry the amplifier,
        the microphone, the desk and the master of every one of them. The amplifier
        below is what sits nearest those figures, not one anybody is known to have
        used. It also moves: a genre is measured against the players who play none
        of it, so this answer changes when the corpus gains players, and it is worth
        rebuilding rather than trusting indefinitely. Grunge is the example. It held
        scooped, dark and clean; twenty-five records from five other genres joined
        the corpus and it held nothing, because the rule then asked a genre to be
        unusual rather than to be something; it holds scooped again now that words
        may overlap, and clean is gone from every subject because a low share of energy
        above the fundamental turned out not to be evidence of no drive.'
      kind: audio
      note: 'Chosen by measurement rather than by anybody''s say-so. Across 12 records
        from 4 players, pop-punk measures a centroid the device''s nearest bass amplifier
        sits at 169 Hz against 156, which is the closest of the 27 it models for this
        instrument. Its records earn no word: on every figure a word can come from,
        it sits within a quarter of a spread of the players who play none of it. The
        controls below are therefore this instrument''s corpus medians, and the amplifier
        is the only part of this rig the genre''s own figures decided.'
    - kind: audio
      note: |-
        This rig is the same chain as Hard rock and Southern rock's, control for control, and that is the evidence rather than a bug. On the figures a word can be earned from, the three are nearly one genre: median centroids of 132 Hz for hard-rock, 133 Hz for pop-punk, 131 Hz for southern-rock, 3.1% for hard-rock, 2.4% for pop-punk, 2.5% for southern-rock of the energy in the mids, and 1.6% for hard-rock, 1.7% for pop-punk, 2.5% for southern-rock of it above the fundamental. None of them earns a word, so none moves off this instrument's corpus medians, and the nearest amplifier to all three is the same one.

        The figure that does separate them is decay, 0.55 for hard-rock, 0.85 for pop-punk, 0.28 for southern-rock, and it cannot award a word: a player's own records disagree on decay by more than the whole corpus spans, so an axis built on it would hand out verdicts on noise.

        Growing the corpus has not changed it. These were two identical rigs when southern rock held 18 records; it holds 12 from 4 players now, hard rock joined them rather than separating, and all three are still the same preset.
    - kind: audio
      note: |-
        This rig is the same chain as Hard rock and Southern rock's, control for control, and that is the evidence rather than a bug.

        On the figures a word can be earned from, the three are nearly one genre. Median centroid: 132 Hz hard-rock, 133 Hz pop-punk, 131 Hz southern-rock. Share of the energy in the mids: 3.1% hard-rock, 2.4% pop-punk, 2.5% southern-rock. Share above the fundamental: 1.6% hard-rock, 1.7% pop-punk, 2.5% southern-rock. None of them earns a word, so none moves off this instrument's corpus medians, and the nearest amplifier to all three is the same one.

        The figure that does separate them is decay, where they read 0.55 hard-rock, 0.85 pop-punk, 0.28 southern-rock, and it cannot award a word: a player's own records disagree on decay by more than the whole corpus spans, so an axis built on it would hand out verdicts on noise.

        Growing the corpus has not changed it. Two of these were identical when southern rock held 18 records; it holds 12 from 4 players now, hard rock joined them rather than separating, and all three are still one preset.
    - kind: audio
      note: |-
        This rig is the same chain as Hard rock and Southern rock's, control for control, and that is the evidence rather than a bug.

        On the figures a word can be earned from, the three are nearly one genre. Median centroid: 132 Hz hard-rock, 133 Hz pop-punk, 131 Hz southern-rock. Share of the energy in the mids: 3.1% hard-rock, 2.4% pop-punk, 2.5% southern-rock. Share above the fundamental: 1.6% hard-rock, 1.7% pop-punk, 2.5% southern-rock. None of them earns a word, so none moves off this instrument's corpus medians, and the nearest amplifier to all three is the same one.

        The figure that does separate them is decay, where they read 0.55 hard-rock, 0.85 pop-punk, 0.28 southern-rock, and it cannot award a word: a player's own records disagree on decay by more than the whole corpus spans, so an axis built on it would hand out verdicts on noise.

        Growing the corpus has not changed it. Two of these were identical when southern rock held 18 records; it holds 30 from 10 players now, hard rock joined them rather than separating, and all three are still one preset.
