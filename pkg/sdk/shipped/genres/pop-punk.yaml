# Pop-punk — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched. `tone build` ranked the device's bass amplifiers
# against what pop-punk measures as and took the nearest, which is reproducible: run
# it again on the same corpus and it answers the same way.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
id: pop-punk

ask:
  aliases: [pop-punk-sound]

  subject:
    kind: genre
    name: Pop-punk

  instrument: bass

  genre: [pop-punk]

  # Nothing here was read about a person, because there is no person. The
  # confidence is in the measurement and the measurement is of other people's
  # records.
  confidence: low

rig:
  instrument: bass

  # The signal path, in order.
  chain:
    - role: amp
      gear: MESA/Boogie Bass 400+
      capture: direct
      evidence:
        - kind: audio
          note: >-
            chosen by measurement rather than by anybody's say-so. Across 12
            records from 4 players, pop-punk measures a centroid the device's
            nearest bass amplifier sits at 150 Hz against 147, which is the closest of the
            twenty-seven it models for this instrument.

            Its records earn no word: the genre has a position and nothing that
            sets it apart from the players who play none of it.
          caveat: >-
            a genre measured off finished records, so the figures carry the
            amplifier, the microphone, the desk and the master of every one of
            them. The amplifier below is what sits nearest those figures, not one
            anybody is known to have used.

            It also moves. A genre is measured against the players who play none
            of it, so this answer changes when the corpus gains players, and it
            is worth rebuilding rather than trusting indefinitely.
      confidence: low

    - role: cab
      gear: Ampeg 8x10
      capture: direct
      evidence:
        - kind: corpus
          note: >-
            what presets for this instrument almost always hold, rather than
            anything about this genre. An eight-by-ten behind a big valve head is
            the ordinary pairing in the preset corpus.
          caveat: >-
            a habit rather than a measurement of these records. Nothing here says
            this genre was recorded through one.
      confidence: low
