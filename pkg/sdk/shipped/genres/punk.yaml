    name: Punk
  words: []
rig:
  chain:
    - role: drive
      gear: MAXON SD9 Sonic Distortion
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 174
            decay: 0.4
            dynamics: 6.1
            harmonics: 0.18
            high: 0
            lean: 0.88
            low: 0.88
            mid: 0.11
            transient: 0.74
          note: 'Chosen by measurement rather than by anybody''s say-so. MAXON SD9 Sonic Distortion is the closest of the 52 bass drives this device models to punk, sitting at 227 Hz against 282. Across 21 records from 7 players, punk earns mid-forward, bright and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. Its controls were not moved: none of them reaches what that asks for, so they are the catalog''s defaults.'
      enabled: false
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            the touring rig, and the quote is about amplifiers failing rather than about a record. The article is a 2010 retrospective on a 1977 album, so it is a writer assembling a period rig thirty years later and not somebody who was in the room.
            Nothing found says what was in Mediasound for these sessions. A band that owned three SVTs very likely recorded through one, and "very likely" is not evidence.
          note: 'Wallace Marx Jr., "Maximum Energy: The Gear of the Original Punks", Premier Guitar, 18 May 2010. It puts him on three Ampeg SVT 300-watt heads with three matching 8x10 cabinets, bought once there was money for them, and quotes him from a 1976 documentary on why: "We play so loud that the amps couldn''t take it… But now we got these amps that they… work."'
          url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
