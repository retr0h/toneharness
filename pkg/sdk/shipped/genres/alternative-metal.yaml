            centroid: 114
            decay: 0.23
            dynamics: 8.5
            harmonics: 0.17
            high: 0
            lean: 0.86
            low: 0.99
            mid: 0.01
            transient: 0.71
          note: 'Chosen by measurement rather than by anybody''s say-so. Earthquaker Devices Life - Boost circuit is the closest of the 52 bass drives this device models to alternative-metal, sitting at 124 Hz against 118. Across 19 records from 6 players, alternative-metal earns scooped, dark and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. Its controls were not moved: none of them reaches what that asks for, so they are the catalog''s defaults.'
      enabled: false
    - role: amp
      gear: Ampeg SVT
      confidence: medium
      evidence:
        - kind: cited
          caveat: It covers his whole tenure rather than one record, and it names no cabinet, so no cabinet is claimed below. The SVT-2 Pro is the valve SVT reissue generation, so the model here is the same amplifier a generation earlier. The SansAmp the same source names is in the chain below, as a drive.
          note: 'Premier Guitar''s remembrance of him, which states the rig in one sentence: "Cheng held the fort down with 4-string Fender P basses played with his fingers—occasionally using fretless models on White Pony—through Ampeg SVT-2 Pro heads and really only used a Tech 21 SansAmp GT2 for extra balls."'
