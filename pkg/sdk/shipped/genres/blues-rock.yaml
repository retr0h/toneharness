  genre:
    - blues-rock
  instrument: bass
  subject:
    kind: genre
    name: Blues rock
  words: []
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: MESA/Boogie Bass 400+ (channel 1)
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 138
            decay: 0.24
            dynamics: 6.9
            harmonics: 0.11
            high: 0
            lean: 0.88
            low: 0.96
            mid: 0.04
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. MESA/Boogie Bass 400+ (channel 1) is the closest of the 27 bass amplifiers this device models to blues-rock, sitting at 155 Hz against 165. Across 9 records from 3 players, blues-rock earns mid-forward and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
    - role: cab
      gear: Legacy 6x10" MESA/Boogie Power House
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
