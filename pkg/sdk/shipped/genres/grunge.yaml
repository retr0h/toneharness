      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: Novoselic's, not the genre's. Ben Shepherd, Jeff Ament, Chris Joannou and Mike Starr are not documented reaching for it.
          note: The one drive any of grunge's five players is documented with, and it is the pedal in Krist Novoselic's own rig in this collection, named by his technician.
          url: https://equipboard.com/pros/krist-novoselic
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: Novoselic used Ampeg SVT-400T and SVT-II heads, and cut Nevermind on an SVT-400T. Ben Shepherd ran Ampeg SVT and Mesa heads in the studio alongside a B-15. The Aguilar Tone Hammer that stood here before is used by none of them.
          url: https://equipboard.com/pros/krist-novoselic
    - role: cab
      gear: Mesa/Boogie 2x15
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: Nevermind was cut through a 2x15, and the Nevermind tour ran Mesa RR 2x15 cabinets. This one was already right.
          url: https://equipboard.com/pros/krist-novoselic
  instrument: bass
