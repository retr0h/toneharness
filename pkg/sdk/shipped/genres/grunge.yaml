            harmonics: 0.11
            high: 0
            lean: 0.86
            low: 0.99
            mid: 0.01
            transient: 0.69
          note: 'Chosen by measurement rather than by anybody''s say-so. Alpaca Rouge is the closest of the 52 bass drives this device models to grunge, sitting at 104 Hz against 111. Across 15 records from 5 players, grunge earns scooped, dark and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. Its controls were not moved: none of them reaches what that asks for, so they are the catalog''s defaults.'
