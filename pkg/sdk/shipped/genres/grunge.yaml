# Grunge — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched. `tone build` ranked the device's bass amplifiers
# against what grunge measures as and took the nearest, which is reproducible: run
# it again on the same corpus and it answers the same way.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
ask:
  aliases:
  - grunge-sound
  confidence: low
  genre:
  - grunge
  instrument: bass
  subject:
    kind: genre
    name: Grunge
  words:
  - term: scooped
  - term: dark
  - term: clean
id: grunge
rig:
  chain:
  - controls:
      Attack: "0.035"
      Knee: "6.0"
      Level: "5.2"
      Mix: "1.0"
      Ratio: "3"
      Release: "0.2"
      Threshold: "-37.1"
    evidence:
    - kind: corpus
      note: 'added by the compiler rather than named in the rig: a chain of this kind
        almost always holds one, and the corpus statistics are what put it here.'
    gear: Deluxe Comp
    role: comp
  - capture: direct
    confidence: low
    controls:
      Bass: "0.41"
      Bias: "0.74"
      BiasX: "0.5"
      ChVol: "0.8"
      Drive: "0.35"
      Hum: "0.5"
      Master: "1.0"
      Mid: "0.6900000000000001"
      MidFreq: "2"
      Ripple: "0.5"
      Sag: "0.5"
      Treble: "0.82"
    evidence:
    - caveat: |-
        a genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. The amplifier below is what sits nearest those figures, not one anybody is known to have used.
        It also moves. A genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.
      kind: audio
      note: |-
        chosen by measurement rather than by anybody's say-so. Across 9 records from 3 players, grunge measures a centroid the device's nearest bass amplifier sits at 117 Hz against 135, which is the closest of the twenty-seven it models for this instrument.
        Its records earn scooped, dark and clean.
    gear: Ampeg SVT
    role: amp
  - capture: direct
    confidence: low
    controls:
      Distance: "1.0"
      EarlyReflections: "0.0"
      High Cut: "8000.0"
      Level: "0.0"
      LowCut: "19.9"
    evidence:
    - caveat: a habit rather than a measurement of these records. Nothing here says
        this genre was recorded through one.
      kind: corpus
      note: what presets for this instrument almost always hold, rather than anything
        about this genre. An eight-by-ten behind a big valve head is the ordinary
        pairing in the preset corpus.
    gear: Ampeg 8x10
    role: cab
  instrument: bass
  preset:
    dsp0:
