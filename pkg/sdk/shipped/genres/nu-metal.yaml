      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 109
            decay: 0.23
            dynamics: 7.2
            harmonics: 0.17
            high: 0
            lean: 0.92
            low: 1
            mid: 0
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. Darkglass Electronics Microtubes B7K Ultra is the closest of the 19 bass drives this device models to nu-metal, sitting at 104 Hz against 75. Across 9 records from 3 players, nu-metal earns scooped, dark and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
      controls:
        Attack: "1"
        Bass: "10.0"
        HiMid: "-11.25"
        HiMidFreq: "0"
        LoMid: "-15.0"
        LoMidFreq: "1"
      enabled: false
    - role: amp
      gear: Ampeg SVT
      confidence: medium
      evidence:
        - kind: cited
          caveat: It covers his whole tenure rather than one record, and it names no cabinet, so no cabinet is claimed below. The SVT-2 Pro is the valve SVT reissue generation, so the model here is the same amplifier a generation earlier. The SansAmp the same source names is in the chain below, as a drive.
          note: 'Premier Guitar''s remembrance of him, which states the rig in one sentence: "Cheng held the fort down with 4-string Fender P basses played with his fingers—occasionally using fretless models on White Pony—through Ampeg SVT-2 Pro heads and really only used a Tech 21 SansAmp GT2 for extra balls."'
          url: https://www.premierguitar.com/articles/In_Remembrance_Chi_Chengs_Low_End_Legacy
