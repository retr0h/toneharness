    - caveat: which says this cabinet is not on the records this rig is measured against.
        It stays because a preset with no cab into a PA is not the sound either, and
        swapping it for a DI is a decision nobody has made. The figures here are a
        direct signal and the cab is not.
      kind: cited
      note: 'asked how he records: "I go out of the back of my MESA/Boogie amp direct
        into the board. They pad the signal somehow. We''ve always put up a mike in
        front of the bass amp, but we''ve never used it."'
      url: http://www.ram.org/music/primus/articles/bp1.html
