# Les Claypool — Primus
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in les-claypool.yaml beside it.
ask:
  aliases:
  - claypool
  - primus
  confidence: medium
  genre:
  - funk metal
  - experimental rock
  instrument: bass
  played:
  - evidence:
    - caveat: he plays a four and a six across these records and this field names
        one of them. See the note under this block for which is where.
      kind: cited
      note: 'the luthier''s own pages, with build dates: the 4-string he has played
        since he was a teenager, and a 6-string fretted "sold to Les just before Pork
        Soda was recorded in 1993"'
      url: https://ctbasses.com/players/les-claypool
    - caveat: a fan transcription of a print article rather than a scan, with the
        typos to prove it. Nothing here names the Tune's model; two dealer listings
        call it a Zi-III and a dealer selling one is not a source.
      kind: cited
      note: 'Guitar Player, August 1991, three months after the album: while Carl
        Thompson was building the Rainbow Bass, "I used a Japanese Tune fretless ...
        When I first ripped the frets out, it freaked me out".'
      url: http://www.ram.org/music/primus/articles/funky.html
    - caveat: an excerpt hosted by the luthier rather than the magazine's own page.
      kind: cited
      note: 'Bass Player, February 1993: "If I''d had this fretted bass for ''Jerry
        Was a Racecar Drive'' ... I''d probably have used it instead. It makes your
        fingers super-strong to do tapping on a fretless."'
      url: https://ctbasses.com/les-claypool-primus
    - caveat: 'the four-string only, which is what this field names. The six takes
        "a standard light-gauge set" and the winding is not given. Dated from inside
        the article rather than a masthead: Seas of Cheese is "their latest full-length
        album" and he has just won the 1992 readers'' poll.'
      kind: cited
      note: 'Bass Player, c. February 1993: "On his 4-string electrics, Les uses Dean
        Markley nickel roundwounds -- but here''s the secret: his set consists of
        two A strings (.080) and two G strings (.040)."'
      url: http://www.ram.org/music/primus/articles/bp1.html
    gear: Carl Thompson 4-string
    strings: round
  - evidence:
    - kind: cited
      note: 'Guitar Player, August 1991, three months after the album, on what he
        used while Carl Thompson built the Rainbow Bass: "I used a Japanese Tune fretless
        ... When I first ripped the frets out, it freaked me out". The same piece
        names the track: "his 6-string fretless work behing Tom Waits'' cameo vocal
        on ''Tommy The Cat''".'
      url: http://www.ram.org/music/primus/articles/funky.html
    - caveat: the dates are what make this the Tune rather than the Rainbow. The album
        was tracked in January 1991 and credits a six-string fretless; Carl Thompson
        finished the Rainbow on 5 February 1991, and Les "received the bass just in
        time to tour following recording".
      kind: cited
      note: 'Bass Player, February 1993, putting the other measured track on a fretless
        too: "If I''d had this fretted bass for ''Jerry Was a Racecar Drive'' ...
        It makes your fingers super-strong to do tapping on a fretless."'
      url: https://ctbasses.com/les-claypool-primus
    gear: Tune 6-string, de-fretted
    records:
    - jerry-was-a-race-car-driver
    - tommy-the-cat
  subject:
    band: Primus
    era: Sailing the Seas of Cheese through Tales from the Punchbowl
    kind: artist
    name: Les Claypool
    years:
      from: 1991
      to: 1995
  technique:
    attack: slap
    evidence:
    - caveat: tapping is half of it and this format has no word for that.
      kind: cited
      note: a rapid slapped and tapped style
      url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
  words:
  - evidence:
    - kind: cited
      note: described there as a heavy, thumping tone
      url: https://mixdownmag.com.au/features/rig-rundown-les-claypool/
    term: loose-low-end
  - evidence:
    - caveat: a fan transcription rather than a scan, from the same archive this file
        cites twice already, and read narrowly the second quote is about what he plays
        rather than how it sounds.
      kind: cited
      note: 'Guitar School, August 1995, on Tales from the Punchbowl, the album that
        closes this rig''s years: "Claypool''s dizzying, violently percussive textures
        are still on display". Claypool in the same piece: "even when I''ve soloed,
        I''ve never really played melodies as much as percussive rhythmic pieces."'
      url: http://www.ram.org/music/primus/articles/cyberfunk.html
    term: percussive
id: les-claypool
