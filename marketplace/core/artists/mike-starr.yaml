  words: []
rig:
  chain:
    - role: mod
      gear: MXR Flanger
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: The BF-2 is not modelled; this is the MXR, the flanger the device carries.
          note: Starr used a Boss BF-2 flanger, which is the sound on Rooster.
          url: https://equipboard.com/pros/mike-starr
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      capture: both
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            **a second account of the same record that does not agree with the first, and the chain is unchanged by it.** Jerden produced Dirt, so he outranks a forum post relaying somebody who was at the session, and what he describes is five bass tracks where the account above has three. Neither names the other's gear: his has a SansAmp, a Vox Westminster and a straight DI where the other has an ART Nightbass preset and an acoustic bass.
            Not taken, and the reason is the citation rather than the claim. equipboard relays the quote and gives no link to it, attributing it only to "an article about Jerry Cantrell's guitar tone on Dirt", and the gearspace thread behind it refuses a fetch. That is the same wall five leads died on in rounds one and two, and the same reason Ryan Martinie's amplifier was left alone.
            The one thing both agree on is the amplifier, which is what this rig holds. Most likely both are right about different songs: one describes Would? and the other the album.
            A Tube Screamer appears in a search engine's summary of the same material and not in the quote itself, so no pedal reaches this rig from it.
          note: 'Dave Jerden, who produced the record, quoted as: "I had an SVT amp plus A Sans Amp track, and I had an EFX track for bass that had slight chorusing /Flanging PLUS a straight DI track AND a VOX Westminster bass amp with an 18\" speaker! So I had 5 tracks Bass!"'
          url: https://equipboard.com/pros/mike-starr
        - kind: user
          caveat: 'A forum post relaying somebody who was at the session, which is one remove from first-hand and better than most of what exists for this era. Evan has not been asked directly and the thread is the only place this appears. Two things it does not settle. The SVT-2 is the valve reissue generation where the model here is the original, so this is the same amplifier a generation apart. And the quotation is about one song: Would? is on Dirt and the Singles soundtrack, and whether Facelift two years earlier used the same rig is an assumption rather than a finding. Worth knowing for anybody extending this: the account has three bass tracks blended, and only the first is an amplifier. The other two are an ART Nightbass preset straight to the desk and an acoustic bass guitar, so a chain with one amplifier in it reproduces a third of what was printed.'
          note: 'Opened, and it carries a named first-hand witness at one remove. Post 77 of the thread, from wolfkeller: "well, after speaking with Evan of Bass Northwest in Seattle, who was there for the recording, here is how Would was recorded. 3 tracks of bass. 1) Spector NS2 into Ampeg SVT 2 into 8x10 E. track 2) Spector into ART Nightbass on rickenfaker preset tweaked a bit into board. track 3) Kramer Ferrington acoustic bass into board. Mixx the 3, that''s the sound." Three other posters put him on the same gear without the detail. Mr. Dead: "Mike Inez used the same bass/rig setup (Spector/Ampeg) as original A.I.C. bassist Mike Starr". Angus, on the band''s bass sound: "Spector basses and Ampeg amps."'
          url: https://www.talkbass.com/threads/x.553451/
    - role: cab
      gear: Ampeg 8x10
      confidence: low
      evidence:
        - kind: user
          caveat: From the same relayed account, and the device models a legacy Ampeg SVT-E rather than the 810E specifically.
          note: Named in the same sentence as the head, an Ampeg 8x10E.
          url: https://www.talkbass.com/threads/x.553451/
  instrument: bass
