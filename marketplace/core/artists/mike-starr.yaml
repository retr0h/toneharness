          note: 'Not chosen by measurement. None of the 5 bass equalisers this device models is measurably nearer mike-starr than the others, so MESA/Boogie Mark IV Graphic EQ is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 3 records from 1 players, mike-starr earns scooped, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because mike-starr earns "scooped" against the players who measure otherwise, by 0.0205 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
