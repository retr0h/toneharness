# Bootsy Collins — Parliament-Funkadelic
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in bootsy-collins.yaml beside it.

schema: ToneSpec
id: bootsy-collins

ask:
  aliases: [bootsy, william-collins]

  subject:
    kind: artist
    name: Bootsy Collins
    band: Parliament-Funkadelic
    era: Stretchin' Out through Ahh... The Name Is Bootsy
    years: { from: 1976, to: 1977 }

  instrument: bass

  # No record of theirs carries a genre tag, so this is general knowledge about a
  # well-known player rather than anything measured, recorded the same way the
  # manifests' own `genres_by: llm` tags are. `measure genres` earns words only
  # from tagged records, so this places the ask and earns it nothing.
  genre: [funk]

  words:
    - term: envelope-swept
      evidence:
        - kind: cited
          url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
          note: '"a squelchy, synth-like tone when playing leads or slap"'
    # `clean` was here on a model's say-so. His records measure 22% of their
    # energy above the fundamental against a middle of 24%, which is the middle
    # of the corpus rather than the clean end of it, so the word is gone.
    - term: mid-forward
      evidence:
        - kind: audio
          measured: { mid: 0.23 }
          against: { mid: 0.04 }
          spread: { mid: 0.09 }
          note: >-
            23% of his energy sits in the mid band across the four records,
            against a middle of 5% across the sixteen players measured, clear
            by 8%. Earned against every corpus this has been measured against.
          caveat: >-
            measures the record rather than the player, and the envelope filter
            this rig is mostly about is a mid-band effect: the figure describes
            the Mu-Tron as much as the bass.

  played:
    - gear: Space Bass
      strings: round
      evidence:
        - kind: cited
          url: https://worldradiohistory.com/Archive-All-Music/International-Musician/70s/International-Musician-1978-08.pdf
          note: >-
            International Musician, August 1978, page 79, "Bootsy's Spaced-Out
            Bass", a gear interview built around the instrument: "On his basses
            he used Rotosound Swingbass strings." Swing Bass is a roundwound, and
            the same issue calls it "probably the biggest selling string for bass
            guitar in the world". The piece also gives the order of instruments:
            "He had been using both Fender Precision and Jazz basses, but wanted
            something different."
          caveat: >-
            eighteen months after the second of these two records, and a
            statement about what he uses rather than about a session. A scan
            rather than a transcription, which is the one thing here that is
            better than usual.
        - kind: cited
          url: https://www.discogs.com/release/570769
          note: >-
            the Stretchin' Out sleeve credits "Bootsy Collins — Bass [Space
            Bass]" and names who built it, "Sir Larry Pless" and "Gus Zuppi
            Music". The 1977 album's sleeve credits the Space Bass the same way.
          caveat: >-
            a sleeve transcription rather than a scan, though it is consistent
            across independent pressings.
        - kind: cited
          url: https://web.archive.org/web/20200726000028/http://www.angelfire.com/music2/pfunk/feat-spacebass.html
          note: >-
            the builder's own account of the Stretchin' Out cover shoot: "I had
            the bass about half built ... The bass had a coat of white paint on
            it and the pick-guard and thats about all."
          caveat: >-
            the instrument on that sleeve photograph was an unplayable body, so
            the cover is not evidence for the sessions. The album was cut across
            1975 and 1976 and the credit above is.

  technique:
    attack: slap
    evidence:
      - kind: cited
        url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
        note: the filter described as used "when playing leads or slap"
        caveat: >-
          which is the effect being described rather than his hands. Not a
          statement about attack from anybody who watched him.

  confidence: low

rig:
  instrument: bass

  chain:
    - role: other
      gear: Mu-Tron III
      settings:
        # Line 6 ship this model fully wet and nobody has measured how much dry
        # signal Bootsy keeps under his. This says the default out loud rather
        # than claiming something nobody checked.
        mix: 1.0
      evidence:
        - kind: cited
          url: https://mixdownmag.com.au/features/gear-rundown-bootsy-collins/
          note: >-
            "since the '70s, Bootsy has been a devout user of the Musictronics
            Mu-Tron III Envelope Filter"
      confidence: high

    - role: amp
      gear: Alembic F2-B
      substitute:
        gear: Ampeg B-15
        evidence:
          - kind: llm
            note: >-
              a model's guess at the nearest clean tube bass preamp this device
              carries. Nobody has compared them.
        confidence: low
      evidence:
        - kind: cited
          url: https://www.uberproaudio.com/who-plays-what/295-bootsy-collins-bass-rig-gear-and-equipment
          note: >-
            an Alembic F2-B preamp into Crown power amps and eight custom
            Electro-Voice cabinets
          caveat: >-
            nothing on this device emulates the F2-B, and the power amps and
            cabinets are custom. What is here is the filter and something clean
            behind it.
      confidence: medium
