      confidence: medium
      substitute:
        gear: Ampeg B-15
        confidence: low
        evidence:
          - kind: llm
            note: a model's guess at the nearest clean tube bass preamp this device carries. Nobody has compared them.
      evidence:
        - kind: cited
          caveat: nothing on this device emulates the F2-B, and the power amps and cabinets are custom. What is here is the filter and something clean behind it.
          note: an Alembic F2-B preamp into Crown power amps and eight custom Electro-Voice cabinets
