    evidence:
    - caveat: 'A forum account rather than a citation, and it hedges in the right
        place: the SVT-6 is stated flatly and what he moved to is not. The SVT-6 is
        a hybrid with a valve preamp and a solid-state output section, where the model
        here is the original all-valve SVT, so this is the same family and not the
        same amplifier. A second thread was opened and adds only a first- hand sighting
        of the Aguilar cabinet at a later show, which is why the era above stops before
        it.'
      kind: user
      note: 'Opened. The one post carrying gear is ETEcarmine, who has seen the band
        repeatedly: "He used to use 2 Ampeg SVT 6 and either an Ampeg 8x10 or a 4x10
        w/ a 1x15, depending on the show. Now he uses the chocolate thunder Aguilar
        DB 8x10, but I don''t know if he switched amps."'
