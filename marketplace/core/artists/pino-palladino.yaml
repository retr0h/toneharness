# Pino Palladino — D'Angelo, Voodoo
#
# The ask: who he is, how he played, and what he played, and under `rig:`
# the gear that resolves to. The two were separate files until version 2
# of the contract and this line still said so.

schema: ToneSpec
version: 4.0.0
id: pino-palladino
ask:
  confidence: medium
  aliases:
    - pino
    - palladino
  genre:
    - soul
    - rhythm and blues
  instrument: bass
  played:
    - gear: Fender Precision Bass, 1963
      evidence:
        - kind: cited
          note: the 1963 Precision with flatwounds is what the rundown describes
          url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        - kind: cited
          caveat: 'two instruments, and he does not say which track took which. The tuning is the part this rig cannot carry: dropping the bottom on heavy flats is most of why he reads 96Hz, the darkest of the sixteen players, and no field here holds a tuning.'
          note: 'Pino''s own answer: "I played either my ''63 P-Bass tuned down to D or my Moon Larry Graham signature 4-string tuned down to C#. Both had heavy-gauge La Bella flatwounds, which can be rough on necks; that''s originally why I tuned down the Precision."'
          url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
        - kind: user
          caveat: 'two first-hand accounts that disagree, and both are kept because neither is obviously wrong. Pino says a 1963 and Elevado a 1961; Pino is the better witness to his own instrument and Elevado to what was in the room. The tuning matters more than the year: Pino describes the whole bass down a tone and the engineer describes the E string down sometimes, which are different sounds, and the second is the looser claim from the person watching.'
          note: 'Russell Elevado, who engineered the album: "Pino mostly used his favourite bass, which is a 1961 Fender Precision ... He tunes his e string down sometimes as well."'
          url: https://www.talkbass.com/threads/dangelo-voodoo.146620/
      strings: flat
  subject:
    kind: artist
    name: Pino Palladino
    band: D'Angelo
    era: Voodoo
    years:
      from: 2000
      to: 2000
  technique:
    evidence:
      - kind: cited
        caveat: '`fingers` is his own word for it and the lowest string is not one: the E is plucked with his thumb, and on this record that is the string tuned down to D, so it is the one doing most of the work. The interview is 2011 and describes carrying an existing technique forward, so it is close to this era rather than inside it.'
        note: 'Bass Player, April 2011, Chris Jisi, Pino describing the technique he brought from this period: "the fingerstyle technique I developed playing hip-hop on my P-Bass, where I pluck the E string with my thumb, the A with my index finger, the D with my middle finger, and the G with my ring finger, all while muting with my palm."'
        url: https://web.archive.org/web/20110518211048/http://bassplayer.com/article/pino-palladino-steps/April-2011/130905
    attack: fingers
    muting: palm
  words:
    - evidence:
        - kind: cited
          note: '"keeping the volume turned all the way up and the tone all the way down"'
          url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        - kind: audio
          against:
            centroid: 143
          caveat: 'measures the record rather than the player, and all three records are one album cut by one engineer. The margin has been 28Hz, then 3Hz, then nothing, without the recordings changing: a word earned by a comparison is a word the next player measured can take away.'
          measured:
            centroid: 96
          note: |-
            his centroid sits at 96Hz against a middle of 143Hz across the twenty-seven other players measured. It no longer earns the word: against eight others he was clear by 3Hz, and every player added since has sat between him and the middle. The word is kept on the citation above.
            No `spread` here on purpose. That field is the scale a margin is read against, and there is no margin left to read.
      term: dark
    - evidence:
        - kind: user
          caveat: a description of the playing rather than a measurement, from the person who put it on tape. It stood here as a guess off the flatwounds until he was found saying it.
          note: 'Russell Elevado, the album''s engineer, on how Pino played it: "He has an amazing touch and he''ll use his palm to get a ''deader'' sound or just barely pluck it."'
          url: https://www.talkbass.com/threads/dangelo-voodoo.146620/
      term: short-decay
    - evidence:
        - kind: cited
          caveat: strings are not modelled by anything. This term is here for a reader, not for the compiler.
          note: flatwounds named there as a major component of the sound
          url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
      term: quiet-strings
rig:
  chain:
    - role: pitch
      gear: EBS OctaBass
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: The OC-2 is not modelled; this is the EBS OctaBass, the bass octave the device does carry.
          note: The Boss OC-2 under a fretless Stingray is the sound Palladino is known for, and he has a signature Ashdown dual octave pedal built on it.
          url: https://bassbros.co.uk/blog/pino-palladino-gear-deep-dive-session-pro-fretless-icon/
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg B-15
      capture: miked
      confidence: high
      evidence:
        - kind: cited
          note: the Voodoo configuration, "recorded from the amp without using a DI"
          url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
        - kind: cited
          caveat: the one rig here whose records went through a microphone and a cabinet rather than to the desk. Claypool, Dirnt, Geddy and McCartney all went direct in whole or in part, so this chain describes what was recorded more literally than any other.
          note: 'Pino, asked what he used to record: "I plugged into a miked Ampeg B-15, and I''m pretty sure that was the only signal we took."'
          url: https://www.guitarworld.com/artists/bassists/pino-palladino-dangelo-voodoo
        - kind: user
          caveat: 'first-hand from the engineer and second-hand to us: the gearslutz link in the post is dead, so what was read is the transcription. Three amplifiers were in use and this chain names one. "No di''s whatsoever" is the line that makes this the only rig here whose cabinet is genuinely in the signal.'
          note: 'Russell Elevado, who engineered the album, in a Q&A quoted by the poster rochishin: "for amps we used an Ampeg B15, B18 and an old solid state amp in a big cabinet that''s at electric lady ... mics were fet47 ... and usually a pre or focusrite isa115 ... everything went to tape and no di''s whatsoever on the album."'
          url: https://www.talkbass.com/threads/dangelo-voodoo.146620/
    - role: cab
      gear: Ampeg B-15
      capture: miked
      confidence: high
      evidence:
        - kind: cited
          note: the B-15 is a combo, so the cabinet is the amplifier
          url: https://mixdownmag.com.au/features/rig-rundown-pino-palladino/
