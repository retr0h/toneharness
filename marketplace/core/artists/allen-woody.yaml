# Allen Woody — Gov't Mule
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# No cabinet named, so the amp's own pairing is used, which is the Ampeg
# 8x10 an SVT head is ordinarily stacked on. He named SVTs and no cabinet,
# and he was a collector who ran several at once, so claiming one would be
# inventing it.

