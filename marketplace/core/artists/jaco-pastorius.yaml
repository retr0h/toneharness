# Jaco Pastorius — Weather Report
#
# The ask: who he is, how he played, and what he played, and under `rig:`
# the gear that resolves to. The two were separate files until version 2
# of the contract and this line still said so.
#
# **His fuzz was a channel on the amplifier rather than a pedal**, which the
# amp entry below cites and this device models. So this chain is complete
# without an effect in it. Round four of task 241.
schema: ToneSpec
version: 4.0.0
id: jaco-pastorius
ask:
  confidence: medium
  aliases:
    - jaco
    - pastorius
  genre:
    - jazz fusion
  instrument: bass
  played:
    - gear: Fender Jazz Bass, fretless
      evidence:
        - kind: cited
          caveat: 'he names the brand and not the type, and in 1978 Rotosound also sold the Jazz Bass 77 flatwound and the Tru Bass 88 nylon tapewound, which their own history confirms. `round` is therefore inferred twice over: the argument he makes is about brightness and harmonic content, which is a roundwound argument, and the fingerboard is epoxied, which is what roundwounds on a bare fretless board make necessary. No gauge: the set everybody names comes from present-day aggregators.'
          note: '"Portrait of Jaco", Steve Rosen, 1978, on his estate''s own site, in the middle of this rig''s years. Asked what strings he uses: "Rotosounds." And why: "To me Rotosound has what no other string has and that''s pure harmonics and the closest to playing harmonics in tune."'
          url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
      strings: round
  subject:
    kind: artist
    name: Jaco Pastorius
    band: Weather Report
    era: Weather Report through Word of Mouth
    years:
      from: 1976
      to: 1981
  technique:
    evidence:
      - kind: cited
        caveat: '`muting` says palm because this format has no word for muting with the fingers that are not picking, which is what he describes. The effect on the sound is the same and the hand is not.'
        note: '1978, his own account of his right hand: "I never practiced with my right hand at all. It just naturally goes. I use my first two fingers to pick and I use the other two fingers to mute as well as my thumb if I''m jumping around. The hardest thing to do is just to get the strings I''m not playing to shut up."'
        url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
      - kind: user
        caveat: from the comments rather than the article, and the position is all it supports.
        note: playing over the bridge pickup
        url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
    attack: fingers
    muting: palm
    position: bridge
  words:
    - evidence:
        - kind: user
          caveat: from the comments on that page rather than the article
          note: fingers over the bridge pickup
          url: https://ebass.bestbassgear.com/article/jaco-pastorius.html
      term: bridge-forward
    - evidence:
        - kind: cited
          caveat: an argument for harmonic content rather than the word itself. What earns the word is the measurement below.
          note: '1978, on why he uses the strings he does: "To me Rotosound has what no other string has and that''s pure harmonics and the closest to playing harmonics in tune."'
          url: https://jacopastorius.com/features-2/interviews/portrait-of-jaco/
        - kind: audio
          against:
            centroid: 138
          caveat: measures the record rather than the player, and a fretless played near the bridge is bright before any amplifier touches it.
          measured:
            centroid: 259
          note: 'his centroid across Continuum, Barbary Coast, Teen Town and Three Views of a Secret, against a middle of 138Hz across the twenty-seven other players measured, clear by 36Hz. That is 79% of the width of their middle half, which is what makes it a word rather than a rounding: it is the widest centroid margin in the corpus and the only one here that has survived every correction to it.'
          spread:
            centroid: 45
      term: bright
    - evidence:
        - kind: audio
          against:
            mid: 0.05
          caveat: 'measures the record rather than the player: a fretless singing near the top of its range puts energy where a rock bass does not.'
          measured:
            mid: 0.39
          note: 39% of his energy sits in the mid band against a middle of 5% across the sixteen players measured, clear by 8% and the widest gap any player has on any axis here. Nobody wrote this word down before the records were measured.
      term: mid-forward
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Acoustic 360
      capture: both
      confidence: medium
      evidence:
        - kind: cited
          note: 'Michael John Simmons, "Catch of the Day: Circa 1969 Acoustic 360/361 Bass Amplifier", Fretboard Journal, November 2013, on what the head itself carries: "the usual volume, bass and treble controls along with a built-in fuzz tone and a 5-position Variamp section that allows you to adjust set frequencies." The same piece names him among its users, having "made it his amp of choice". **So the fuzz he is known for is a channel on this amplifier rather than a pedal**, and this device models it: the Woody Blue carries Drive and a five-position Variamp. Nothing has to be added to the chain for it, and nothing turns it on either, because no source puts it on any of the four records measured here.'
          url: https://www.fretboardjournal.com/columns/catch-day-circa-1969-acoustic-360361-bass-amplifier/
        - kind: cited
          note: the 360-361PP, described there as an 18 inch inverted speaker cabinet he converted to after a borrowed one on a gig
          url: https://mixdownmag.com.au/features/rig-rundown-jaco-pastorius/
        - kind: cited
          caveat: 'the cabinet is half of what the records carry rather than none of it, which is the opposite of what this file used to say. It stood on a comments section claiming he went to the board with no preamp, against an article on the same page saying otherwise. Expect that claim back: a TalkBass thread on his tone has it stated flatly, "That ''Jaco tone'' was his bass straight into the mixing board ... Acoustic 360 amps have NOTHING to do with it", by somebody with no access to the sessions. He is on record above saying both.'
          note: 'Tony Bacon interviewing him in London in 1976, the first year this rig covers, asked about amps: "I use an Acoustic 360. I''ve been using that about eight years, since they first had them. When I record, I have a line going direct and I have a microphone to the amp, so we get a little bit of both, the highs and lows. It''s just like having two mics on a piano." Asked about the stage sound: "it''s the same exact sound as I get in the studio."'
          url: https://reverb.com/news/jaco-pastorius-on-how-he-learned-bass-and-composition-bacons-archive
    - role: cab
      gear: Acoustic 361
      capture: both
      confidence: medium
      substitute:
        gear: Acoustic 360
        confidence: medium
        evidence:
          - kind: llm
            note: the device carries a 1x18 named for the 360 rather than the 361 it was sold with. The same box, as far as anything here knows.
      evidence:
        - kind: cited
          note: the 1x18 folded horn the 360 was sold with
          url: https://mixdownmag.com.au/features/rig-rundown-jaco-pastorius/
    - role: eq
      gear: Simple EQ
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
