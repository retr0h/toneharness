# Klaus Flouride — Dead Kennedys
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# The amplifier here is a model's assertion and nobody has confirmed it. See the
# caveat on the chain entry for what was searched and where it ran out.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
id: klaus-flouride

ask:
  aliases: [flouride, dead-kennedys, dks]

  subject:
    kind: artist
    name: Klaus Flouride
    band: Dead Kennedys
    era: Fresh Fruit for Rotting Vegetables
    years: { from: 1980, to: 1980 }

  instrument: bass

  genre: [punk]

  # The instrument is the one claim here with a source behind it.
  played:
    - gear: Fender Jazz Bass
      evidence:
        - kind: cited
          url: https://dyingscene.com/archive/ds-exclusive-klaus-flouride-on-2015-era-dead-kennedys-losing-his-iconic-j-bass-and-taylor-swift/
          note: >-
            Flouride's own words to Jay Stone, Dying Scene, 2015, about the Jazz
            Bass he played for decades and lost in transit: "Yeah, it's somewhere
            in Brazil still, I'm guessing. And very probably in this Quonset hut
            storage space with TAM Airlines." He describes the replica built from
            photographs: "he's got the chips on it, he's done it mostly from
            photos. He wound the pickups himself. The thing actually sounds and
            plays better than the original one did."
          caveat: >-
            he is talking in 2015 about the instrument he had played since the
            early days, and does not date it to these sessions. It establishes
            the Jazz Bass as his instrument, not that it was the one on this
            record.

  # No `words`. Nothing read describes this record in terms the vocabulary
  # carries.

  confidence: low

rig:
  instrument: bass

  # The signal path, in order.
  chain:
    - role: amp
      gear: Acoustic 150B
      capture: direct
      substitute:
        gear: Acoustic 360
        evidence:
          - kind: llm
            note: >-
              the same manufacturer, and the only one of theirs this device
              models. The Acoustic 360 is their folded-horn preamp and the 150B a
              later head, so this keeps the brand where it cannot keep the model.
            caveat: >-
              a substitute for a claim that is itself unconfirmed, so it is a
              guess resting on a guess. Both halves want correcting together.
        confidence: low
      evidence:
        - kind: llm
          note: >-
            asserted by a model and confirmed by nobody. The figure repeated
            everywhere is an "Acoustic 150B head and Acoustic 402 cabinet, stock
            speakers", said to run at least through In God We Trust, Inc.
          caveat: >-
            what was searched, and where it ran out. The sentence everybody
            quotes — "according to the man himself, Klaus used an acoustic
            amplifier with stock speakers on Fresh Fruit for Rotting Vegetables"
            — is not an interview. It appears in the TalkBass thread at
            https://www.talkbass.com/threads/dead-kennedys-tone.287737/ in post 8,
            where the poster pjmuck is quoting Wikipedia and says so, then
            immediately doubts his own reading of it: "Now I assume they mean the
            Acoustic (caps) brand name of bass amps… But maybe he did play
            through an acoustic guitar amp???" Wikipedia cites nothing beneath it.

            Nobody in that thread was there. One poster who saw them five or six
            times says "Not sure what amps- likely something borrowed/stole";
            another offers "i read something years ago that said it was a traynor
            monoblock II", which is a different amplifier entirely.

            Two long published interviews were read in full and neither mentions
            an amplifier: Mark Prindle's at
            http://www.markprindle.com/flouride-i.htm, and Jay Stone's for Dying
            Scene cited above. The Vinyl Guide podcast episode 23 is specifically
            about the making of this record and is audio nobody has transcribed
            here.

            If you know what he actually played through, please open a pull
            request.
      confidence: low
