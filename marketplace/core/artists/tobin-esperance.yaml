          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 114
            decay: 0.16
            dynamics: 8.5
            harmonics: 0.23
            high: 0
            lean: 0.92
            low: 0.99
            mid: 0.01
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. Low and High Cut is the closest of the 5 bass equalisers this device models to tobin-esperance, sitting at 114 Hz against 96. Across 3 records from 1 players, tobin-esperance earns scooped, dark, saturated and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because tobin-esperance earns "scooped" against the players who measure otherwise, by 0.0114 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
