      evidence:
        - kind: cited
          caveat: The Malekko is the reissue; this is the Maestro it is built from.
          note: Esperance uses a Malekko B:assmaster, which is a Brassmaster circuit, chosen for keeping the low end while it distorts.
          url: https://equipboard.com/pros/tobin-esperance
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT
      confidence: low
      evidence:
        - kind: cited
          caveat: 'A touring rundown filmed well after the records measured here, which are the 2000 and 2002 albums. The SVT-4 Pro was available from the mid-1990s so it was obtainable for those sessions, but nothing dates it to them: this is his rig, not demonstrably the rig those records were made on. It names no cabinet, so none is claimed below. The SVT-4 Pro is a hybrid with a valve preamp and solid-state output; the model here is the all-valve original.'
          note: 'A Premier Guitar rig rundown: "Following Horton''s reduction motif, Esperance is only bringing out two rackmounted Ampegs amps. His main stage head is a SVT-4 Pro and the backup is a BR5." It also has him on custom Lakland 44-94 four-strings, D''Addario .050-.120 strings, and fingers rather than a pick.'
          url: https://www.premierguitar.com/gear/rig-rundown-papa-roachs-jerry-horton-tobin-esperance
