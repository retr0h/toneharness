    evidence:
    - kind: cited
      note: 'Canadian Musician, June 1979, on the Hemispheres tour: "The low end is
        run through two Ampeg V4-B cabinets with four JBL 140 speakers." Four speakers
        across two cabinets is two apiece, so the article settles the configuration
        from inside itself.'
      url: http://www.2112.net/powerwindows/transcripts/19790600canadianmusician.htm
    - kind: cited
      note: 'Canadian Musician, December 1981, in his own words: "The low-end pickup
        goes through a similar amplification system, then to Ampeg V4B cabinets with
        15\" J8L speakers", the transcription''s typo for JBL.'
      url: http://www.2112.net/powerwindows/transcripts/19811200canadianmusician.htm
    - caveat: an 8x10 stood here on a thread nobody opened, citing footage nobody
        watched. Every period source found says V-4B and none says 8x10.
      kind: cited
      note: 'Guitar Player, June 1980, current tense: "For the low end, I still use
        two Ampeg V-4B speaker cabinets."'
      url: http://www.2112.net/powerwindows/transcripts/19800600guitarplayer.htm
    gear: Ampeg V-4B
    role: cab
    substitute:
      confidence: low
      evidence:
      - kind: llm
        note: the only 2x15 this device carries. Both cabinets were reloaded with
          fifteens that were not the factory ones, JBL 140s here and Electro-Voice
          in the model, which makes the size right and the voicing a guess.
      gear: Mesa/Boogie 2x15
