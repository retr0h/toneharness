# Chris Joannou — Silverchair
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# In core because he names the studio rig himself, on camera, and this device
# models both halves of it. The live rig he describes in the same interview is
# a different chain and is not what this is for: the records are what gets
# measured.

schema: ToneSpec
version: 4.0.0
id: chris-joannou
ask:
  confidence: medium
  aliases:
    - silverchair
  genre:
    - grunge
    - alternative-rock
  instrument: bass
  subject:
    kind: artist
    name: Chris Joannou
    band: Silverchair
    era: Frogstomp to Neon Ballroom
    years:
      from: 1995
      to: 1999
  words: []
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg B-15NF Portaflex
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: |-
            Read from the automatic captions, which mangle model numbers in the usual way: the SVT-2 Pro he names for his live rig arrives as "the SPT" and the B-15s as "be fifteens".

            The interview is 2010 and the records above end in 1999, so the sentence is him looking back. He says "every record" and names no album, so which flip top and which 8x10 on which session is not established, and neither is anything about the desk or the microphone those records went through.
          note: |-
            In his own words, in a gearwire interview filmed on 24 June 2010, about what is on the records rather than what was on stage that year: "the reason why I ended up with the set up I've got now is because on every record I've always used one flip top and an old 8 by 10 and generally that's everything and the only thing overused in the studio". A flip top is the Ampeg B-15 Portaflex, which is what the name describes.

            He opens the same interview naming himself, "hi there my name's Chris I'll play bass in silver chair", and the only other voice in it is the interviewer asking him questions.
          url: https://www.youtube.com/watch?v=b1egYvnHl9c
    - role: cab
      gear: Ampeg SVT 8x10
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: He says "an old 8 by 10" and names no model. Ampeg's 8x10 is the SVT cabinet and that is what this resolves to, which is a reasonable reading of an Ampeg player saying it and still a reading.
          note: 'The same sentence: "on every record I''ve always used one flip top and an old 8 by 10". The cabinet is cited rather than taken from the amplifier''s usual pairing, and it is the half he is most specific about, since he repeats it for the live rig as well: "live is an 8 by 10 powered by an SVT 2 pro".'
          url: https://www.youtube.com/watch?v=b1egYvnHl9c
    - role: eq
      gear: Simple EQ
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
