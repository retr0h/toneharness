      Sag: "0.5"
      Treble: "0.835576923076923"
    evidence:
    - caveat: Written long after the sessions and it names no model variant or serial.
        It is the only source found that ties an amplifier to this record, which is
        why all three records measured are from this one album.
      kind: cited
      note: 'A gear rundown of the record itself: "Araya recorded most of his bass
        parts on Reign In Blood through a massive Ampeg SVT head, paired with a classic
        8x10 fridge cabinet." The same piece has him on a B.C. Rich Wave fitted with
        two P-Bass style single coils for most of the 1980s.'
      url: https://mixdownmag.com.au/features/gear-rundown-slayers-reign-in-blood/
    - caveat: Recorded so the next reader does not re-open it expecting evidence.
        The Marshall rig is real and belongs to a different era than these records.
      kind: user
      note: 'Opened, and it establishes nothing. Every post about the amplifier is
        hedged opinion — "I''m almost certain that it is the Ampegs", "I''d be willing
        to bet that''s what it came from" — and post 113 has him on a later rig entirely:
        "now Tom Araya uses a custom marshall head and custom marshall 8x10''s".'
      url: https://www.talkbass.com/threads/tom-arayas-gear-setup.164746/
    gear: Ampeg SVT
    position: 1
    role: amp
  - attrs:
      '@position': "2"
    confidence: medium
    controls:
