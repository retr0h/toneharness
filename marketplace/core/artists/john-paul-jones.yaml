    - role: eq
      gear: Simple Tilt
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 145
            decay: 0.19
            dynamics: 8.2
            harmonics: 0.11
            high: 0
            lean: 0.96
            low: 0.95
            mid: 0.05
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. Simple Tilt is the closest of the 8 bass equalisers this device models to john-paul-jones, sitting at 124 Hz against 171. Across 3 records from 1 players, john-paul-jones earns mid-forward and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because john-paul-jones earns "mid-forward" against the players who measure otherwise, by 0.0129 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
