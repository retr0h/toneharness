rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Acoustic 360
      confidence: medium
      evidence:
        - kind: cited
          caveat: The provenance is for the stage rig. What a studio take went through is a separate question this does not answer, and all three records measured are studio recordings. The 360 drove a 361 cabinet, a rear-firing 18-inch folded horn, which is the pairing taken below.
          note: 'His own head, sold at auction with provenance: an Acoustic 360 made by Acoustic Control Corporation circa March 1969, serial no. L1009. The lot reads "purchased by John Paul Jones during Led Zeppelin''s spring 1969 USA tour and used on stage with Led Zeppelin between May 1969 and the Earls Court shows in 1975". It is one of the earliest production 360s to leave the factory, the numbering having started at L1000, and the lot notes a 1976 Beat Instrumental feature carrying a ledger of Led Zeppelin''s complete tour equipment which mentions this unit.'
          url: https://www.guitar-auctions.co.uk/sale/149/544/John-Paul-Jones-Led-Zeppelin--Acoustic-360-bass-guitar-head-made-by-Acoustic-Control-Corporation-Los-Angeles-California-circa-March-1969-ser-no-L1009
        - kind: user
          caveat: A forum thread of recollection. It is carried because it brackets the era from the other side, not because it establishes the amplifier.
          note: 'Opened, and it is weaker than it looks. Eleven posts, most of them hedged: "I think for a lot of it it was an Acoustic 360 rig with folded a 18 cabinet". One post is first-hand and contradicts the rest for the earliest tour — chadds, who saw them open for The Who on the first album tour: "JPJ had 4 trapezoid shaped 2x15 Rickenbacker cabs each with a Hiwatt 100 head". That is before the spring 1969 purchase the auction lot dates, so the two agree rather than conflict, and it is the reason no record here predates mid-1969.'
          url: https://www.talkbass.com/threads/john-paul-jones-rig.259308/
    - role: cab
      gear: 1x18" Acoustic 360
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
