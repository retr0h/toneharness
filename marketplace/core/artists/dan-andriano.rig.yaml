# Dan Andriano — Alkaline Trio
#
# A rig names real-world gear, never Line 6 model identifiers.
#
# The ask this rig answers is in dan-andriano.tone.yaml beside it.

schema: RigSpec
version: 2
id: dan-andriano

instrument: bass

chain:
  - role: amp
    gear: Marshall Major
    evidence:
      - kind: cited
        url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
        note: >-
          asked what he had learned about getting the most from his gear, he
          separates the stage from the tape himself: "Live, I play though an
          Orange rig, but the amp I like to record with is a 1971 Marshall
          Major head. It's the best sounding amp I've ever played through." He
          says what it does: "It's a 200-watt head... with bass it sounds
          perfect. It gets pretty gnarly, but it stays smooth. It's almost like
          naturally compressed sound."
        caveat: >-
          he names it as what he records with rather than as what is on this
          record. The interview is dated 30 April 2010 and This Addiction came
          out that February, so the statement is present tense either side of
          it, and the article's own gear box lists the Major among his rig. That
          is as close as anything read here gets, and it is not the same as him
          saying he used it on these three songs.

          The Orange AD-200B in the same box is the live rig by his own
          sentence, so it is not here.
    substitute:
      gear: Ampeg SVT
      evidence:
        - kind: cited
          url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
          note: >-
            the same article's gear box lists his rig as "Orange AD-200B with
            Orange 4x10 cabs; Ampeg SVT; '71 Marshal Major", so the SVT is an
            amplifier he is documented as owning alongside the Major rather
            than one picked for sounding like it.
          caveat: >-
            this is a device limit, not a claim that the two amplifiers sound
            alike. Line 6 model no Marshall Major, and the ones they do model
            are all guitar amps, which this tool will not put in a bass chain.
            Of the bass amplifiers it has, the SVT is the only one he is known
            to have owned.

            He says the Major is what he records with and does not say that of
            the SVT, so this stands in for the recorded sound with something
            from the right rig rather than the right room.
      confidence: low
    confidence: medium
