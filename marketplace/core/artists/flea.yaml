# Flea — Red Hot Chili Peppers
#
# The ask: who he is, how he played, and what he played, and under `rig:`
# the gear that resolves to. The two were separate files until version 2
# of the contract and this line still said so.

schema: ToneSpec
version: 4.0.0
id: flea
ask:
  confidence: medium
  aliases:
    - rhcp
    - michael-balzary
  genre:
    - funk rock
    - alternative rock
  instrument: bass
  played:
    - gear: Fender Jazz Bass, 1961
      evidence:
        - kind: cited
          caveat: two instruments, not one, and he does not say which is on which track. Both are 1961 Jazz Basses, so the field names what they have in common. bassplayer.com is gone and this is its archived copy. See the task on `played` carrying more than one instrument.
          note: 'asked "What basses did you use for this record?" on I''m With You: "Old Fenders. I used my ''61 Jazz and I used another ''61 Jazz that my friend Damien Hirst put butterflies all over."'
          url: https://web.archive.org/web/20170504000530/http://www.bassplayer.com/artists/1171/flea-association/26543
        - kind: cited
          caveat: Fender names The Getaway, the far end of this rig's window, and describes only the Shell Pink bass. The 2011 interview above covers the near end and adds the second one Fender had no reason to mention.
          note: Fender's own text for the signature model, which recreates the bass "he received from a fan and used to record the Red Hot Chili Peppers albums Stadium Arcadium and The Getaway"
          url: https://www.notreble.com/buzz/2016/07/14/fender-unveils-flea-signature-jazz-bass/
        - kind: user
          caveat: first-hand from the tech and second-hand to us, and it is 2006 rather than this rig's years. Nothing found says what was on the Jazz Basses in 2011. It is kept because it is the only evidence about the instrument this rig names, and because "old" flatwounds is not a set somebody changes often.
          note: 'his bass tech, quoted from Bass Guitar Magazine by the poster Nigel: "the strings on his Jazz are ''old GHS flatwounds''". The same interview has him going back to the Modulus for live work because "The Jazz sounded great on stage and in in-ear monitors but got a bit lost in the FOH mix."'
          url: https://www.talkbass.com/threads/so-which-flats-is-flea-playing.269755/
        - kind: user
          caveat: a transcription of a url that is now dead, so it corroborates the tech rather than standing alone. It also has a '61 and a '62 where Flea says two '61s.
          note: 'Bass Player''s gear box for Stadium Arcadium, transcribed by the poster GianGian: "Flea''s Gear Basses ''61 Fender Jazz and ''62 Fender Jazz, both with old flatwounds".'
          url: https://www.talkbass.com/threads/what-songs-on-stadium-arcadium-does-flea-uses-flatwounds-on.457174/
        - kind: cited
          caveat: which is why this field used to say `round`, and it was the wrong instrument. The 2012 rundown documents the Modulus basses he calls tour-only, "For the last ten years that's all I played on tour", and this rig names the Jazz Basses he recorded on. Two instruments, two sets of strings, and the records are the Jazz. The gauge printed there, ".105 - .145", is not a set GHS sells either.
          note: '"Flea uses his signature set of GHS Boomers", a roundwound line'
          url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
      strings: flat
    - gear: Fender Jazz Bass, 1961, painted by Damien Hirst
      evidence:
        - kind: cited
          caveat: no `records`, because he never says which bass took which track. Two instruments of the same year and model, so no figure here can be told apart by them and nothing pretends otherwise. Not the spin-art Flea Bass from the "Rain Dance Maggie" video, which is a different instrument and a performance rather than a session. The strings are the pair's, from the tech quoted above.
          note: 'the second of the two he names for this record: "I used another ''61 Jazz that my friend Damien Hirst put butterflies all over. One day he asked me, ''What''s the best bass ever made?'' I said, ''Well, the ''61 Fender Jazz Bass.''"'
          url: https://web.archive.org/web/20170504000530/http://www.bassplayer.com/artists/1171/flea-association/26543
      strings: flat
  subject:
    kind: artist
    name: Flea
    band: Red Hot Chili Peppers
    era: I'm With You through The Getaway
    years:
      from: 2011
      to: 2016
  technique:
    evidence:
      - kind: cited
        caveat: he plays fingerstyle at least as much. A rig names one attack, so this one is the funk material rather than the whole player.
        note: '"MXR Micro Amp used as clean boost for slapping and leads"'
        url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
    attack: slap
  words:
    - evidence:
        - kind: cited
          caveat: 'knob positions rather than a result, which is the confusion this field exists to avoid: where the treble control sits says nothing about where the record lands.'
          note: '"he keeps his knobs taped at his preferred settings (bass almost full up, treble rolled off)"'
          url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        - kind: audio
          against:
            centroid: 134
          caveat: the word is kept because a citation outranks a measurement here, and three records of one player are not his whole catalogue.
          measured:
            centroid: 134
          note: his three records from this rig's own years measure a centroid of 134Hz against a middle of 134Hz across the sixteen players measured. That is the middle of the corpus rather than the dark end of it, and not clear of anything, so the word is not earned. It read third darkest of nine before seven more players were measured. Reproduce with `go run main.go measure --corpus resources/music/bass`.
      term: dark
rig:
  chain:
    - role: filter
      gear: Musitronics Mu-Tron III
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: His board also holds a Boss OC-2, an MXR M-80 and a Cry Baby bass wah. The Brassmaster that stood here is kept as the drive.
          note: Flea played a Mu-Tron through the nineties — Sir Psycho Sexy is one with a dying battery — and moved to an EHX Q-Tron later. The Mu-Tron is the one the device models.
          url: https://www.gear4music.com/blog/steal-the-sound-flea-red-hot-chili-peppers/
      enabled: false
    - role: drive
      gear: Maestro Bass Brassmaster
      capture: direct
      confidence: low
      evidence:
        - kind: cited
          caveat: |-
            a tour rig and not a studio one, which is why this arrives bypassed. The rundown films the stage at the Allstate Arena and nothing in it puts a pedal on a take: the corpus measures Brendan's Death Song, The Adventures of Rain Dance Maggie and Dark Necessities for him, and no source names an effect on any of the three.
            The pedal named is a Malekko B:assmaster and this device models none. It asks for the Maestro Bass Brassmaster instead, which is what the Malekko is a clone of rather than a pedal chosen for sounding like it: Malekko's own sellers call it "a hand-built clone of the Maestro Bass Brassmaster harmonic octave fuzz".
            Two more pedals on that board are left out. An MXR Micro Amp is a clean boost "for slapping and leads" and this device models no Micro Amp, so naming one of its 61 drives would be a guess. An Electro-Harmonix Q-Tron is named for one song, "Sir Psycho Sexy", which is from 1991 and is not in this era at all.
          note: 'Premier Guitar''s own Rig Rundown, filmed on the I''m With You Tour and dated 3 June 2012, which is inside the era this rig claims. Left to right across his board: "a Malekko Bassmaster for fuzz and distortion, MXR Micro Amp used as clean boost for slapping and leads, Electro-Harmonix Q-Tron used for \"Sir Psycho Sexy,\" and a Moog Mooferfooger 12-Stage Phaser used just for fun."'
          url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
      enabled: false
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Gallien-Krueger 2001RB
      confidence: medium
      substitute:
        gear: Gallien-Krueger 800RB
        confidence: low
        evidence:
          - kind: llm
            note: the 800RB is the only Gallien-Krueger this device models. Same maker, a different head, and nobody has compared them.
      evidence:
        - kind: cited
          note: '"Flea uses three Gallien-Krueger 2001RB amps, one controls the other two as slaves"'
          url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
        - kind: cited
          caveat: only the headline was readable. The body did not come back.
          note: headlined as him switching to Ampeg from Gallien-Krueger for Unlimited Love, which dates this rig to before that
          url: https://www.guitarworld.com/news/flea-red-hot-chili-peppers-unlimited-love-new-bass-amp-setup
      stage: true
    - role: cab
      gear: Gallien-Krueger 410
      confidence: medium
      substitute:
        gear: Ampeg SVT 410HLF
        confidence: low
        evidence:
          - kind: llm
            note: nothing here models a Gallien-Krueger cabinet. A 4x10 for a 4x10, which is a guess about size rather than about voicing.
      evidence:
        - kind: cited
          note: three 410 cabinets and three 115s in the 2012 rundown
          url: https://www.premierguitar.com/rig-rundown-red-hot-chili-peppers-flea
      stage: true
  instrument: bass
