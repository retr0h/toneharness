          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 95
            decay: 0.29
            dynamics: 4.6
            harmonics: 0.09
            high: 0
            lean: 0.97
            low: 1
            mid: 0
            transient: 0.71
          note: Chosen by measurement rather than by anybody's say-so. MXR 10-Band Graphic EQ is the closest of the 8 bass equalisers this device models to paul-simonon, sitting at 124 Hz against 118. Across 3 records from 1 players, paul-simonon earns dark, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because paul-simonon earns "dark" against the players who measure otherwise, by 10.5 of centroid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
