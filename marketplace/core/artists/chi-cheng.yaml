    evidence:
    - caveat: 'It covers his whole tenure rather than one record, and it names no
        cabinet, so no cabinet is claimed below. The SVT-2 Pro is the valve SVT reissue
        generation, so the model here is the same amplifier a generation earlier.
        The SansAmp is omitted: it is a preamp pedal used for gain and nothing establishes
        a setting for it.'
      kind: cited
      note: 'Premier Guitar''s remembrance of him, which states the rig in one sentence:
        "Cheng held the fort down with 4-string Fender P basses played with his fingers—occasionally
        using fretless models on White Pony—through Ampeg SVT-2 Pro heads and really
        only used a Tech 21 SansAmp GT2 for extra balls."'
