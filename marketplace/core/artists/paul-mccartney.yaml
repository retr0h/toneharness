# Paul McCartney — Wings
#
# The ask: who he is, how he played, and what he played. The gear this
# resolves to is in paul-mccartney.yaml beside it.
ask:
  aliases:
  - macca
  - mccartney
  confidence: low
  genre:
  - rock
  instrument: bass
  played:
  - evidence:
    - caveat: the post is signed "Mark". The interview below is what makes him Arnquist,
        on the zero fret and the nameplate holes he describes in both.
      kind: user
      note: 'Mark Arnquist, 11 August 2000: "When I worked on his bass in the mid
        1970''s he did NOT have rotosound strings of any kind on it. They were flats
        but not rickenbacker or roto''s. I have no idea what they were." First-hand,
        on this instrument, immediately before the tour that produced the live album
        measured for this rig. The brand is nobody''s to name: the man who restrung
        it does not know it.'
      url: https://www.rickresource.com/forum/viewtopic.php?t=13
    - caveat: the resistance figures people quote with this, a 7k neck and a 9k bridge,
        are not on this page. They come from a forum post relaying a phone call. The
        page gives no numbers and makes no claim about tone. This is also the touring
        instrument rather than the studio one.
      kind: cited
      note: 'Mark Arnquist, Rickenbacker''s lead man in finishing and repair "from
        July 1972 to October 1976", to John F. Crowley: "The P.M. bass came back to
        the factory prior to the ''Wings over America tour.''" The horseshoe magnets
        were dead, so "we opted for a custom coil/pickup for ''The Man.'' The idea
        was to overwind a stock coil for a 4001." It went back out "restrung with
        the strings that it came in with", which is what makes his account of them
        first-hand.'
      url: http://www.thecanteen.com/arnquist.html
    gear: Rickenbacker 4001S
    strings: flat
  subject:
    band: Wings
    era: mid to late seventies touring
    kind: artist
    name: Paul McCartney
    years:
      from: 1975
      to: 1979
  technique:
    attack: pick
    evidence:
    - caveat: 'Juber joined in 1978, so he is first-hand for Goodnight Tonight and
        not for the two earlier records here; Jisi extrapolates back to Silly Love
        Songs. `position` is gone rather than guessed: the same Wings-era discussion
        has him heard as bridge pickup soloed and seen with the selector in the middle,
        which is about pickups and says nothing about where his right hand sat.'
      kind: cited
      note: 'Chris Jisi, Guitar World, quoting Laurence Juber, who played guitar in
        Wings from 1978: "Juber confirmed that Paul played his flatwound-strung Rickenbacker
        4001S with a heavy-gauge pick". Juber on the difference the rig has to cover:
        "Paul plays with a very hard touch onstage, but he has a real sensitivity
        to dynamics and note duration in the studio."'
      url: https://www.guitarworld.com/artists/bassists/paul-mccartney-wings-silly-love-songs
  words:
  - evidence:
    - caveat: an enthusiast in 2014 describing a record by ear, which is the weakest
        thing this word rests on. It agrees with the measurement below and that is
        the whole of its value.
      kind: user
      note: '"I''ve also been obsessed with that middley mid, cut through the mix
        flatwound tone of the live Wings Rockshow/Wings Over America album", and "that
        cut through the mix, but in a not bright way".'
      url: https://www.rickresource.com/forum/viewtopic.php?t=411797
    - against:
        mid: 0.05
      caveat: the three records measured before these were Beatles takes from 1966
        and 1969, a decade before the rig this describes, and they read 0%. Measuring
        the era the rig claims is what moved this figure.
      kind: audio
      measured:
        mid: 0.15
      note: 15% of his energy sits in the mid band across Silly Love Songs, With a
        Little Luck and Goodnight Tonight, against a middle of 5% across the sixteen
        players measured. Above the middle, not clear of it, so the word is not earned
        and the records point the way the citations do.
    term: mid-forward
