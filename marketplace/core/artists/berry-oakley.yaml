    evidence:
    - caveat: |-
        both hedge on the model and neither was in a studio. Two people recalling a big Fender valve head with folded horns is worth more than one, and it is still a memory of a stage rather than a document.
        This record is live, so what it carries is the room and the PA as well as the rig, which is the one case where a stage account and the recording describe the same evening.
      kind: user
      note: |-
        two people who saw him play, in the same thread. The poster jerry: "I saw Berry more than a few time before he died… I do remember he used one of those early 70's big Fender bass amps, but the model number escapes me. It had a big folded horn cab, sounded great!", then "It might have been the Fender 400PS bass amp.....435 tube watts into a couple folded horn cabs."
        MrBEAR, who saw them three times, dates the changes: "FIrst time I saw them he was using Marshalls, second time the Fender PS 300/400?, and the last time it was a combination of Sunn and Kustom Kasinos."
      url: https://www.talkbass.com/threads/berry-oakleys-rig.222796/
    gear: Fender 400 PS
    role: amp
    substitute:
      confidence: low
      evidence:
      - caveat: asserted by a model and confirmed by nobody. Same decade, same class
          and a different circuit. If you know a nearer match in this catalog, please
          open a pull request.
        kind: llm
        note: era and class. The 400 PS is a 435-watt valve head of the early seventies
          and the SVT is a 300-watt valve head of the same years, which makes it the
          nearest thing this device models. The Fender amplifiers it does carry are
          tweed-era guitar heads of a tenth the power.
      gear: Ampeg SVT
  - capture: direct
    confidence: low
    controls:
      Distance: "1.5"
      EarlyReflections: "0.0"
      HighCut: "20100.0"
      Level: "0.0"
      LowCut: "19.9"
    evidence:
    - caveat: the same source as the head, so the two share it and stand or fall together.
      kind: user
      note: the same two posts as the head, which name folded horns with the Fender
        and Sunn cabinets later.
      url: https://www.talkbass.com/threads/berry-oakleys-rig.222796/
    gear: Sunn folded horn
    role: cab
    substitute:
      confidence: low
      evidence:
      - caveat: asserted by a model. A single eighteen is not "a couple of folded
          horn cabs", and which Sunn is not established.
        kind: llm
        note: the device models one folded-horn cabinet of this make, a 1x18 Sunn
          Coliseum, and folded horn is the shape both accounts name.
      gear: Sunn Coliseum 1x18
