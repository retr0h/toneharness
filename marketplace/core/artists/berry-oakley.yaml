ask:
  aliases:
  - oakley
  - allman-brothers
  - allmans
  confidence: low
  genre:
  - southern-rock
  instrument: bass
  played:
  - evidence:
    - caveat: 'a named person with first-hand access, which is what makes a forum
        post evidence here: the instrument was left to him. The Guild Starfire pickup
        in the neck position is not a Jazz Bass sound and this device models no instrument,
        so what it changes is how the recording should be read rather than anything
        the build can set.'
      kind: user
      note: |-
        the "Tractor", and the poster OakBass is Berry Oakley's son, who owns it. He corrects the thread's standing claim about the pickup: "WOW!!! alot of storys around this bass of my dads.. first off IT'S NOT A HAGSTRUM PICKUP,, It's from his white Guild starfire bass.. The starfire was cut up for parts by Joe Dan and BO for the TRACTOR'S… the J pickup is BETWEEN the bridge and bridge pickup, part of what gives it that special sound. Bridge pickup was not moved!"
        The same post reproduces Fender's own write-up of cloning it, which ties it to this record: "Berry Oakley's 'Tractor Bass' will forever be immortalized… on classic recordings like the Allman Brothers' Live at the Fillmore East."
      url: https://www.talkbass.com/threads/berry-oakleys-the-tractor.440045/
    gear: Fender Jazz Bass
    strings: round
  subject:
    band: The Allman Brothers Band
    era: At Fillmore East
    kind: artist
    name: Berry Oakley
    years:
      from: 1971
      to: 1971
  technique:
    attack: pick
    evidence:
    - caveat: '"frequently" rather than always, and the article ties it to no particular
        record.'
      kind: cited
      note: 'Ryan Madora, No Treble, 23 June 2017: "he frequently played with a pick
        and used a Fender Jazz with a Guild pickup (affectionately known as the ''Tractor''
        bass)."'
      url: https://www.notreble.com/buzz/2017/06/23/bass-players-to-know-berry-oakley/
