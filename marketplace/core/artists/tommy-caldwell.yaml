        what was searched, and where it ran out. Two TalkBass threads about him, Vintage Guitar's Marshall Tucker Band feature and their Fretprints piece on his brother Toy were all read, and every one of them is about the basses, the strings and the thumb. Not one names an amplifier.
        So this is a guess from the era and the size of the band, which is the weakest reason this project accepts for anything. The instrument and the technique above are what the figures should be read against until somebody fills this in. If you know what he played through, please open a pull request.
      kind: llm
      note: asserted by a model and confirmed by nobody. A big valve head is what
