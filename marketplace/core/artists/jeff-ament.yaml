    - role: eq
      gear: Simple Tilt
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: A player measured off their own finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used.
          measured:
            centroid: 111
            decay: 0.57
            dynamics: 9.9
            harmonics: 0.1
            high: 0
            lean: 0.82
            low: 0.99
            mid: 0.01
            transient: 0.69
          note: Chosen by measurement rather than by anybody's say-so. Simple Tilt is the closest of the 8 bass equalisers this device models to jeff-ament, sitting at 124 Hz against 134. Across 3 records from 1 players, jeff-ament earns scooped and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because jeff-ament earns "scooped" against the players who measure otherwise, by 0.0163 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.
