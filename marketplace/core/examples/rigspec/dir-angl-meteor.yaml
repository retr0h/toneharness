# A rig read off a device rather than written by hand.
#
# Lifted by `presets show` from a preset an HX Stomp wrote, and committed as it
# came out.
#
# The portable half, and only that: the gear in signal order, named the way a
# musician names it. Which model each piece resolved to, where it sat and what
# its knobs were set to are in marketplace/core/examples/plan/dir-angl-meteor.yaml, and the two
# together are the preset.

chain:
- gear: Arbiter Cry Baby
  role: wah
- gear: Ibanez® TS808 Tube Screamer®
  role: drive
- gear: ENGL® Fireball 100
  role: amp
- gear: Mono, Stereo Line 6 Original
  role: utility
- gear: Legacy 4x12" ENGL XXL V30
  role: cab
- gear: Legacy 4x12" ENGL XXL V30
  role: cab
- gear: Simple Delay
  role: delay
- gear: Room
  role: reverb
id: dir-angl-meteor
instrument: guitar
schema: RigSpec
version: 2
