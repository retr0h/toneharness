# A request in nothing but words, which is how most people would write one.
#
# No player, no record, no era. A genre, how it is played, how it should sound,
# and one piece of gear. Build it with:
#
#     toneharness tone build --ask marketplace/core/examples/tonespec/chunky-punk.yaml \
#       --out rig.yaml
#     toneharness presets compile --rig rig.yaml --out punk.hlx
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec

# Where the controls start, and it is measured rather than assumed. The corpus
# reads punk across 15 records from 5 players and says `clean`, so a request
# that names the genre and nothing else is already aimed somewhere. Run
# `toneharness corpus music genres` for which genres have enough records to
# mean anything: eight from three players is the bar.
genre: [punk]

instrument: bass

# How it is played, which no device models and every figure carries.
#
# A pick puts high-frequency attack into every note that fingers do not, so
# this is not decoration: it is the difference the answer compensates for.
# `attack` takes pick, fingers, slap, thumb or hybrid; `position` takes bridge,
# middle or neck; `muting` takes none or palm.
technique:
  attack: pick
  position: bridge
  muting: palm

# How it should sound, in the words a person would use. Describe the result,
# never the control: `mid-forward`, not "raise the mids".
#
# Each word moves one control one step from wherever the genre left it, and
# `pkg/sdk/internal/compile/data/words.json` is the vocabulary itself: ten axes
# and 25 terms, of which six axes reach a control and four describe the player.
#
# Nobody has to know these. You say "make it chunky punk" to an agent and the
# skill points it at words.json, which is the vocabulary itself; the three terms
# below are what it translates that into, and each one moves a control.
#
# A word outside the 25 is not refused, because refusing an ask over a word
# would make the format hostile to the person writing it. It is reported:
#
#     could not  chunky  no control is moved by that word, so nothing aimed at it
#
# So `chunky` costs nothing and does nothing, which is why the translation
# happens before the file is written rather than after.
#
# `grit-on-attack` answers the same axis as the `clean` that punk measures as,
# and a word written here outranks a word a population earned, so the build says
# which one stood aside:
#
#     says clean  a genre measured this, and you said grit-on-attack, so yours stands
words:
  - term: mid-forward
  - term: grit-on-attack
  - term: tight-low-end

# Gear the request names, where somebody wants a particular thing rather than a
# particular sound.
#
# Required here in practice, and this is the one thing about the format that is
# not obvious: words cannot start a chain. An ask carrying only a genre and
# adjectives is refused with "nothing in the request names gear, and nothing in
# it can be measured against". Name gear, or name a recording to measure with
# `like: { recording: take.wav }`, and the words adjust what that gives you.
gear:
  - gear: Ampeg SVT
    role: amp

# Nothing here was read anywhere. It is one person's idea of a punk bass sound,
# which is exactly what `low` is for.
confidence: low
