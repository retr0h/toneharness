        - kind: cited
          caveat: Woody's is the only one of the three documented as a plain Ampeg head. The other two reached the same territory by other routes.
          note: Allen Woody's amp of choice was the Ampeg SVT-810AV, and he is one of the three players blues rock is measured from. Dusty Hill ran a power amp and preamp rather than a head, and John Paul Jones an Acoustic 360, so the Ampeg is the ground the three share rather than a rig all of them used.
          url: https://equipboard.com/pros/allen-woody
    - role: cab
