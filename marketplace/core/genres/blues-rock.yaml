            low: 0.96
            mid: 0.04
            transient: 0.72
          note: Chosen by measurement rather than by anybody's say-so. Electro-Harmonix Big Muff Pi is the closest of the 52 bass drives this device models to blues-rock, sitting at 183 Hz against 165. Across 9 records from 3 players, blues-rock earns mid-forward and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
