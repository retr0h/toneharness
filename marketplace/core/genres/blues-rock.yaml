    - role: eq
      gear: Simple Tilt
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players.'
          measured:
            centroid: 138
            decay: 0.24
            dynamics: 6.9
            harmonics: 0.11
            high: 0
            lean: 0.88
            low: 0.96
            mid: 0.04
            transient: 0.72
          note: 'Not chosen by measurement. None of the 8 bass equalisers this device models is measurably nearer blues-rock than the others, so Simple Tilt is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 9 records from 3 players, blues-rock earns mid-forward and short-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because blues-rock earns "mid-forward" against the players who measure otherwise, by 0.0129 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
      controls:
        CenterFreq: "1000.0"
        Level: "0.0"
        Tilt: "0.25"
      attrs:
