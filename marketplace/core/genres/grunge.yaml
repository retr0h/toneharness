# Grunge — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched, then resolved, and reproducible on the same
# corpus. `tone build` took the amplifier and the cabinet most of grunge's
# documented players used, aimed their controls at the edge of grunge's own
# measured range rather than its middle, and put a drive and an equaliser
# behind a footswitch, switched off, set from their sweeps.
#
# The rule and the measurements behind it are in build-a-rig's measuring.md.
# The short of it: the middle of a genre is what every genre shares, so aiming
# there gave nine of these eleven the same amplifier.
#
#
# The gear is researched rather than measured, since 2026-10-25. What stood
# here before was chosen by fingerprint and said so: `confidence: low`, and a
# note reading "not one anybody is known to have used". The players a genre is
# measured from are recorded, and so is their gear, so this names what they are
# documented using and cites it.
#
# A drive only where one of those players is documented with one. The corpus
# still offers a bypassed drive on a footswitch, which is an offer rather than
# a claim.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
version: 4.0.0
id: grunge
ask:
  confidence: low
  aliases:
    - grunge-sound
  genre:
    - grunge
  instrument: bass
  subject:
    kind: genre
    name: Grunge
  words: []
rig:
  chain:
    - role: drive
      gear: Pro Co RAT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: Novoselic's, not the genre's. Ben Shepherd, Jeff Ament, Chris Joannou and Mike Starr are not documented reaching for it.
          note: The one drive any of grunge's five players is documented with, and it is the pedal in Krist Novoselic's own rig in this collection, named by his technician.
          url: https://equipboard.com/pros/krist-novoselic
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: Novoselic used Ampeg SVT-400T and SVT-II heads, and cut Nevermind on an SVT-400T. Ben Shepherd ran Ampeg SVT and Mesa heads in the studio alongside a B-15. The Aguilar Tone Hammer that stood here before is used by none of them.
          url: https://equipboard.com/pros/krist-novoselic
    - role: cab
      gear: Mesa/Boogie 2x15
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: Nevermind was cut through a 2x15, and the Nevermind tour ran Mesa RR 2x15 cabinets. This one was already right.
          url: https://equipboard.com/pros/krist-novoselic
  instrument: bass
