# Punk — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched, then resolved: `tone build` ranked the device's
# bass amplifiers against what punk measures as and took the nearest, and
# `rigs resolve` wrote every control that came out. Both are reproducible on the
# same corpus.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
version: 4.0.0
id: punk
ask:
  confidence: low
  aliases:
    - punk-sound
  genre:
    - punk
  instrument: bass
  subject:
    kind: genre
    name: Punk
  words: []
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT (bright channel)
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.'
          measured:
            centroid: 174
            decay: 0.4
            dynamics: 6.1
            harmonics: 0.18
            high: 0
            lean: 0.88
            low: 0.88
            mid: 0.11
            transient: 0.74
          note: Chosen by measurement rather than by anybody's say-so. Ampeg SVT (bright channel) is the closest of the 27 bass amplifiers this device models to punk, sitting at 189 Hz against 203. Across 21 records from 7 players, punk earns mid-forward, bright and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at.
    - role: cab
      gear: 8x10 Ampeg SVT-810AV
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
  instrument: bass
