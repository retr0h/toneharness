        Bias: "0.74"
        BiasX: "0.5"
        ChVol: "0.8"
        Drive: "0.6"
        Hum: "0.5"
        Master: "1.0"
        Mid: "0.975"
        MidFreq: "0"
        Ripple: "0.5"
        Sag: "0.5"
        Treble: "0.88"
      attrs:
        '@position': "2"
      position: 2
    - role: cab
      gear: 8x10" Ampeg SVT-810AV
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: The Ampeg 8x10 under every one of those rigs.
          url: https://equipboard.com/pros/dee-dee-ramone
      controls:
        Angle: "0.0"
        Distance: "1.0"
        HighCut: "4000.0"
        Level: "0.0"
        LowCut: "19.9"
        Mic: "0"
        Position: "0.39"
      attrs:
        '@position': "3"
      position: 3
    - role: eq
      gear: MXR 10-Band Graphic EQ
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players.'
          measured:
            centroid: 174
            decay: 0.4
            dynamics: 6.1
            harmonics: 0.18
            high: 0
            lean: 0.88
            low: 0.88
            mid: 0.11
            transient: 0.74
          note: 'Not chosen by measurement. None of the 8 bass equalisers this device models is measurably nearer punk than the others, so MXR 10-Band Graphic EQ is the first of them rather than a choice. The model is arbitrary and the controls on it are not: those are set from its own sweep. Across 21 records from 7 players, punk earns mid-forward, bright and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument''s presets sit at. It is here because punk earns "mid-forward" against the players who measure otherwise, by 0.0968 of mid, and that is the figure a pedalboard answers with a eq. It arrives switched off.'
      controls:
        125Hz: "0.0"
        16kHz: "0.0"
        1kHz: "11.25"
        250Hz: "11.25"
        2kHz: "0.0"
        31p25Hz: "-11.25"
