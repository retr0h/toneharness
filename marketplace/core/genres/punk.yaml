# Punk — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched, then resolved, and reproducible on the same
# corpus. `tone build` took the amplifier and the cabinet most of punk's
# documented players used, aimed their controls at the edge of punk's own
# measured range rather than its middle, and put a drive and an equaliser
# behind a footswitch, switched off, set from their sweeps.
#
# The rule and the measurements behind it are in build-a-rig's measuring.md.
# The short of it: the middle of a genre is what every genre shares, so aiming
# there gave nine of these eleven the same amplifier.
#
#
# The gear is researched rather than measured, since 2026-10-25. What stood
# here before was chosen by fingerprint and said so: `confidence: low`, and a
# note reading "not one anybody is known to have used". The players a genre is
# measured from are recorded, and so is their gear, so this names what they are
# documented using and cites it.
#
# A drive only where one of those players is documented with one. The corpus
# still offers a bypassed drive on a footswitch, which is an offer rather than
# a claim.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
version: 4.0.0
id: punk
ask:
  confidence: low
  aliases:
    - punk-sound
  genre:
    - punk
  instrument: bass
  subject:
    kind: genre
    name: Punk
  words: []
rig:
  chain:
    - role: amp
      gear: Ampeg SVT
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          caveat: Freeman recorded the first two Rancid records on an Acoustic 320 and a 4x15 instead, so the SVT is where the group converged rather than what every record was cut on.
          note: Dee Dee Ramone bought three Ampeg SVT heads and three matching 8x10 cabinets, and the Ramones rig was two SVTs into two 8x10s either side of the drum riser. Paul Simonon played an SVT into a fridge cabinet, and Matt Freeman bought an SVT-II Pro into a single 8x10 after asking what was used on Dookie. Three of the seven players punk is measured from, on the same amplifier.
          url: https://www.premierguitar.com/gear/maximum-energy-the-gear-of-the-original-punks
    - role: cab
      gear: 8x10" Ampeg SVT-810AV
      capture: direct
      confidence: medium
      evidence:
        - kind: cited
          note: The Ampeg 8x10 under every one of those rigs.
          url: https://equipboard.com/pros/dee-dee-ramone
  instrument: bass
built:
  catalog: HX Edit 3.82
  device: HX Stomp
