    - role: reverb
      gear: Hot Springs
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: 'A genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. This block is what sits nearest those figures, not one anybody is known to have used. It also moves: a genre is measured against the players who play none of it, so this answer changes when the corpus gains players.'
          measured:
            centroid: 174
            decay: 0.4
            dynamics: 6.1
            harmonics: 0.18
            high: 0
            lean: 0.88
            low: 0.88
            mid: 0.11
            transient: 0.74
          note: Chosen by measurement rather than by anybody's say-so. Hot Springs is the closest of the 14 bass reverbs this device models to punk, sitting at 133 Hz against 282. Across 21 records from 7 players, punk earns mid-forward, bright and long-decay, measured against the players who play none of it, and that is what moves the controls off the medians this instrument's presets sit at. It is here because punk earns "long-decay" against the players who measure otherwise, by 0.07 of decay, and that is the figure a pedalboard answers with a reverb. It arrives switched off.
      controls:
        Drip: "1"
        Dwell: "0.4"
        HighCut: "5000.0"
