# Punk — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched. `tone build` ranked the device's bass amplifiers
# against what punk measures as and took the nearest, which is reproducible: run
# it again on the same corpus and it answers the same way.
#
# Resolved, which is what the `controls` under each chain entry are: every
# control the block has, at the value it is set to. The document says what the
# preset is rather than how to go looking for it, so editing one control here is
# what reaches the pedal. Written by `rigs resolve`.
#
# The compressor carries `kind: corpus` because nothing in the ask named one. A
# chain of this kind almost always holds one and the statistics put it there.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

ask:
  aliases:
  - punk-sound
  confidence: low
  genre:
  - punk
  instrument: bass
  subject:
    kind: genre
    name: Punk
  words:
  - term: mid-forward
  - term: bright
id: punk
rig:
  chain:
  - controls:
      Attack: "0.035"
      Knee: "6.0"
      Level: "5.2"
      Mix: "1.0"
      Ratio: "3"
      Release: "0.2"
      Threshold: "-37.1"
    evidence:
    - kind: corpus
      note: 'added by the compiler rather than named in the rig: a chain of this kind
        almost always holds one, and the corpus statistics are what put it here.'
    gear: Deluxe Comp
    role: comp
  - capture: direct
    confidence: low
    controls:
      Bass: "0.41"
      Bias: "0.74"
      BiasX: "0.5"
      ChVol: "0.8"
      Drive: "0.6"
      Hum: "0.5"
      Master: "1.0"
      Mid: "0.89"
      MidFreq: "2"
      Ripple: "0.5"
      Sag: "0.5"
      Treble: "0.88"
    evidence:
    - caveat: |-
        a genre measured off finished records, so the figures carry the amplifier, the microphone, the desk and the master of every one of them. The amplifier below is what sits nearest those figures, not one anybody is known to have used.
        It also moves. A genre is measured against the players who play none of it, so this answer changes when the corpus gains players, and it is worth rebuilding rather than trusting indefinitely.
      kind: audio
      note: |-
        chosen by measurement rather than by anybody's say-so. Across 21 records from 7 players, punk measures a centroid the device's nearest bass amplifier sits at 189 Hz against 195, which is the closest of the twenty-seven it models for this instrument.
        Its records earn mid-forward and bright.
    gear: Ampeg SVT (bright channel)
    role: amp
  - capture: direct
    confidence: low
    controls:
      Distance: "1.0"
      EarlyReflections: "0.0"
      High Cut: "8000.0"
      Level: "0.0"
      LowCut: "19.9"
    evidence:
    - caveat: a habit rather than a measurement of these records. Nothing here says
        this genre was recorded through one.
      kind: corpus
      note: what presets for this instrument almost always hold, rather than anything
        about this genre. An eight-by-ten behind a big valve head is the ordinary
        pairing in the preset corpus.
    gear: 8x10 Ampeg SVT-E
    role: cab
  instrument: bass
  resolved:
    catalog: HX Edit 3.82
    device: HX Stomp
schema: ToneSpec
