# Hard rock — the genre, not a player
#
# A rig for the sound of a genre rather than for somebody who plays it. The
# artists under ../artists/ are people; this is what the records of a genre
# measure as, resolved to gear.
#
# Built rather than researched, then resolved: `tone build` ranked the device's
# bass amplifiers against what hard-rock measures as and took the nearest, and
# `rigs resolve` wrote every control that came out. Both are reproducible on the
# same corpus.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
ask:
  aliases:
  - hard-rock-sound
  confidence: low
  genre:
  - hard-rock
  instrument: bass
  subject:
    kind: genre
    name: Hard rock
  words: []
id: hard-rock
rig:
  chain:
  - attrs:
      '@position': "0"
    controls:
      Attack: "0.035"
      Knee: "6.0"
      Level: "5.2"
      Mix: "1.0"
      Ratio: "3"
      Release: "0.2"
      Threshold: "-37.1"
    evidence:
    - kind: corpus
      note: 'added by the compiler rather than named in the rig: a chain of this kind
        almost always holds one, and the corpus statistics are what put it here.'
    gear: Deluxe Comp
    position: 0
    role: comp
  - attrs:
      '@position': "1"
    capture: direct
    confidence: low
    controls:
      Bass: "0.49"
      Bias: "0.5"
      BiasX: "0.6"
      ChVol: "0.6"
      Drive: "0.55"
      HighMid: "0.62"
      Hum: "0.5"
      Master: "0.55"
      Mid: "0.52"
      Ripple: "0.5"
      Sag: "0.72"
      Treble: "0.87"
    evidence:
    - caveat: 'A genre measured off finished records, so the figures carry the amplifier,
        the microphone, the desk and the master of every one of them. The amplifier
        below is what sits nearest those figures, not one anybody is known to have
        used. It also moves: a genre is measured against the players who play none
        of it, so this answer changes when the corpus gains players, and it is worth
        rebuilding rather than trusting indefinitely. Grunge is the example. It held
        scooped, dark and clean; twenty-five records from five other genres joined
        the corpus and it held nothing, because the rule then asked a genre to be
        unusual rather than to be something; it holds scooped again now that words
        may overlap, and clean is gone from every subject because a low share of energy
        above the fundamental turned out not to be evidence of no drive.'
      kind: audio
      note: Chosen by measurement rather than by anybody's say-so. Across 16 records
        from 5 players, hard rock measures a centroid the device's nearest bass amplifier
        sits at 159 Hz against 155, which is the closest of the 27 it models for this
        instrument. Its records earn long-decay, measured against the players who
        play none of it, and that is what moves the controls below off the medians
        this instrument's presets sit at.
    gear: MESA/Boogie Bass 400+ (channel 2)
    position: 1
    role: amp
  - attrs:
      '@position': "2"
    controls:
      Distance: "1.0"
      EarlyReflections: "0.0"
      HighCut: "8000.0"
      Level: "0.0"
      LowCut: "19.9"
    evidence:
    - kind: corpus
      note: 'added by the compiler rather than named in the rig: a chain of this kind
        almost always holds one, and the corpus statistics are what put it here.'
    gear: Legacy 6x10" MESA/Boogie Power House
    position: 2
    role: cab
  instrument: bass
  preset:
    dsp0:
      members:
        inputA:
          attrs:
            '@input': "1"
          controls:
            decay: "0.5"
            noiseGate: "false"
            threshold: "-48"
