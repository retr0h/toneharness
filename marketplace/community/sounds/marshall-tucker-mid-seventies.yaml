# Marshall Tucker, 1974 to 1975 — a sound, not somebody's rig
#
# Attributed to a sound because the gear is not established. Tommy Caldwell of
# The Marshall Tucker Band played these records and what he played them through is not
# known, so claiming a rig for him would be inventing one. This is the
# amplifier that measures nearest the records themselves.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
id: marshall-tucker-mid-seventies

ask:
  genre: [southern-rock]

  subject:
    kind: sound
    name: Marshall Tucker, 1974 to 1975
    era: A New Life and Searchin' for a Rainbow, 1974 to 1975

  instrument: bass

  words: []

  confidence: low

rig:
  instrument: bass

  chain:
    - role: amp
      gear: Acoustic 360
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          note: >-
            Chosen by measurement rather than by anybody's say-so. The device's
            twenty-seven bass amplifiers were ranked against Tommy Caldwell's own
            separated bass stems, one record at a time, and the Acoustic 360 came
            nearest on two of the three; the third picked an Aguilar DB51. It reads 91
            Hz against 112 on one record and 128 on the other. Run it again on the
            same stems and it answers the same way.
          caveat: >-
            **This is not a claim about what Tommy Caldwell played.** His amplifier is
            not established, and the primary source was opened and settles it
            negatively. One Guitar Player interview with him exists, and JTE, who read
            it, reports: "I have no idea about amps. Partly because I just didn't pay
            much attention to that at the time, and partly because the interview
            barely touched on gear." So this document is attributed to a sound rather
            than to him: it is the amplifier nearest these 3 records, and nothing
            more. Two things make it weak even as that. The records disagree, and the
            caveat above says how. And the winners of this comparison cluster at the
            dark end of what the device has: the Acoustic 360 reads 91 Hz and the Sunn
            Coliseum 300 reads 98 Hz, the two darkest bass amplifiers it models, and
            every record here sits below most of the candidates. That is the pathology
            the measured library's own notes record, where every candidate is out of
            range and the nearest is whichever is darkest. It is here because it is
            buildable and honest, not because it is settled. A cited amplifier for
            Tommy Caldwell would replace it, and a model of the Fender and Peavey
            amplifiers this era actually ran would make the comparison worth more.
    # No cabinet named. The amplifier's own pairing is used, because the
    # measurement chose an amplifier and says nothing about a cabinet.
