  words: []
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg SVT (bright channel)
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: |-
            **This is not a claim about what Klaus Flouride played.** An Acoustic 150B and an Acoustic 402 cabinet are repeated for him everywhere, and the trail ends in nothing: the sentence is uncited on Wikipedia, its paragraph's only footnote is Joe Shooman's MusicRadar interview of 7 December 2017, and that interview names no amplifier anywhere in its body. A TalkBass thread quotes the same Wikipedia line and the poster says twice that he is assuming what "acoustic" means in it.

            The records disagree, and the note says how. Unlike the other sound-alikes here the winner is not at the dark end of the field: these records measure 189 to 220 Hz, which is bright for a bass, and the amplifier chosen sits among them rather than below them. That makes this the strongest of the sound-alikes and still not a claim about his gear.
          note: Chosen by measurement rather than by anybody's say-so. The device's twenty-seven bass amplifiers were ranked against Klaus Flouride's own separated bass stems, one record at a time, and the SVT's bright channel came nearest on two of the three, California Uber Alles and Holiday in Cambodia; the third, Kill the Poor, picked a MESA/Boogie M9 Carbine. It reads 189 Hz against 191 on one and 220 against 207 on the other, which is the closest agreement any sound-alike here has. Run it again on the same stems and it answers the same way.
    - role: cab
      gear: 8x10 Ampeg SVT-E
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
