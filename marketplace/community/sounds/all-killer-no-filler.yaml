# All Killer No Filler — a sound, not somebody's rig
#
# Attributed to a sound because the gear is not established. Cone McCaslin of
# Sum 41 played these records and what he played them through is not
# known, so claiming a rig for him would be inventing one. This is the
# amplifier that measures nearest the records themselves.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# No cabinet named. The amplifier's own pairing is used, because the
# measurement chose an amplifier and says nothing about a cabinet.

