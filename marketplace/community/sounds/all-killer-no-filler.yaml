  - attrs:
      '@position': "1"
    capture: direct
    confidence: low
    controls:
      4kHz: "3.8"
      62p5Hz: "5.7"
      125Hz: "4.7"
      1kHz: "3.7"
      250Hz: "1.3"
      2kHz: "-1.7"
