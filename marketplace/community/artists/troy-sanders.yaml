    evidence:
    - caveat: This rig is half of his and that is why the document sits in community
        rather than core. The Ampeg SVT-VR is the faithful reissue of the amplifier
        this device models, so that half maps exactly. The Mesa Bass Strategy Eight:88
        it is blended with is modelled by nothing here, and neither are the Mesa RoadReady
        cabinets, so what is below is the clean half of a two-amplifier rig and not
        the rig. He is separately on record choosing Gallien-Krueger heads for Leviathan
        because he could not get the sound he wanted out of any Ampeg he tried, so
        this is the 2014 rig and no other, which is why all three records measured
        are from the 2014 album.
      kind: cited
      note: 'A rig rundown of the 2014 touring rig: "A 300-watt Ampeg SVT-VR handles
        his clean sounds, and a 485-watt Mesa/Boogie Bass Strategy Eight:88 drives
        the other half of his rig." And on the cabinets: "Sanders runs each amp into
        two Mesa/Boogie RoadReady cabs, one a 4x12, the other an 8x10."'
      url: https://www.premierguitar.com/rig-rundown-mastodon-2014
