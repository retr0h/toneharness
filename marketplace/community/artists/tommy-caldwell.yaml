# Tommy Caldwell — The Marshall Tucker Band
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# Filed in community because his amplifier is not established. What research
# reaches is "tube amplifiers" with no model, anywhere: the one Guitar Player
# interview barely touches gear, by the account of somebody who read it, and a
# TalkBass thread of eleven posts on his tone names no amplifier in any of
# them. They are about his thumb, his DiMarzio pickup and a hunk of plastic he
# palmed to fortify his thumbnail.
#
# So the amplifier below is measured rather than claimed, where it used to be
# an Ampeg SVT on no source at all. It is what his own records rank nearest,
# and the sound-alike beside this (marshall-tucker-mid-seventies) is the
# document that answers for the sound. The instrument and the right hand are
# sourced, and on this player the right hand is most of the sound.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, and where each one falls".

ask:
  aliases:
  - caldwell
  - marshall-tucker
  - tucker
  confidence: low
  genre:
  - southern-rock
  instrument: bass
  played:
  - evidence:
    - caveat: posters describing a career rather than a session, and none of it is
        dated to this record. Roundwounds on a Precision is the part that matters
        to a measurement and the part least likely to be wrong.
      kind: user
      note: 'a white Precision with Rotosound roundwounds, and DiMarzio pickups fitted
        for a reason nobody would invent: he sweated enough to short the stock ones,
        and waxed the underside of the pickguard against it.'
      url: https://www.talkbass.com/threads/the-late-great-tommy-caldwell.506127/
    gear: Fender Precision Bass
    strings: round
  subject:
    band: The Marshall Tucker Band
    era: Searchin' for a Rainbow
    kind: artist
    name: Tommy Caldwell
    years:
      from: 1975
      to: 1975
  technique:
    attack: thumb
    evidence:
    - caveat: somebody watching a film of a 1975 show, which is the right year for
        this record and is still not these sessions.
      kind: user
      note: |-
        the poster jerry, who saw them, on the 1975 Volunteer Jam footage: "It's so cool on that DVD to see the two late great Caldwell brothers smokin' on their instruments with their thumbs.* *not slap."
        The asterisk is his, and it is the useful half: a thumb that is not slap is a different attack again, and it is what the transcriptions call his percussive style.
      url: https://www.talkbass.com/threads/charlie-hayward.382533/
id: tommy-caldwell
