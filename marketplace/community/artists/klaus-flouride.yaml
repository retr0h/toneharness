# Klaus Flouride — Dead Kennedys
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# Filed in community because his amplifier is not established.
#
# This file used to say the Acoustic 150B and Acoustic 402 were "real and now
# properly sourced: the Wikipedia entry's own footnote is a MusicRadar
# interview with Flouride himself". The footnote was never opened. Joe
# Shooman's MusicRadar interview of 7 December 2017 names no amplifier
# anywhere in its body, the Wikipedia sentence carrying the models has no
# citation of its own, and the TalkBass thread that repeats it is quoting that
# same sentence with the poster saying twice that he is assuming what
# "acoustic" means in it. A footnote on the paragraph is not a source for the
# sentence.
#
# So the amplifier below is measured rather than claimed: it is what his own
# records rank nearest, and the sound-alike beside this
# (fresh-fruit-for-rotting-vegetables) is the document that answers for the
# sound. Nothing is deleted, the player stays, and a cited amplifier moves
# this back across to core.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, and where each one falls".

