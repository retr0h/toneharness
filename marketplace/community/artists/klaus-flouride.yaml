    - role: amp
      gear: Ampeg SVT (bright channel)
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: |-
            **Not a claim about what he played.** This was an Ampeg SVT asserted by a model and confirmed by nobody until the research was done and found nothing; a measured amplifier is at least reproducible, and this is the only reason it is here rather than that one.

            The records disagree, one of three picking something else, and the field they were ranked against is mostly darker than they are. The sound-alike says how. A cited amplifier would replace this outright, and this document stays in community until one exists.
          note: Chosen by measurement rather than asserted. Ampeg SVT (bright channel) was researched and bottomed out. An Acoustic 150B and an Acoustic 402 cabinet are repeated for him everywhere and the trail ends in nothing. The sentence is uncited on Wikipedia; its paragraph's only footnote is Joe Shooman's MusicRadar interview of 7 December 2017, which names no amplifier anywhere in its body; and the TalkBass thread that carries the same claim is quoting that Wikipedia line, with the poster saying twice that he is assuming what "acoustic" means in it. So the device's twenty-seven bass amplifiers were ranked against his own separated bass stems, one record at a time, across California Uber Alles, Holiday in Cambodia and Kill the Poor, and this is the one that came nearest on two of the three. The vote, the margins and what is weak about them are in the fresh-fruit-for-rotting-vegetables sound-alike beside this, which is the document that answers for the sound rather than for him.
