# Filed in community because this device does not model its gear.
#
# A Marshall Major, cited, and modelled by nothing here. The name resolves
# to an Ampeg SVT.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, not one". Nothing here is deleted: the
# research stands and the player stays, and a rig that clears both bars
# later moves back across.
#
# Dan Andriano — Alkaline Trio
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

schema: ToneSpec
version: 4.0.0
id: dan-andriano
ask:
  confidence: medium
  genre:
    - pop-punk
    - punk
  instrument: bass
  played:
    - gear: Fender '62 Reissue Precision Bass
      evidence:
        - kind: cited
          caveat: |-
            the same gear box names four other instruments, a GPC signature bass and Fender Jazz reissues among them, and he does not say which is on which song. This takes the one he accounts for in his own words and dates to five years before these records.
            Strings are left out rather than guessed. The box says "Ernie Ball" and that brand makes both, so nothing read here says round or flat.
          note: 'he says how he came to them, and that they are what he plays now: "When we worked with producer Jerry Finn on Crimson [Vagrant, 2005], I played his ''62 Fender P-Bass, which was the nicest bass I''ve ever played... As soon as we finished making that record, I bought two Fender ''62 Reissue Precision Basses and sanded the finish off the necks to give them a wornin feel. Now I do that to all my basses."'
          url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
  subject:
    kind: artist
    name: Dan Andriano
    band: Alkaline Trio
    era: This Addiction
    years:
      from: 2010
      to: 2010
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Marshall Major
      confidence: medium
      substitute:
        gear: Ampeg SVT
        confidence: low
        evidence:
          - kind: cited
            caveat: |-
              this is a device limit, not a claim that the two amplifiers sound alike. Line 6 model no Marshall Major, and the ones they do model are all guitar amps, which this tool will not put in a bass chain. Of the bass amplifiers it has, the SVT is the only one he is known to have owned.
              He says the Major is what he records with and does not say that of the SVT, so this stands in for the recorded sound with something from the right rig rather than the right room.
            note: the same article's gear box lists his rig as "Orange AD-200B with Orange 4x10 cabs; Ampeg SVT; '71 Marshal Major", so the SVT is an amplifier he is documented as owning alongside the Major rather than one picked for sounding like it.
            url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
      evidence:
        - kind: cited
          caveat: |-
            he names it as what he records with rather than as what is on this record. The interview is dated 30 April 2010 and This Addiction came out that February, so the statement is present tense either side of it, and the article's own gear box lists the Major among his rig. That is as close as anything read here gets, and it is not the same as him saying he used it on these three songs.
            The Orange AD-200B in the same box is the live rig by his own sentence, so it is not here.
          note: 'asked what he had learned about getting the most from his gear, he separates the stage from the tape himself: "Live, I play though an Orange rig, but the amp I like to record with is a 1971 Marshall Major head. It''s the best sounding amp I''ve ever played through." He says what it does: "It''s a 200-watt head... with bass it sounds perfect. It gets pretty gnarly, but it stays smooth. It''s almost like naturally compressed sound."'
          url: http://web.archive.org/web/20191121043100/https://www.bassplayer.com/artists/alkaline-trio39s-dan-andriano-on-punk-production
    - role: cab
      gear: 8x10 Ampeg SVT-E
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
