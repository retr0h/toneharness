# Charlie Hayward — The Charlie Daniels Band
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# Filed in community because his amplifier is not established. The research
# bottomed out: the only TalkBass thread about him discusses his basses and
# never an amp, and the Aguilar head and Mesa cabinet that circulate for his
# live rig trace to equipboard, which scrapes Wikipedia and tags its own
# entries unverified.
#
# So the amplifier below is measured rather than claimed, where it used to be
# an Ampeg SVT on no source at all. It is what his own records rank nearest,
# and the sound-alike beside this (million-mile-reflections) is the document
# that answers for the sound. The instrument is on film and stays as it was.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, and where each one falls".

schema: ToneSpec
version: 4.0.0
id: charlie-hayward
ask:
  confidence: low
  aliases:
    - hayward
    - charlie-daniels
    - cdb
  genre:
    - southern-rock
  instrument: bass
  played:
    - gear: Fender Precision Bass
      evidence:
        - kind: video
          caveat: a '51-style Precision with a split coil is a hybrid rather than either stock model, and the device models no instrument, so this says how to read the recording and sets nothing. Four years before this record, and both accounts are people watching a film.
          note: 'two posters describing the same footage, the Volunteer Jam 1975 DVD, which is close in period to this record. The poster denton57: "lots of closeups on Charlie with his ''51ish P with a split coil pickup". The poster SwitchGear, who also saw the band live several times in the late seventies: "Interesting ''51 style P he is playing equipped with split coil pups. Sounds good and growly."'
          url: https://www.talkbass.com/threads/charlie-hayward.382533/
  subject:
    kind: artist
    name: Charlie Hayward
    band: The Charlie Daniels Band
    era: Million Mile Reflections
    years:
      from: 1979
      to: 1979
rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Ampeg B-15NF Portaflex
      capture: direct
      confidence: low
      evidence:
        - kind: audio
          caveat: |-
            **Not a claim about what he played.** This was an Ampeg SVT asserted by a model and confirmed by nobody until the research was done and found nothing; a measured amplifier is at least reproducible, and this is the only reason it is here rather than that one.

            The records disagree, one of three picking something else, and the field they were ranked against is mostly darker than they are. The sound-alike says how. A cited amplifier would replace this outright, and this document stays in community until one exists.
          note: Chosen by measurement rather than asserted. Ampeg B-15NF Portaflex was researched and bottomed out. Nothing names his amplifier. What is written about him is about his playing, and the gear pages that carry a figure for him carry it with nothing underneath. So the device's twenty-seven bass amplifiers were ranked against his own separated bass stems, one record at a time, across Behind Your Eyes, Mississippi and Passing Lane, and this is the one that came nearest on two of the three. The vote, the margins and what is weak about them are in the million-mile-reflections sound-alike beside this, which is the document that answers for the sound rather than for him.
    - role: cab
      gear: 1x15" Ampeg B-15
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
