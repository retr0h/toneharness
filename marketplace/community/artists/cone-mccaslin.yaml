# Cone McCaslin — Sum 41
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# Filed in community because his amplifier is not established. An Ampeg SVT-CL
# and an SVT-1000 are widely listed for him, but only on equipboard and
# uberproaudio, and he is not on Ampeg's own artist roster. The Sum 41 gear
# rundown covers the guitarists' Soldano and Marshalls and mentions him only to
# say which bass he swaps to.
#
# So the amplifier below is measured rather than claimed, where it used to be
# an Ampeg SVT with a cabinet beside it on the same nothing. It is what his own
# records rank nearest, and the sound-alike beside this
# (all-killer-no-filler) is the document that answers for the sound.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, and where each one falls".

