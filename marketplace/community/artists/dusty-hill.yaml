# Dusty Hill — ZZ Top
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.
#
# Filed in community because this device does not model its gear, and because
# the era does not match the records.
#
# His amplifier is now sourced: a Marshall JMP-1 into Marshall Valvestate 8008
# power amps, named by his own tech on camera in Premier Guitar's 2015 rig
# rundown. The device models neither, and 2015 is not Tres Hombres. What he
# played in 1973 is still not established.
#
# This replaced a Marshall Super Lead 100 that rested on no source at all.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, and where each one falls".

