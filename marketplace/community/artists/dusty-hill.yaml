      Sag: '0.5'
      Treble: '0.73'
    evidence:
    - caveat: 'Two things stop this being his rig for the records measured here,
        and both matter.

        **It is the wrong era.** This is the 2015 touring rig and the three records
        measured for him are Tres Hombres, 1973. Nothing found establishes what
        he played through then, and the Marshall Super Lead this document used to
        assert had no source at all: Premier Guitar''s ZZ Top gear gallery and their
        obituary for him were both opened looking for it and neither carries it.
        The guess landed in the right family by luck and nothing more.

        **And the device models neither box.** A Marshall JMP-1 is a rack preamp
        and the Valvestate 8008 a hybrid power amp; this device''s Marshalls are
        all guitar heads, a JCM-800, a JTM-45, a JTM-50 and a Super Lead. The JMP-1
        was built to give JCM-800 voicings in a rack, so Brit 2203 is its nearest
        relative here, and a relative is a substitution rather than a match.

        Worth somebody''s time: the octave is a word this vocabulary can express,
        `sub-octave`, and the high-pass before it is why it tracks cleanly. A rig
        aimed at his later sound could be built from that even though the amplifier
        cannot.

        Taken from the video''s own captions rather than from watching it, so the
        spoken model numbers are as the automatic transcript renders them: "the
        808s" for the 8008, and "Micro Thumpin" for the Micro Thumpinator.'
      kind: cited
      note: 'The one amplifier anybody has documented for him, and it is his tech
        saying it on camera. Elwood Francis, who handled all of ZZ Top''s gear on
        the 2015 tour, walking through Dusty''s rig in Premier Guitar''s rig rundown:
        "this whole thing is Dusty''s rigs, the main and the spare. It''s really
        simple. Just wireless into an amp splitter into a bunch of amps and a DI.
        He uses the JMP-1s and the Marshall Valvestate, what are these, the 808s
        I think." He runs one dirty channel and keeps the other two as spares.

        The rest of the chain, from the same walkthrough, because it explains the
        sound better than the amplifier does: "a signal goes from the bass into
        the splitter into the Marshall into a direct box and into this is an octave
        down and this is a filter that takes everything from the low B down", a
        Micro Thumpinator, "it filters off everything below B flat cause we want
        the octave down effect on every note except B flat and lower". Three channels
        are blended: "just clean clean DI, the octave DI, and a dirty amp", and
        the amp goes "to an ISO cabinet and it''s miked in there". On how it reads
        to anybody standing near it: "when I check Dusty''s bass I mean people look
        around like man what''s going wrong because it''s really really big and
        distorted".'
      url: https://www.youtube.com/watch?v=1x_kg6pOvGU
