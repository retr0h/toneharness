# Filed in community because this device does not model its gear.
#
# A Peavey F-800B, cited, and modelled by nothing here. The name resolves to
# a Sunn Coliseum 300.
#
# core/ requires two things of every rig: a source somebody opened for each
# claim, and no gear substituted by the gear map. See build-a-rig's
# shipping.md, "Two bars for core, not one". Nothing here is deleted: the
# research stands and the player stays, and a rig that clears both bars
# later moves back across.
#
# Leon Wilkeson — Lynyrd Skynyrd
#
# One document: the ask says who it is for, the rig below says what the gear is.
#
# Street Survivors rather than Second Helping, and that is the evidence choosing
# the record: the only session-specific account of his rig is about these
# sessions, so this is the album where the gear and the figures describe the
# same thing.
#
# See pkg/sdk/tone/data/tonespec.openapi.yaml for what a ToneSpec may hold.

