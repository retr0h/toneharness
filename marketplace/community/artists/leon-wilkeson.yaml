rig:
  chain:
    - role: comp
      gear: Deluxe Comp
      evidence:
        - kind: corpus
          note: 'added by the compiler rather than named in the rig: a chain of this kind almost always holds one, and the corpus statistics are what put it here.'
    - role: amp
      gear: Peavey F-800B
      capture: both
      confidence: low
      substitute:
        gear: Sunn Coliseum 300
        confidence: low
        evidence:
          - kind: llm
            caveat: asserted by a model and confirmed by nobody. Different manufacturers, and nothing has measured one against the other. If you know a nearer match in this catalog, please open a pull request.
            note: class and era. The F-800B is a solid-state head of the middle seventies and the Coliseum 300 is the only solid-state head of those years this device models. Line 6 model two Peavey amplifiers and both are later guitar heads.
      evidence:
        - kind: cited
          caveat: |-
            the page would not open in full. Guitar World serves this behind a membership prompt, so the sentence was not read in place and what is quoted above is the claim as it is reported rather than as it is printed. The underlying source is a print magazine from two months after the record, which is the right distance; somebody with the issue should confirm the wording.
            `capture: both` is from the same account: miked and direct together is what it describes, and it is the one claim here that says how the bass reached the tape rather than what it came out of.
          note: 'the session rig, reported from the January 1978 issue of Modern Recording: a Peavey F-800B head into an 8x10 Altec cabinet, miked with an Electro-Voice RE-20, and taken direct as well.'
          url: https://www.guitarworld.com/features/lynyrd-skynyrd-icon-ed-king-on-bassist-leon-wilkeson
    - role: cab
      gear: Altec 8x10
      capture: both
      confidence: low
      substitute:
        gear: Ampeg 8x10
        confidence: low
        evidence:
          - kind: llm
            caveat: asserted by a model. Altec built the drivers that made that cabinet what it was, and an Ampeg eight-by-ten is a different speaker in a different cabinet.
            note: the device models no Altec cabinet. Of the eight-by-tens it does carry, the Ampeg is the same complement of speakers in the same size of box.
      evidence:
        - kind: cited
          caveat: the same source as the head and the same unopened page, so the two share it and stand or fall together.
          note: the same account as the head, which names the 8x10 Altec and the Electro-Voice RE-20 in front of it.
          url: https://www.guitarworld.com/features/lynyrd-skynyrd-icon-ed-king-on-bassist-leon-wilkeson
  instrument: bass
