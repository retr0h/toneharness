    note: >-
      Dose. 313 seconds as Spotify holds it. It replaced John the Revelator,
      whose separated bass read a centroid of 947Hz with 53% of its energy in
      the mid band, against 126Hz and 3% on Blind Man in the Dark and 167Hz and
      11% on Thorazine Shuffle. Nothing in the corpus reads above 264Hz, so
      that stem was not a bass however the file was fetched: an older download
      of the same song read 550Hz and a refetch matching Spotify's length to
      the second read 937Hz. His three records spanned 821Hz of centroid and he
      earned nothing but `scattered` on them. This one reads 138Hz and 4%.


      Mother Earth and Rocking Horse are the other two the album offers and
      both resolve to The Tel-Star Sessions, a 2016 release of 1994 demos,
      which is neither the album nor the era.
